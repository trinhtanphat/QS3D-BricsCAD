changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "🚀 Features & UX"
      labels:
        - enhancement
        - feature
        - ui
    - title: "🐛 Fixes"
      labels:
        - bug
        - fix
    - title: "⚙️ Build, CI & maintenance"
      labels:
        - build
        - ci
        - maintenance
        - chore
        - dependencies
    - title: "📚 Documentation"
      labels:
        - documentation
    - title: "📦 Other changes"
      labels:
        - "*"
