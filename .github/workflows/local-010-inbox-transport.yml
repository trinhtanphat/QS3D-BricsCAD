name: LOCAL-010 Inbox Transport

on:
  push:
    branches:
      - "agent/6a816051/issue-3928-local010-runner"

permissions:
  contents: write

jobs:
  patch-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply and commit bounded LOCAL-010 handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/LOCAL-AGENT-INBOX.md')
          s = p.read_text(encoding='utf-8')
          start = s.index('## LOCAL-010 — large-model performance and UI matrix')
          end = s.index('## LOCAL-011 — staged native rollback and post-commit UI isolation', start)
          section = s[start:end]
          if 'scripts/run-local-v25-local-010.ps1' in section:
              print('LOCAL-010 inbox handoff already wired')
              raise SystemExit(0)
          needle = '- Area: Performance / UI / HiDPI\n'
          if section.count(needle) != 1:
              raise SystemExit('LOCAL-010 Area anchor must occur exactly once')
          addition = (
              needle
              + '- Source/runner status: `SOURCE_READY / PENDING_LOCAL / DO_NOT_RETRY_REMOTE`.\n'
              + '- Runner: `scripts/run-local-v25-local-010.ps1`\n'
              + '- Runbook: `docs/LOCAL-010-PERFORMANCE-UI-QUALIFICATION.md`\n'
              + '- Remote disposition: `REMOTE_DONE / PENDING_LOCAL / DO_NOT_RETRY_REMOTE`\n'
              + '- Local handoff: From one clean exact intended `main` SHA containing this runner/runbook, with licensed interactive BricsCAD V25 x64 and zero pre-existing BricsCAD processes, **pull/sync only and run one command**: `powershell -ExecutionPolicy Bypass -File .\\scripts\\run-local-v25-local-010.ps1`. Do not patch production source in this local lane.\n'
              + '- Exact-source rule: Evidence is valid only for the runner-reported exact checkout SHA and matching V25/plugin identity. A newer intended `main` candidate requires a clean restart from the beginning; hosted/source CI never manufactures `LOCAL_PASS`.\n'
              + '- Result semantics: `artifacts/local-v25-local-010/qualification.json` records exact SHA, Windows/V25 identity, canonical baseline and per-row `PASS`/`FAIL`/`BLOCKED` evidence; runner exit 0/1/2/3 means complete PASS/FAIL/BLOCKED/NO_RESULT and `localPassClaimedByRunner=false`.\n'
              + '- Cleanup/host-major boundary: Use sanitized/disposable projects only, publish no private paths/raw Handles/ProjectIds/proprietary files, preserve user/DemandLoad state, never kill unrelated BricsCAD sessions, and finish with zero test-owned BricsCAD process residue. This runner qualifies V25 only; V26 requires its matching assembly/runtime and must never reuse or relabel the V25 binary.\n'
          )
          p.write_text(s[:start] + section.replace(needle, addition, 1) + s[end:], encoding='utf-8', newline='')
          PY
          if git diff --quiet -- docs/LOCAL-AGENT-INBOX.md; then
            echo "No inbox patch required."
            exit 0
          fi
          read -r added deleted changed_path <<< "$(git diff --numstat -- docs/LOCAL-AGENT-INBOX.md)"
          test "$added" = "8"
          test "$deleted" = "0"
          test "$changed_path" = "docs/LOCAL-AGENT-INBOX.md"
          git diff --check -- docs/LOCAL-AGENT-INBOX.md
          git diff -- docs/LOCAL-AGENT-INBOX.md
          git config user.name "QS3D LOCAL-010 handoff"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LOCAL-AGENT-INBOX.md
          git commit -m "docs(local): wire LOCAL-010 pull-and-run handoff"
          git push origin "HEAD:${GITHUB_REF_NAME}"
