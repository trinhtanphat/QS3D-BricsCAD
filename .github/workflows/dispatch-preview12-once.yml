name: Dispatch V25 Preview 12 Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-preview12-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch V25 preview 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-v25-cloud.yml \
            --repo "trinhtanphat/QS3D-BricsCAD" \
            --ref main \
            -f release_tag=v0.1.0-preview.12 \
            -f confirm_release=RELEASE
