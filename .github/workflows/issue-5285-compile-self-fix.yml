name: Issue 5285 compile self-fix

on:
  push:
    branches:
      - agent/trinhtanphat/issue-5285-chatgpt-onboarding-pro-dark-ui
    paths:
      - .github/workflows/issue-5285-compile-self-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch compile-time naming collisions
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/QS3D.BricsCAD.V25/McpCloudflareAccountOnboarding.cs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "private static readonly Brush BorderBrush = Brush(Color.FromRgb(48, 54, 61));",
                  "private new static readonly Brush BorderBrush = Brush(Color.FromRgb(48, 54, 61));",
              ),
              (
                  "Property = Button.IsPressedProperty, Value = true",
                  "Property = System.Windows.Controls.Button.IsPressedProperty, Value = true",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Commit source-only fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/QS3D.BricsCAD.V25/McpCloudflareAccountOnboarding.cs
          git rm .github/workflows/issue-5285-compile-self-fix.yml
          git commit -m "fix(v25): resolve onboarding UI compile collisions"
          git push origin HEAD:"${GITHUB_REF_NAME}"
