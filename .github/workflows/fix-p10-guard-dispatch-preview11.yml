name: Repair P10 guard and dispatch preview.11

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-p10-guard-dispatch-preview11.yml

permissions:
  contents: write
  actions: write

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Align completed P10 guard, self-remove, and dispatch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          target='scripts/preflight-curtain-panel-workspace-review-runtime-probe.py'
          helper='.github/workflows/fix-p10-guard-dispatch-preview11.yml'

          gh api "repos/${repo}/contents/${target}?ref=main" > /tmp/file.json
          sha="$(jq -r .sha /tmp/file.json)"
          jq -r .content /tmp/file.json | tr -d '\n' | base64 -d > /tmp/preflight.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/preflight.py')
          s = p.read_text(encoding='utf-8')
          old = '''for token in (\n    '- Status: `ACTIVE`',\n    'LOCAL-002 / P0 / P10',\n    'Production Workspace/Curtain ownership behavior remains read-only',\n    'or GitHub Actions',\n):\n    if token not in claim:\n        errors.append("Curtain P10 claim missing ownership boundary: " + token)'''
          new = '''for token in (\n    '- Status: `COMPLETED`',\n    'LOCAL-002 / P0 / P10',\n    'Production Workspace/Curtain ownership behavior remains read-only',\n    'or GitHub Actions',\n    '## 2026-08-14 licensed PASS and closeout',\n    'P10 is `LOCAL_PASS` and this bounded claim is `COMPLETED`.',\n    'Overall LOCAL-002 remains `PENDING_LOCAL`',\n):\n    if token not in claim:\n        errors.append("Curtain P10 claim missing completed ownership/evidence boundary: " + token)'''
          if old not in s:
              raise SystemExit('expected ACTIVE P10 guard block not found; refusing speculative rewrite')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          content="$(base64 -w 0 /tmp/preflight.py)"
          gh api --method PUT "repos/${repo}/contents/${target}" \
            -f message='ci: align P10 guard with licensed completion' \
            -f content="$content" \
            -f sha="$sha" \
            -f branch='main'

          helper_sha="$(gh api "repos/${repo}/contents/${helper}?ref=main" --jq .sha)"
          gh api --method DELETE "repos/${repo}/contents/${helper}" \
            -f message='ci: remove P10 repair dispatcher' \
            -f sha="$helper_sha" \
            -f branch='main'

          gh workflow run release-v25-cloud.yml --repo "${repo}" --ref main \
            -f release_tag='v0.1.0-preview.11' \
            -f confirm_release='RELEASE'
