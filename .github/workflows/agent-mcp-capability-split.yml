name: One-shot MCP capability lane implementation

on:
  push:
    branches:
      - "agent/chatgpt-web-gpt56sol-20260831/issue-4997-mcp-capability-lanes"

permissions:
  contents: write

concurrency:
  group: one-shot-mcp-capability-lanes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"
      - name: Verify RED, implement, verify GREEN
        run: python scripts/agent-apply-mcp-capability-split.py
      - name: Commit verified implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'One-shot applicator produced no source changes.' }
          git commit -m "feat(mcp): split CAD and QS3D capability lanes"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit verified MCP capability-lane implementation.' }
          git push origin "HEAD:${{ github.ref_name }}"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push verified MCP capability-lane implementation.' }
