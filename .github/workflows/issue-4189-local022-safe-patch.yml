name: issue-4189-local022-safe-patch

on:
  push:
    branches:
      - agent/chatgpt-gpt56sol/issue-4189-local022-inbox-reconcile

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch only LOCAL-022 and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/LOCAL-AGENT-INBOX.md')
          text = path.read_text(encoding='utf-8')
          start_marker = '## LOCAL-022 — Móng đơn placement/edit/save-reopen on V25/V26\n'
          end_marker = '## LOCAL-020 — Grid pair-owned intersection marker native lifecycle\n'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('LOCAL-022 boundary markers must each occur exactly once')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]
          required_old = [
              'SOURCE_FIX_LANDED_#4179',
              'DESCENDANT_10229_ELIGIBLE',
              'Startup source fix: #4173 is source-complete',
              'First post-fix candidate: `v0.1.0-preview.10229`',
          ]
          for token in required_old:
              if token not in old:
                  raise SystemExit(f'expected stale LOCAL-022 token missing: {token}')

          new = '''## LOCAL-022 — Móng đơn placement/edit/save-reopen on V25/V26

- Priority: P0
- Status: IN_PROGRESS
- Area: issue `#4034`; BricsCAD V25/V26 Móng đơn Add/placement/edit/regenerate/save-reopen
- Why local: Final acceptance requires licensed interactive BricsCAD V25/V26 placement, native Foundation geometry, editing/regeneration, persistence and cold-reopen behavior that offline/static gates cannot prove.
- Source/artifact status: `V25_NO_RESULT / V26_NO_RESULT / POST_#4179_10229_NO_RESULT / SOURCE_#4173_REOPENED / WAITING_SOURCE_SUCCESSOR`
- Remote disposition: `PENDING_LOCAL / DO_NOT_RETRY_REMOTE`
- Consumed pre-fix runtime source: `28e48e6dbd4e8976b31ab16f344ce0f76d7a7bf5`.
- Consumed pre-fix verdicts: V25 = `NO_RESULT / STARTUP_WPF_VIRTUALIZATION_EXCEPTION_BEFORE_BASELINE`; V26 = `NO_RESULT / STARTUP_WPF_VIRTUALIZATION_EXCEPTION_BEFORE_BASELINE`. Both reached product/probe `NETLOAD` and `QS3D WILL_START`, but the product baseline never arrived and the Móng đơn acceptance matrix was not run. Both cells completed guarded cleanup and ended `HOST_RELEASED`; no `LOCAL_PASS` exists for this lane.
- Historical source containment: #4173 was initially closed by protected PR #4179 at `main@a7b7dfb456654509c9eccf33f854350a61d9e59d`, but #4173 is now reopened because licensed post-fix runtime reproduced the same startup exception class before baseline. The #4179 landing remains historical source/build evidence only and is insufficient to authorize or qualify LOCAL-022 runtime.
- Consumed post-#4179 artifact: `v0.1.0-preview.10229`; exact source/tag `a7b7dfb456654509c9eccf33f854350a61d9e59d`; ProductVersion `0.1.0-preview.10229`; official V25 ZIP SHA-256 `B7FE681B7958908B6E0E84C76CC6B62E8DFE97B42EAD3F80A4E01864D0F670F1`. Licensed V25 reached product/probe `NETLOAD` and `QS3D WILL_START`, then again stopped before Workspace baseline with `System.InvalidOperationException` beginning at `VirtualizingStackPanel.SetVirtualizationState/GetOwners/MeasureOverrideImpl`. Verdict: `NO_RESULT / STARTUP_WPF_VIRTUALIZATION_EXCEPTION_BEFORE_BASELINE`. No Móng đơn acceptance stage ran. This artifact is `CONSUMED / DO_NOT_RETRY`, not an eligible next candidate and not `LOCAL_PASS`.
- Current source boundary: read-only audit after the `.10229` reproduction shows #4179 disabled recycling virtualization only for Workspace `ModelTree`, while `Theme.xaml` still contains implicit `VirtualizingPanel.VirtualizationMode="Recycling"` setters on other item-control styles. Exact root cause and successor fix ownership remain with canonical source issue #4173; this runtime-only lane must not patch production source.
- Source basis: #4019 / merged PR #4021, restored/finalized by #4058. No production source fix belongs in this runtime-only lane.
- Scenario: after a protected #4173 successor fix lands and a fresh exact descendant artifact is pinned and authorized, independently qualify V25 and V26 Cancel, `H2=0`, repeated placement, edit/regenerate, `H2>0`, semantic/native geometry, a generic Foundation control, `QS3DSAVE`/`QSAVE`, and cold reopen on that one explicitly authorized exact source identity.
- Runtime gate: both `28e48e6d...` pre-fix cells and post-#4179 `.10229@a7b7dfb...` are consumed and non-retryable. Do not fulfill or reuse any earlier `.10229` host-allocation request. No further BricsCAD/shared-host access is allowed for LOCAL-022 until reopened #4173 lands a successor source fix, a fresh exact descendant artifact/source identity is frozen, and a new literal named #72 `HOST_RELEASED` authorization is issued for `#4034 / LOCAL-022`. Later `main` drift alone does not repoint or qualify this runtime lane.
- Evidence required: exact source/ProductVersion/hash identities for matching V25/V26 adapters and dependencies; per-host matrix verdicts; ownership/geometry/persistence checks; sanitized cleanup/no-residue evidence.
- Evidence: pre-fix exact source `28e48e6dbd4e8976b31ab16f344ce0f76d7a7bf5` = V25/V26 `NO_RESULT / STARTUP_WPF_VIRTUALIZATION_EXCEPTION_BEFORE_BASELINE`; post-#4179 `v0.1.0-preview.10229@a7b7dfb456654509c9eccf33f854350a61d9e59d` licensed V25 = `NO_RESULT / STARTUP_WPF_VIRTUALIZATION_EXCEPTION_BEFORE_BASELINE`. All are consumed; no LOCAL-022 `LOCAL_PASS` exists.
- Related docs: `docs/agent-work-claims/2026-08-26-codex-issue4046-restore-single-footing-regression.md`; issues #4034, #4173 and #4189; PRs #4058 and #4179.
- Updated: 2026-08-27

'''
          patched = text[:start] + new + text[end:]
          if patched.count(start_marker) != 1 or patched.count(end_marker) != 1:
              raise SystemExit('patched LOCAL-022 boundaries invalid')
          if patched[:start] != text[:start] or patched[end:] != text[end:]:
              raise SystemExit('content outside LOCAL-022 changed')
          path.write_text(patched, encoding='utf-8')
          PY
          git diff --check
          git diff -- docs/LOCAL-AGENT-INBOX.md
          git rm .github/workflows/issue-4189-local022-safe-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/LOCAL-AGENT-INBOX.md
          git commit -m "docs(local): reconcile LOCAL-022 after post-fix no-result"
          git push origin HEAD:agent/chatgpt-gpt56sol/issue-4189-local022-inbox-reconcile
