name: Dispatch V25 Quantity Geometry Validation Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-v25-quantity-geometry-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for dispatcher cleanup
        run: sleep 30
      - name: Dispatch V25 integration validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run bricscad-v25.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f run_runtime=false
