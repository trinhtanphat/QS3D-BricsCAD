name: Temporary QS3D V25 release loop dispatcher

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ contains(github.event.head_commit.message, '[release-loop]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release-v25-cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/actions/workflows/release-v25-cloud.yml/dispatches \
            -f ref=main \
            -f 'inputs[release_tag]=v0.1.0-preview.4' \
            -f 'inputs[confirm_release]=RELEASE'
