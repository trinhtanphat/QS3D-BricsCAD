name: Auto-ready and auto-merge main PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-merge-main-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Mark ready and enable auto-merge
        shell: bash
        run: |
          set -euo pipefail

          state="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json isDraft,autoMergeRequest --jq '[.isDraft, (.autoMergeRequest != null)] | @tsv')"
          IFS=$'\t' read -r is_draft auto_enabled <<< "$state"

          if [[ "$is_draft" == "true" ]]; then
            gh pr ready "$PR_NUMBER" --repo "$GH_REPO"
          fi

          if [[ "$auto_enabled" != "true" ]]; then
            gh pr merge --auto --merge "$PR_NUMBER" --repo "$GH_REPO"
          fi
