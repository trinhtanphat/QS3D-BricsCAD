name: Auto-update and auto-merge ready main PRs

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-main-pr-${{ github.event.pull_request.number || 'main-sweep' }}
  cancel-in-progress: true

jobs:
  reconcile-and-arm:
    if: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || '' }}
    steps:
      - name: Update stale ready PRs and enable auto-merge
        shell: bash
        run: |
          set -euo pipefail

          process_pr() {
            local pr_number="$1"
            local state
            local pr_state is_draft is_cross_repository merge_state head_oid auto_enabled base_ref

            state="$(gh pr view "$pr_number" --repo "$GH_REPO" --json state,isDraft,isCrossRepository,mergeStateStatus,headRefOid,autoMergeRequest,baseRefName --jq '[.state, .isDraft, .isCrossRepository, .mergeStateStatus, .headRefOid, (.autoMergeRequest != null), .baseRefName] | @tsv')"
            IFS=$'\t' read -r pr_state is_draft is_cross_repository merge_state head_oid auto_enabled base_ref <<< "$state"

            if [[ "$pr_state" != "OPEN" || "$base_ref" != "main" ]]; then
              return 0
            fi

            if [[ "$is_draft" == "true" ]]; then
              echo "PR #$pr_number is Draft (manual hold); skipping update/auto-merge."
              return 0
            fi

            if [[ "$is_cross_repository" == "true" ]]; then
              echo "PR #$pr_number is cross-repository; skipping branch mutation."
              return 0
            fi

            if [[ "$merge_state" == "BEHIND" ]]; then
              gh api --method PUT "repos/$GH_REPO/pulls/$pr_number/update-branch" \
                -f expected_head_sha="$head_oid" >/dev/null
              echo "PR #$pr_number: requested update-branch to current main."
            elif [[ "$merge_state" == "DIRTY" ]]; then
              echo "PR #$pr_number has merge conflicts; manual reconciliation required."
              return 0
            fi

            if [[ "$auto_enabled" != "true" ]]; then
              gh pr merge --auto --merge "$pr_number" --repo "$GH_REPO"
            fi
          }

          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            process_pr "$PR_NUMBER"
            exit 0
          fi

          gh pr list --repo "$GH_REPO" --base main --state open --limit 1000 --json number --jq '.[].number' |
            while IFS= read -r pr_number; do
              [[ -n "$pr_number" ]] || continue
              process_pr "$pr_number"
            done
