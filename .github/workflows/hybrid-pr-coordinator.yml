name: QS3D Hybrid PR Coordinator

"on":
  "pull_request":
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
      - labeled
      - unlabeled
    branches:
      - main
  "push":
    branches:
      - main

permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: qs3d-hybrid-pr-coordinator
  cancel-in-progress: false

jobs:
  arm-native-automerge:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile current PR with protected main and arm native auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.QS3D_AUTOMERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::QS3D_AUTOMERGE_TOKEN is required; coordinator mutations must emit ordinary synchronize/CI events."
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          api_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          author_login="$(jq -r '.user.login // ""' <<<"$pr_json")"
          opted_out="$(jq -r '[.labels[].name] | any(. == "no-automerge")' <<<"$pr_json")"

          if [[ "$state" != "open" || "$base_ref" != "main" || "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR #${PR_NUMBER} is outside the open/main/same-repository coordinator boundary; skipping."
            exit 0
          fi
          if [[ "$api_head_sha" != "$EVENT_HEAD_SHA" ]]; then
            echo "PR #${PR_NUMBER} moved from event head ${EVENT_HEAD_SHA} to ${api_head_sha}; skipping stale event."
            exit 0
          fi

          node_id="$(jq -r '.node_id' <<<"$pr_json")"
          auto_merge_enabled="$(gh api graphql \
            -f query='query($pullRequestId:ID!){node(id:$pullRequestId){... on PullRequest{autoMergeRequest{enabledAt}}}}' \
            -f pullRequestId="$node_id" \
            --jq '.data.node.autoMergeRequest.enabledAt // ""')"

          ineligible="false"
          reason=""
          if [[ "$draft" == "true" ]]; then
            ineligible="true"
            reason="draft"
          elif [[ "$author_login" == "dependabot[bot]" ]]; then
            ineligible="true"
            reason="dependabot[bot]"
          elif [[ "$opted_out" == "true" ]]; then
            ineligible="true"
            reason="no-automerge"
          fi

          if [[ "$ineligible" == "true" ]]; then
            if [[ -n "$auto_merge_enabled" ]]; then
              gh api graphql \
                -f query='mutation($pullRequestId:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$pullRequestId}){pullRequest{number autoMergeRequest{enabledAt}}}}' \
                -f pullRequestId="$node_id" \
                --silent
              echo "Disarmed native auto-merge for PR #${PR_NUMBER}: ${reason}."
            else
              echo "PR #${PR_NUMBER} is ineligible (${reason}); native auto-merge remains off."
            fi
            exit 0
          fi

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current_main_sha}...${api_head_sha}" --jq '.status')"
          if [[ "$compare_status" != "ahead" && "$compare_status" != "identical" ]]; then
            rebase_output=""
            if rebase_output="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
              -f expected_head_sha="$api_head_sha" \
              -f update_method=rebase 2>&1)"; then
              echo "Update with rebase accepted for PR #${PR_NUMBER} at expected_head_sha=${api_head_sha}; fresh synchronize CI owns the new head."
              exit 0
            fi

            if grep -Eq 'HTTP (409|422)' <<<"$rebase_output"; then
              echo "::notice::Rebase update declined for PR #${PR_NUMBER}; trying Update with main (merge): ${rebase_output}"
              merge_output=""
              if merge_output="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" \
                -f expected_head_sha="$api_head_sha" \
                -f update_method=merge 2>&1)"; then
                echo "Update with main accepted for PR #${PR_NUMBER}; fresh synchronize CI owns the new head."
                exit 0
              fi
              if grep -Eq 'HTTP (409|422)' <<<"$merge_output"; then
                echo "::notice::PR #${PR_NUMBER} has a real unresolved update conflict; both rebase and merge-main were safely declined: ${merge_output}"
                exit 0
              fi
              echo "::error::Unexpected merge-main update failure for PR #${PR_NUMBER}: ${merge_output}"
              exit 1
            fi

            echo "::error::Unexpected rebase update failure for PR #${PR_NUMBER}: ${rebase_output}"
            exit 1
          fi

          if [[ -z "$auto_merge_enabled" ]]; then
            gh api graphql \
              -f query='mutation($pullRequestId:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$pullRequestId,mergeMethod:MERGE}){pullRequest{number autoMergeRequest{enabledAt}}}}' \
              -f pullRequestId="$node_id" \
              --silent
            echo "Armed GitHub native auto-merge for current PR #${PR_NUMBER}."
          else
            echo "Native auto-merge already armed for current PR #${PR_NUMBER}."
          fi

  refresh-branches:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Rebase-first refresh remaining eligible PRs from current main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.QS3D_AUTOMERGE_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::QS3D_AUTOMERGE_TOKEN is required; branch refresh must emit ordinary synchronize/CI events."
            exit 1
          fi

          shared_ci_workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml" --jq '.id')"
          if [[ -z "$shared_ci_workflow_id" || "$shared_ci_workflow_id" == "null" ]]; then
            echo "::error::Could not resolve the Shared CI workflow id for ci.yml."
            exit 1
          fi

          set +e
          pr_rows="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" --jq '.[].number'
          )"
          pr_query_status=$?
          set -e
          if (( pr_query_status != 0 )); then
            echo "::error::Could not enumerate open main-targeting PRs; gh api exit ${pr_query_status}."
            exit "${pr_query_status}"
          fi
          pr_numbers=()
          while IFS= read -r number; do
            [[ -n "${number}" ]] || continue
            pr_numbers+=("${number}")
          done <<< "${pr_rows}"

          for number in "${pr_numbers[@]}"; do
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}")"
            state="$(jq -r '.state' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            author_login="$(jq -r '.user.login // ""' <<<"$pr_json")"
            opted_out="$(jq -r '[.labels[].name] | any(. == "no-automerge")' <<<"$pr_json")"

            if [[ "$state" != "open" || "$draft" != "false" || "$base_ref" != "main" ]]; then
              echo "Skipping PR #${number}: not open/non-draft/main."
              continue
            fi
            if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
              echo "Skipping PR #${number}: fork/non-canonical head repository."
              continue
            fi
            if [[ "$author_login" == "dependabot[bot]" ]]; then
              echo "Skipping PR #${number}: dependabot[bot]."
              continue
            fi
            if [[ "$opted_out" == "true" ]]; then
              echo "Skipping PR #${number}: no-automerge."
              continue
            fi

            current_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current_main_sha}...${current_head_sha}" --jq '.status')"

            node_id="$(jq -r '.node_id' <<<"$pr_json")"
            existing="$(gh api graphql \
              -f query='query($pullRequestId:ID!){node(id:$pullRequestId){... on PullRequest{autoMergeRequest{enabledAt}}}}' \
              -f pullRequestId="$node_id" \
              --jq '.data.node.autoMergeRequest.enabledAt // ""')"
            if [[ -z "$existing" ]]; then
              gh api graphql \
                -f query='mutation($pullRequestId:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$pullRequestId,mergeMethod:MERGE}){pullRequest{number autoMergeRequest{enabledAt}}}}' \
                -f pullRequestId="$node_id" \
                --silent
              echo "Armed native auto-merge for PR #${number}."
            fi

            if [[ "$compare_status" == "ahead" || "$compare_status" == "identical" ]]; then
              echo "PR #${number} already contains current main; waiting on protected checks/native auto-merge."
              continue
            fi

            shared_ci_runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${shared_ci_workflow_id}/runs?event=pull_request&head_sha=${current_head_sha}&per_page=100")"
            mapfile -t active_run_ids < <(jq -r --arg head "$current_head_sha" '
              .["workflow" + "_runs"][]
              | select(
                  .head_sha == $head
                  and (
                    .status == "queued"
                    or .status == "in_progress"
                    or .status == "waiting"
                    or .status == "requested"
                    or .status == "pending"
                  )
                )
              | .id
            ' <<<"$shared_ci_runs_json")

            if (( ${#active_run_ids[@]} > 0 )); then
              echo "PR #${number} has active exact-head Shared CI; cancelling stale run(s) before refreshing from main."
              for run_id in "${active_run_ids[@]}"; do
                cancel_output=""
                if cancel_output="$(GH_TOKEN="$ACTIONS_TOKEN" gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" --silent 2>&1)"; then
                  echo "Cancelled stale Shared CI run ${run_id} for PR #${number}."
                  continue
                fi
                if grep -Eq 'HTTP (409|422)' <<<"$cancel_output"; then
                  echo "::notice::Shared CI run ${run_id} left its active state before cancellation completed; refreshing from the main-change snapshot anyway: ${cancel_output}"
                  continue
                fi
                echo "::error::Could not cancel active Shared CI run ${run_id} for PR #${number}: ${cancel_output}"
                exit 1
              done
            else
              latest_completed_conclusion="$(jq -r --arg head "$current_head_sha" '
                [
                  .["workflow" + "_runs"][]
                  | select(.head_sha == $head and .status == "completed")
                ]
                | sort_by(.run_number, .run_attempt)
                | last
                | .conclusion // ""
              ' <<<"$shared_ci_runs_json")"
              if [[ "$latest_completed_conclusion" =~ ^(failure|timed_out|action_required|startup_failure)$ ]]; then
                echo "Skipping PR #${number}: exact-head Shared CI completed RED (${latest_completed_conclusion}); wait for a PR code change instead of spending CI on every main advance."
                continue
              fi
            fi

            rebase_output=""
            if rebase_output="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${number}/update-branch" \
              -f expected_head_sha="$current_head_sha" \
              -f update_method=rebase 2>&1)"; then
              echo "Update with rebase accepted for PR #${number} at expected_head_sha=${current_head_sha}."
              continue
            fi

            if grep -Eq 'HTTP (409|422)' <<<"$rebase_output"; then
              echo "::notice::Rebase update declined for PR #${number}; trying Update with main (merge): ${rebase_output}"
              merge_output=""
              if merge_output="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${number}/update-branch" \
                -f expected_head_sha="$current_head_sha" \
                -f update_method=merge 2>&1)"; then
                echo "Update with main accepted for PR #${number}."
                continue
              fi
              if grep -Eq 'HTTP (409|422)' <<<"$merge_output"; then
                echo "::notice::PR #${number} has a real unresolved update conflict; both rebase and merge-main were safely declined: ${merge_output}"
                continue
              fi
              echo "::error::Unexpected merge-main update failure for PR #${number}: ${merge_output}"
              exit 1
            fi

            echo "::error::Unexpected rebase update failure for PR #${number}: ${rebase_output}"
            exit 1
          done
