name: QS3D Hybrid PR Coordinator

"on":
  "pull_request":
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - unlabeled
    branches:
      - main
  "push":
    branches:
      - main

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: qs3d-hybrid-pr-coordinator
  cancel-in-progress: false

jobs:
  arm-native-automerge:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Arm GitHub native auto-merge for eligible current PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          event_head_sha="$EVENT_HEAD_SHA"
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          api_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          opted_out="$(jq -r '[.labels[].name] | any(. == "no-automerge")' <<<"$pr_json")"

          if [[ "$state" != "open" || "$draft" != "false" || "$base_ref" != "main" ]]; then
            echo "PR #${PR_NUMBER} is not an open non-draft PR targeting main; skipping."
            exit 0
          fi
          if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR #${PR_NUMBER} is not a same-repository PR; skipping."
            exit 0
          fi
          if [[ "$opted_out" == "true" ]]; then
            echo "PR #${PR_NUMBER} carries no-automerge; skipping."
            exit 0
          fi
          if [[ "$api_head_sha" != "$event_head_sha" ]]; then
            echo "PR #${PR_NUMBER} head moved from event_head_sha=${event_head_sha} to api_head_sha=${api_head_sha}; skipping stale event."
            exit 0
          fi

          node_id="$(jq -r '.node_id' <<<"$pr_json")"
          existing="$(gh api graphql -f query='query($id:ID!){node(id:$id){... on PullRequest{autoMergeRequest{enabledAt}}}}' -f id="$node_id" --jq '.data.node.autoMergeRequest.enabledAt // ""')"
          if [[ -n "$existing" ]]; then
            echo "Native auto-merge already armed for PR #${PR_NUMBER}."
            exit 0
          fi

          gh api graphql \
            -f query='mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:MERGE}){pullRequest{number autoMergeRequest{enabledAt}}}}' \
            -f id="$node_id" \
            --silent
          echo "Armed GitHub native auto-merge for PR #${PR_NUMBER} at api_head_sha=${api_head_sha}."

  refresh-branches:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Refresh eligible PR branches from current main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.QS3D_AUTOMERGE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::QS3D_AUTOMERGE_TOKEN is required for PAT-backed update-branch synchronization."
            exit 1
          fi

          mapfile -t pr_numbers < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" --jq '.[].number')

          for number in "${pr_numbers[@]}"; do
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}")"
            state="$(jq -r '.state' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            mergeable="$(jq -r '.mergeable' <<<"$pr_json")"
            mergeable_state="$(jq -r '.mergeable_state' <<<"$pr_json")"
            opted_out="$(jq -r '[.labels[].name] | any(. == "no-automerge")' <<<"$pr_json")"

            if [[ "$state" != "open" || "$draft" != "false" || "$base_ref" != "main" ]]; then
              echo "Skipping PR #${number}: not open/non-draft/main."
              continue
            fi
            if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
              echo "Skipping PR #${number}: fork or non-canonical head repository."
              continue
            fi
            if [[ "$opted_out" == "true" ]]; then
              echo "Skipping PR #${number}: no-automerge."
              continue
            fi
            if [[ "$mergeable" == "false" || "$mergeable_state" == "dirty" ]]; then
              echo "Skipping PR #${number}: conflict/dirty merge state."
              continue
            fi

            current_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            if output="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${number}/update-branch" -f expected_head_sha="$current_head_sha" 2>&1)"; then
              echo "Refresh accepted for PR #${number} at expected_head_sha=${current_head_sha}."
            else
              echo "::notice::Refresh skipped/declined for PR #${number} at expected_head_sha=${current_head_sha}: ${output}"
            fi
          done
