name: QS3D Hybrid PR Coordinator

"on":
  "pull_request":
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - synchronize
      - labeled
      - unlabeled
    branches:
      - main
  "push":
    branches:
      - main
  "workflow_run":
    workflows:
      - "QS3D Shared Branch and Integration CI"
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: qs3d-hybrid-pr-coordinator
  cancel-in-progress: false

jobs:
  arm-native-automerge:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile GitHub native auto-merge for current PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.QS3D_AUTOMERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::QS3D_AUTOMERGE_TOKEN is required; native auto-merge coordination cannot run."
            exit 1
          fi

          event_head_sha="$EVENT_HEAD_SHA"
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          api_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          state="$(jq -r '.state' <<<"$pr_json")"
          draft="$(jq -r '.draft' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          author_login="$(jq -r '.user.login // ""' <<<"$pr_json")"
          opted_out="$(jq -r '[.labels[].name] | any(. == "no-automerge")' <<<"$pr_json")"

          if [[ "$state" != "open" || "$base_ref" != "main" || "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "PR #${PR_NUMBER} is outside the open/main/same-repository coordinator boundary; skipping."
            exit 0
          fi
          if [[ "$api_head_sha" != "$event_head_sha" ]]; then
            echo "PR #${PR_NUMBER} head moved from event_head_sha=${event_head_sha} to api_head_sha=${api_head_sha}; skipping stale event."
            exit 0
          fi

          node_id="$(jq -r '.node_id' <<<"$pr_json")"
          auto_merge_json="$(gh api graphql \
            -f query='query($pullRequestId:ID!){node(id:$pullRequestId){... on PullRequest{autoMergeRequest{enabledAt}}}}' \
            -f pullRequestId="$node_id")"
          existing="$(jq -r '.data.node.autoMergeRequest.enabledAt // ""' <<<"$auto_merge_json")"

          ineligible="false"
          reason=""
          if [[ "$draft" != "false" ]]; then
            ineligible="true"
            reason="draft"
          elif [[ "$opted_out" == "true" ]]; then
            ineligible="true"
            reason="no-automerge"
          elif [[ "$author_login" == "dependabot[bot]" ]]; then
            ineligible="true"
            reason="dependabot[bot]"
          fi

          if [[ "$ineligible" == "true" ]]; then
            if [[ -n "$existing" ]]; then
              gh api graphql \
                -f query='mutation($pullRequestId:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$pullRequestId}){pullRequest{number autoMergeRequest{enabledAt}}}}' \
                -f pullRequestId="$node_id" \
                --silent
              echo "Disarmed GitHub native auto-merge for PR #${PR_NUMBER}: ${reason}."
            else
              echo "PR #${PR_NUMBER} is ineligible (${reason}) and native auto-merge is not armed."
            fi
            exit 0
          fi

          if [[ -n "$existing" ]]; then
            echo "Native auto-merge already armed for PR #${PR_NUMBER} at api_head_sha=${api_head_sha}."
            exit 0
          fi

          gh api graphql \
            -f query='mutation($pullRequestId:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$pullRequestId,mergeMethod:MERGE}){pullRequest{number autoMergeRequest{enabledAt}}}}' \
            -f pullRequestId="$node_id" \
            --silent
          echo "Armed GitHub native auto-merge for PR #${PR_NUMBER} at api_head_sha=${api_head_sha}."

  promote-green-draft:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Promote exact-head GREEN drafts and arm native auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.QS3D_AUTOMERGE_TOKEN }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PULL_REQUESTS_JSON: ${{ toJson(github.event.workflow_run.pull_requests) }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::QS3D_AUTOMERGE_TOKEN is required; green-draft promotion cannot run."
            exit 1
          fi

          event_head_sha="$EVENT_HEAD_SHA"
          mapfile -t pr_numbers < <(jq -r '.[].number' <<<"$RUN_PULL_REQUESTS_JSON")
          if (( ${#pr_numbers[@]} == 0 )); then
            echo "Successful Shared CI run has no associated pull request; nothing to promote."
            exit 0
          fi

          for PR_NUMBER in "${pr_numbers[@]}"; do
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            api_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            state="$(jq -r '.state' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            author_login="$(jq -r '.user.login // ""' <<<"$pr_json")"
            mergeable="$(jq -r '.mergeable' <<<"$pr_json")"
            mergeable_state="$(jq -r '.mergeable_state' <<<"$pr_json")"
            opted_out="$(jq -r '[.labels[].name] | any(. == "no-automerge")' <<<"$pr_json")"

            if [[ "$state" != "open" || "$base_ref" != "main" || "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
              echo "PR #${PR_NUMBER} is outside the open/main/same-repository promotion boundary; skipping."
              continue
            fi
            if [[ "$api_head_sha" != "$event_head_sha" ]]; then
              echo "PR #${PR_NUMBER} head moved from event_head_sha=${event_head_sha} to api_head_sha=${api_head_sha}; skipping stale GREEN evidence."
              continue
            fi
            if [[ "$author_login" == "dependabot[bot]" ]]; then
              echo "Skipping PR #${PR_NUMBER}: dependabot[bot]."
              continue
            fi
            if [[ "$opted_out" == "true" ]]; then
              echo "Skipping PR #${PR_NUMBER}: no-automerge."
              continue
            fi
            if [[ "$mergeable" == "false" || "$mergeable_state" == "dirty" ]]; then
              echo "Skipping PR #${PR_NUMBER}: conflict/dirty merge state."
              continue
            fi

            current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${current_main_sha}...${api_head_sha}" --jq '.status')"
            if [[ "$compare_status" != "ahead" && "$compare_status" != "identical" ]]; then
              if output="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/update-branch" -f expected_head_sha="$api_head_sha" 2>&1)"; then
                echo "Refreshed PR #${PR_NUMBER} from current main; a fresh exact-head Shared CI run is required before promotion."
                continue
              elif grep -Eq 'HTTP (409|422)' <<<"$output"; then
                refreshed_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
                refreshed_head_sha="$(jq -r '.head.sha' <<<"$refreshed_json")"
                latest_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
                latest_compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${latest_main_sha}...${refreshed_head_sha}" --jq '.status')"
                if [[ "$refreshed_head_sha" != "$api_head_sha" ]]; then
                  echo "PR #${PR_NUMBER} changed during refresh reconciliation; a fresh exact-head Shared CI run is required."
                  continue
                fi
                if [[ "$latest_compare_status" != "ahead" && "$latest_compare_status" != "identical" ]]; then
                  echo "::notice::PR #${PR_NUMBER} is still behind/diverged after a safely declined refresh: ${output}"
                  continue
                fi
                pr_json="$refreshed_json"
              else
                echo "::error::Unexpected refresh failure for GREEN draft PR #${PR_NUMBER}: ${output}"
                exit 1
              fi
            fi

            node_id="$(jq -r '.node_id' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            if [[ "$draft" == "true" ]]; then
              ready_json="$(gh api graphql \
                -f query='mutation($pullRequestId:ID!){markPullRequestReadyForReview(input:{pullRequestId:$pullRequestId}){pullRequest{number isDraft headRefOid}}}' \
                -f pullRequestId="$node_id")"
              ready_is_draft="$(jq -r '.data.markPullRequestReadyForReview.pullRequest.isDraft' <<<"$ready_json")"
              ready_head_sha="$(jq -r '.data.markPullRequestReadyForReview.pullRequest.headRefOid' <<<"$ready_json")"
              if [[ "$ready_is_draft" != "false" || "$ready_head_sha" != "$event_head_sha" ]]; then
                echo "::error::PR #${PR_NUMBER} ready transition was not bound to exact GREEN head ${event_head_sha}."
                exit 1
              fi
              echo "Promoted exact-head GREEN PR #${PR_NUMBER} from draft to ready for review."
            elif [[ "$draft" != "false" ]]; then
              echo "::error::PR #${PR_NUMBER} returned an invalid draft state: ${draft}."
              exit 1
            fi

            latest_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            latest_head_sha="$(jq -r '.head.sha' <<<"$latest_json")"
            latest_state="$(jq -r '.state' <<<"$latest_json")"
            latest_base_ref="$(jq -r '.base.ref' <<<"$latest_json")"
            latest_draft="$(jq -r '.draft' <<<"$latest_json")"
            if [[ "$latest_head_sha" != "$event_head_sha" || "$latest_state" != "open" || "$latest_base_ref" != "main" || "$latest_draft" != "false" ]]; then
              echo "PR #${PR_NUMBER} changed after promotion; native auto-merge will not be armed from stale GREEN evidence."
              continue
            fi

            node_id="$(jq -r '.node_id' <<<"$latest_json")"
            auto_merge_json="$(gh api graphql \
              -f query='query($pullRequestId:ID!){node(id:$pullRequestId){... on PullRequest{autoMergeRequest{enabledAt}}}}' \
              -f pullRequestId="$node_id")"
            existing="$(jq -r '.data.node.autoMergeRequest.enabledAt // ""' <<<"$auto_merge_json")"
            if [[ -n "$existing" ]]; then
              echo "Native auto-merge already armed for GREEN PR #${PR_NUMBER}."
              continue
            fi

            gh api graphql \
              -f query='mutation($pullRequestId:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$pullRequestId,mergeMethod:MERGE}){pullRequest{number autoMergeRequest{enabledAt}}}}' \
              -f pullRequestId="$node_id" \
              --silent
            echo "Armed native auto-merge for exact-head GREEN PR #${PR_NUMBER}."
          done

  refresh-branches:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Refresh eligible PR branches from current main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.QS3D_AUTOMERGE_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::QS3D_AUTOMERGE_TOKEN is required; branch refresh cannot run."
            exit 1
          fi

          mapfile -t pr_numbers < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" --jq '.[].number')
          automerge_failures=()

          for number in "${pr_numbers[@]}"; do
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}")"
            state="$(jq -r '.state' <<<"$pr_json")"
            draft="$(jq -r '.draft' <<<"$pr_json")"
            base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
            author_login="$(jq -r '.user.login // ""' <<<"$pr_json")"
            mergeable="$(jq -r '.mergeable' <<<"$pr_json")"
            mergeable_state="$(jq -r '.mergeable_state' <<<"$pr_json")"
            opted_out="$(jq -r '[.labels[].name] | any(. == "no-automerge")' <<<"$pr_json")"

            if [[ "$state" != "open" || "$draft" != "false" || "$base_ref" != "main" ]]; then
              echo "Skipping PR #${number}: not open/non-draft/main."
              continue
            fi
            if [[ "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
              echo "Skipping PR #${number}: fork or non-canonical head repository."
              continue
            fi
            if [[ "$author_login" == "dependabot[bot]" ]]; then
              echo "Skipping PR #${number}: dependabot[bot]."
              continue
            fi
            if [[ "$opted_out" == "true" ]]; then
              echo "Skipping PR #${number}: no-automerge."
              continue
            fi
            if [[ "$mergeable" == "false" || "$mergeable_state" == "dirty" ]]; then
              echo "Skipping PR #${number}: conflict/dirty merge state."
              continue
            fi

            current_head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
            if output="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${number}/update-branch" -f expected_head_sha="$current_head_sha" 2>&1)"; then
              echo "Refresh accepted for PR #${number} at expected_head_sha=${current_head_sha}."
            elif grep -Eq 'HTTP (409|422)' <<<"$output"; then
              echo "::notice::Refresh safely skipped/declined for PR #${number} at expected_head_sha=${current_head_sha}: ${output}"
            else
              echo "::error::Unexpected refresh failure for PR #${number} at expected_head_sha=${current_head_sha}: ${output}"
              exit 1
            fi

            node_id="$(jq -r '.node_id' <<<"$pr_json")"
            if existing="$(gh api graphql \
              -f query='query($pullRequestId:ID!){node(id:$pullRequestId){... on PullRequest{autoMergeRequest{enabledAt}}}}' \
              -f pullRequestId="$node_id" \
              --jq '.data.node.autoMergeRequest.enabledAt // ""' 2>&1)"; then
              if [[ -z "$existing" ]]; then
                if gh api graphql \
                  -f query='mutation($pullRequestId:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$pullRequestId,mergeMethod:MERGE}){pullRequest{number autoMergeRequest{enabledAt}}}}' \
                  -f pullRequestId="$node_id" \
                  --silent; then
                  echo "Armed native auto-merge for existing PR #${number}."
                else
                  echo "::error::Native auto-merge mutation failed for PR #${number}."
                  automerge_failures+=("#${number}:mutation")
                fi
              fi
            else
              echo "::error::Native auto-merge lookup failed for PR #${number}: ${existing}"
              automerge_failures+=("#${number}:lookup")
            fi
          done

          if (( ${#automerge_failures[@]} > 0 )); then
            printf '::error::Native auto-merge reconciliation failed after branch refresh for %s\n' "${automerge_failures[*]}"
            exit 1
          fi
