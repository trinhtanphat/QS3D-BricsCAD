name: QS3D Manual V25 Commercial Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact source product tag, for example v1.2.3 or v1.2.3-rc.1"
        required: true
        type: string
      confirm_release:
        description: "Explicit commercial publish confirmation"
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "RELEASE"
      run_runtime:
        description: "Run licensed BricsCAD V25 runtime validation on the exact signed release plugin"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Publish as a signed GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qs3d-manual-v25-commercial-release
  cancel-in-progress: false

jobs:
  build_sign:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_release == 'RELEASE' }}
    runs-on: [self-hosted, windows, x64, bricscad-v25]
    environment: commercial-release
    permissions:
      contents: read
    env:
      BRICSCAD_V25_DIR: ${{ vars.BRICSCAD_V25_DIR }}
      BRICSCAD_V25_PROFILE: ${{ vars.BRICSCAD_V25_PROFILE }}
      QS3D_SIGNING_CERT_THUMBPRINT: ${{ vars.QS3D_SIGNING_CERT_THUMBPRINT }}
      QS3D_TIMESTAMP_SERVER: ${{ vars.QS3D_TIMESTAMP_SERVER }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_RUN_RUNTIME: ${{ inputs.run_runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"

      - name: Validate commercial release request
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "Commercial V25 releases must be dispatched from refs/heads/main. Current ref: $env:GITHUB_REF"
          }
          if ($env:RELEASE_TAG -notmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw 'release_tag must be strict SemVer prefixed with v.'
          }
          $head = ([string](git rev-parse --verify HEAD)).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA.ToLowerInvariant()) {
            throw 'Checked-out release HEAD does not match the workflow SHA.'
          }
          $localTag = @(git tag --list --format='%(objecttype) %(objectname)' $env:RELEASE_TAG)
          if ($LASTEXITCODE -ne 0 -or $localTag.Count -gt 1) { throw "Unable to classify local tag identity for $env:RELEASE_TAG." }
          if ($localTag.Count -eq 1) {
            $expectedLocal = "commit $($env:GITHUB_SHA.ToLowerInvariant())"
            if (-not [string]::Equals(([string]$localTag[0]).Trim().ToLowerInvariant(), $expectedLocal, [StringComparison]::Ordinal)) {
              throw "Existing local release tag $env:RELEASE_TAG is not an exact lightweight tag at workflow SHA $env:GITHUB_SHA."
            }
          }
          $isPrerelease = $env:RELEASE_PRERELEASE -eq 'true'
          $hasPrereleaseSuffix = $env:RELEASE_TAG -match '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)-'
          if ($isPrerelease -ne $hasPrereleaseSuffix) {
            throw 'prerelease input must match whether release_tag contains a SemVer prerelease suffix.'
          }
          if (-not $isPrerelease -and $env:RELEASE_RUN_RUNTIME -ne 'true') {
            throw 'Stable commercial releases require run_runtime=true.'
          }
          if ($env:QS3D_SIGNING_CERT_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
            throw 'QS3D_SIGNING_CERT_THUMBPRINT must be one exact 40-hex certificate thumbprint.'
          }
          $timestamp = $null
          if (-not [Uri]::TryCreate($env:QS3D_TIMESTAMP_SERVER, [UriKind]::Absolute, [ref]$timestamp) -or $timestamp.Scheme -ne 'https') {
            throw 'QS3D_TIMESTAMP_SERVER must be an absolute HTTPS timestamp URL.'
          }

      - name: Validate commercial release PowerShell syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @(
            'scripts/import-v25-signing-certificate.ps1',
            'scripts/sign-v25.ps1',
            'scripts/verify-v25-signatures.ps1',
            'scripts/finalize-v25-signed-package.ps1',
            'scripts/new-v25-update-manifest.ps1',
            'scripts/verify-v25-held-file.ps1',
            'scripts/invoke-v25-held-release-upload.ps1',
            'scripts/rollback-v25-draft-release.ps1',
            'scripts/assert-v25-release-package-identity.ps1',
            'scripts/assert-v25-commercial-draft-identity.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell parse failure: $script :: $($parseErrors -join '; ')" }
          }

      - name: Manual-only CI policy gate
        run: python scripts/preflight-ci-manual-only.py

      - name: Generic source guard
        run: python scripts/preflight.py

      - name: All discovered feature source guards
        run: python scripts/preflight-all.py

      - name: Build Core Release
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release

      - name: Deterministic Core smoke tests
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release

      - name: Validate BricsCAD V25 references
        shell: powershell
        run: |
          if (-not $env:BRICSCAD_V25_DIR) { throw 'BRICSCAD_V25_DIR repository variable is not set.' }
          foreach ($name in @('bricscad.exe', 'BrxMgd.dll', 'TD_Mgd.dll', 'TD_MgdBrep.dll')) {
            if (-not (Test-Path (Join-Path $env:BRICSCAD_V25_DIR $name))) { throw "Required BricsCAD V25 runtime file is missing: $name" }
          }

      - name: Build BricsCAD V25 plugin
        run: dotnet build src/QS3D.BricsCAD.V25/QS3D.BricsCAD.V25.csproj -c Release -p:Platform=x64

      - name: Build V25 release package
        shell: powershell
        run: .\scripts\package-v25-release.ps1

      - name: Validate exact release tag, product version and source binding
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = & .\scripts\assert-v25-release-package-identity.ps1 `
            -MetadataPath 'dist\QS3D-BricsCAD-V25\PACKAGE-METADATA.json' `
            -ExpectedSourceCommit $env:GITHUB_SHA `
            -ExpectedReleaseTag $env:RELEASE_TAG
          if ($null -eq $identity) { throw 'V25 held package identity validation returned no admitted identity.' }

      - name: Import ephemeral code-signing certificate
        shell: powershell
        env:
          QS3D_SIGNING_CERT_PFX_BASE64: ${{ secrets.QS3D_SIGNING_CERT_PFX_BASE64 }}
          QS3D_SIGNING_CERT_PASSWORD: ${{ secrets.QS3D_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:QS3D_SIGNING_CERT_PFX_BASE64)) { throw 'QS3D_SIGNING_CERT_PFX_BASE64 secret is required.' }
          if ([string]::IsNullOrWhiteSpace($env:QS3D_SIGNING_CERT_PASSWORD)) { throw 'QS3D_SIGNING_CERT_PASSWORD secret is required.' }
          $password = ConvertTo-SecureString $env:QS3D_SIGNING_CERT_PASSWORD -AsPlainText -Force
          $lines = @(& .\scripts\import-v25-signing-certificate.ps1 -PfxBase64 $env:QS3D_SIGNING_CERT_PFX_BASE64 -Password $password -ExpectedThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT)
          $public = @{}
          foreach ($line in $lines) {
            if ($line -match '^(SIGNING_THUMBPRINT|IMPORTED_THUMBPRINTS)=(.+)$') { $public[$Matches[1]] = $Matches[2] }
          }
          if (-not $public.SIGNING_THUMBPRINT -or -not $public.IMPORTED_THUMBPRINTS) { throw 'Certificate import did not return the expected public identifiers.' }
          "SIGNING_THUMBPRINT=$($public.SIGNING_THUMBPRINT)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IMPORTED_THUMBPRINTS=$($public.IMPORTED_THUMBPRINTS)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Authenticode-sign commercial V25 payload
        shell: powershell
        run: |
          $payload = @(
            'dist\QS3D-BricsCAD-V25\QS3D.BricsCAD.V25.dll',
            'dist\QS3D-BricsCAD-V25\QS3D.Core.dll',
            'dist\QS3D-BricsCAD-V25\install-v25-autoload.ps1',
            'dist\QS3D-BricsCAD-V25\uninstall-v25-autoload.ps1',
            'dist\QS3D-BricsCAD-V25\update-v25.ps1',
            'dist\QS3D-BricsCAD-V25\unblock-v25-netload.ps1'
          )
          & .\scripts\sign-v25.ps1 -Path $payload -CertificateThumbprint $env:SIGNING_THUMBPRINT -TimestampServer $env:QS3D_TIMESTAMP_SERVER -Confirm:$false

      - name: Verify Authenticode publisher and trusted timestamp
        shell: powershell
        run: |
          $payload = @(
            'dist\QS3D-BricsCAD-V25\QS3D.BricsCAD.V25.dll',
            'dist\QS3D-BricsCAD-V25\QS3D.Core.dll',
            'dist\QS3D-BricsCAD-V25\install-v25-autoload.ps1',
            'dist\QS3D-BricsCAD-V25\uninstall-v25-autoload.ps1',
            'dist\QS3D-BricsCAD-V25\update-v25.ps1',
            'dist\QS3D-BricsCAD-V25\unblock-v25-netload.ps1'
          )
          & .\scripts\verify-v25-signatures.ps1 -Path $payload -ExpectedThumbprint $env:SIGNING_THUMBPRINT

      - name: Finalize signed V25 package
        shell: powershell
        run: .\scripts\finalize-v25-signed-package.ps1 -ExpectedSignerThumbprint $env:SIGNING_THUMBPRINT -Confirm:$false

      - name: Remove ephemeral signing certificate and private key
        if: ${{ always() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:IMPORTED_THUMBPRINTS)) { return }
          foreach ($thumbprint in $env:IMPORTED_THUMBPRINTS.Split(',', [StringSplitOptions]::RemoveEmptyEntries)) {
            $normalized = $thumbprint.Replace(' ', '').ToUpperInvariant()
            if ($normalized -notmatch '^[0-9A-F]{40}$') { throw "Invalid imported certificate thumbprint in cleanup list: $thumbprint" }
            $certificatePath = "Cert:\CurrentUser\My\$normalized"
            if (Test-Path -LiteralPath $certificatePath) { Remove-Item -Path $certificatePath -DeleteKey -Force }
          }

      - name: Verify finalized package after private-key cleanup
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $verificationRoot = Join-Path $env:RUNNER_TEMP ('qs3d-commercial-package-' + [Guid]::NewGuid().ToString('N'))
          $heldRoot = Join-Path $env:RUNNER_TEMP ('qs3d-commercial-held-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $heldRoot -Force | Out-Null
          try {
            $heldZip = Join-Path $heldRoot 'QS3D-BricsCAD-V25.zip'
            & .\scripts\verify-v25-held-file.ps1 -Operation Copy -Path 'dist\QS3D-BricsCAD-V25.zip' -Destination $heldZip | Out-Null
            Expand-Archive -LiteralPath $heldZip -DestinationPath $verificationRoot
            $payload = @(
              (Join-Path $verificationRoot 'QS3D.BricsCAD.V25.dll'), (Join-Path $verificationRoot 'QS3D.Core.dll'),
              (Join-Path $verificationRoot 'install-v25-autoload.ps1'), (Join-Path $verificationRoot 'uninstall-v25-autoload.ps1'),
              (Join-Path $verificationRoot 'update-v25.ps1'), (Join-Path $verificationRoot 'unblock-v25-netload.ps1')
            )
            & .\scripts\verify-v25-signatures.ps1 -Path $payload -ExpectedThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT
          }
          finally {
            Remove-Item -LiteralPath $verificationRoot -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $heldRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Licensed V25 runtime validation for exact signed payload
        if: ${{ inputs.run_runtime }}
        shell: powershell
        run: |
          $plugin = (Resolve-Path 'dist\QS3D-BricsCAD-V25\QS3D.BricsCAD.V25.dll').Path
          & .\scripts\test-bricscad-v25-runtime.ps1 -BricsCadDir $env:BRICSCAD_V25_DIR -PluginDll $plugin -Profile $env:BRICSCAD_V25_PROFILE -ArtifactDir "$env:GITHUB_WORKSPACE\artifacts\bricscad-v25-runtime-signed"

      - name: Create signed auto-update manifest
        shell: powershell
        run: |
          $packageUri = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/QS3D-BricsCAD-V25.zip"
          & .\scripts\new-v25-update-manifest.ps1 -PackageUri $packageUri -ExpectedSignerThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT -OutputPath 'dist\QS3D-BricsCAD-V25.update.json' -Confirm:$false

      - name: Create commercial checksum and provenance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Resolve-Path 'dist\QS3D-BricsCAD-V25.zip').Path
          $zipHash = (& .\scripts\verify-v25-held-file.ps1 -Operation Hash -Path $zip).Trim().ToLowerInvariant()
          "$zipHash  QS3D-BricsCAD-V25.zip" | Set-Content 'dist\QS3D-BricsCAD-V25.zip.sha256' -Encoding ASCII
          $identity = & .\scripts\assert-v25-release-package-identity.ps1 `
            -MetadataPath 'dist\QS3D-BricsCAD-V25\PACKAGE-METADATA.json' `
            -ExpectedSourceCommit $env:GITHUB_SHA `
            -ExpectedReleaseTag $env:RELEASE_TAG
          if ($null -eq $identity) { throw 'V25 held package identity validation returned no identity for provenance.' }
          $updateHash = (& .\scripts\verify-v25-held-file.ps1 -Operation Hash -Path 'dist\QS3D-BricsCAD-V25.update.json').Trim().ToLowerInvariant()
          [ordered]@{
            schemaVersion = 1; product = 'QS3D'; target = 'BricsCAD V25 x64'; releaseTag = $env:RELEASE_TAG
            productVersion = [string]$identity.ProductVersion; sourceCommit = $env:GITHUB_SHA.ToLowerInvariant()
            signerThumbprint = $env:QS3D_SIGNING_CERT_THUMBPRINT.Replace(' ', '').ToUpperInvariant(); timestampServer = $env:QS3D_TIMESTAMP_SERVER
            packageFile = 'QS3D-BricsCAD-V25.zip'; packageSha256 = $zipHash
            updateManifestFile = 'QS3D-BricsCAD-V25.update.json'; updateManifestSha256 = $updateHash
          } | ConvertTo-Json -Depth 4 | Set-Content 'dist\QS3D-BricsCAD-V25.provenance.json' -Encoding UTF8

      - name: Upload signed commercial candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: QS3D-BricsCAD-V25-commercial-${{ inputs.release_tag }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/QS3D-BricsCAD-V25.zip
            dist/QS3D-BricsCAD-V25.zip.sha256
            dist/QS3D-BricsCAD-V25.update.json
            dist/QS3D-BricsCAD-V25.provenance.json
            artifacts/bricscad-v25-runtime-signed/

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_release == 'RELEASE' }}
    needs: build_sign
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      QS3D_SIGNING_CERT_THUMBPRINT: ${{ vars.QS3D_SIGNING_CERT_THUMBPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: QS3D-BricsCAD-V25-commercial-${{ inputs.release_tag }}-${{ github.sha }}
          path: commercial-candidate

      - name: Verify candidate after job boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = (Resolve-Path 'commercial-candidate\dist').Path
          $zip = Join-Path $dist 'QS3D-BricsCAD-V25.zip'
          $checksum = Join-Path $dist 'QS3D-BricsCAD-V25.zip.sha256'
          $update = Join-Path $dist 'QS3D-BricsCAD-V25.update.json'
          $provenancePath = Join-Path $dist 'QS3D-BricsCAD-V25.provenance.json'
          foreach ($path in @($zip, $checksum, $update, $provenancePath)) { if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing commercial candidate asset: $path" } }
          $extract = Join-Path $env:RUNNER_TEMP ('qs3d-commercial-publish-' + [Guid]::NewGuid().ToString('N'))
          $heldRoot = Join-Path $env:RUNNER_TEMP ('qs3d-commercial-candidate-held-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $heldRoot -Force | Out-Null
          try {
            $heldZip = Join-Path $heldRoot 'QS3D-BricsCAD-V25.zip'
            & .\scripts\verify-v25-held-file.ps1 -Operation Copy -Path $zip -Destination $heldZip | Out-Null
            $checksumText = (Get-Content -LiteralPath $checksum -Raw).Trim()
            if ($checksumText -notmatch '^([0-9a-f]{64})  QS3D-BricsCAD-V25\.zip$') { throw 'Commercial checksum file is malformed.' }
            $zipHash = (& .\scripts\verify-v25-held-file.ps1 -Operation Hash -Path $heldZip).Trim().ToLowerInvariant()
            if ($zipHash -ne $Matches[1]) { throw 'Commercial ZIP checksum mismatch.' }
            $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
            if ([int]$provenance.schemaVersion -ne 1 -or [string]$provenance.product -ne 'QS3D' -or [string]$provenance.target -ne 'BricsCAD V25 x64' -or
                -not [string]::Equals([string]$provenance.releaseTag, $env:RELEASE_TAG, [StringComparison]::Ordinal) -or
                -not [string]::Equals([string]$provenance.productVersion, $env:RELEASE_TAG.Substring(1), [StringComparison]::Ordinal) -or
                -not [string]::Equals([string]$provenance.sourceCommit, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase) -or
                -not [string]::Equals([string]$provenance.signerThumbprint, $env:QS3D_SIGNING_CERT_THUMBPRINT.Replace(' ', ''), [StringComparison]::OrdinalIgnoreCase) -or
                -not [string]::Equals([string]$provenance.packageSha256, $zipHash, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Commercial candidate provenance does not exactly bind tag, product, source, signer and ZIP digest.'
            }
            $updateHash = (& .\scripts\verify-v25-held-file.ps1 -Operation Hash -Path $update).Trim().ToLowerInvariant()
            if (-not [string]::Equals([string]$provenance.updateManifestSha256, $updateHash, [StringComparison]::OrdinalIgnoreCase)) { throw 'Update manifest digest mismatch.' }
            Expand-Archive -LiteralPath $heldZip -DestinationPath $extract
            $metadata = Get-Content -LiteralPath (Join-Path $extract 'PACKAGE-METADATA.json') -Raw | ConvertFrom-Json
            if (-not [string]::Equals([string]$metadata.productVersion, $env:RELEASE_TAG.Substring(1), [StringComparison]::Ordinal) -or -not [string]::Equals(([string]$metadata.gitCommit).Trim(), $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) { throw 'Packaged metadata lost exact tag/source binding.' }
            $payload = @(
              (Join-Path $extract 'QS3D.BricsCAD.V25.dll'), (Join-Path $extract 'QS3D.Core.dll'),
              (Join-Path $extract 'install-v25-autoload.ps1'), (Join-Path $extract 'uninstall-v25-autoload.ps1'),
              (Join-Path $extract 'update-v25.ps1'), (Join-Path $extract 'unblock-v25-netload.ps1')
            )
            & .\scripts\verify-v25-signatures.ps1 -Path $payload -ExpectedThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT
          }
          finally {
            Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $heldRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create draft, verify uploaded bytes, then publish
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = (Resolve-Path 'commercial-candidate\dist').Path
          $assetNames = @('QS3D-BricsCAD-V25.zip','QS3D-BricsCAD-V25.zip.sha256','QS3D-BricsCAD-V25.update.json','QS3D-BricsCAD-V25.provenance.json')
          $assets = @($assetNames | ForEach-Object { Join-Path $dist $_ })
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'QS3D-V25-Commercial-Release'
          }

          function Test-GitHubNotFound {
            param([Parameter(Mandatory = $true)]$ErrorRecord)
            $response = $ErrorRecord.Exception.Response
            if ($null -eq $response) { return $false }
            try { return ([int]$response.StatusCode -eq 404) }
            catch { return $false }
          }

          function Get-ExactReusableReleaseTag {
            $escapedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$escapedTag"
            try { $snapshot = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers }
            catch {
              if (Test-GitHubNotFound -ErrorRecord $_) { return $null }
              throw
            }
            if ($null -eq $snapshot -or -not [string]::Equals([string]$snapshot.ref, $tagRef, [StringComparison]::Ordinal)) {
              throw 'V25 reusable release tag lookup returned a mismatched ref.'
            }
            if ($null -eq $snapshot.object -or -not [string]::Equals([string]$snapshot.object.type, 'commit', [StringComparison]::Ordinal) -or -not [string]::Equals([string]$snapshot.object.sha, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Existing V25 release tag is annotated, moved, or not bound to the exact qualified workflow SHA.'
            }
            return $snapshot
          }

          function Assert-RemoteReleaseTagTargetsWorkflowSha {
            $peeledRef = $tagRef + '^{}'
            $lines = @(git ls-remote --tags origin $tagRef $peeledRef)
            if ($LASTEXITCODE -ne 0) { throw "Failed to resolve remote V25 release tag $env:RELEASE_TAG from origin. Release remains a draft." }
            $exact = New-Object System.Collections.Generic.List[string]
            $peeled = New-Object System.Collections.Generic.List[string]
            foreach ($line in $lines) {
              if ($line -notmatch '^([0-9a-fA-F]{40})\s+(.+)$') { throw "Malformed git ls-remote output while resolving V25 release tag $env:RELEASE_TAG. Release remains a draft." }
              $sha = $Matches[1]
              $refName = $Matches[2]
              if ([string]::Equals($refName, $tagRef, [StringComparison]::Ordinal)) { $exact.Add($sha) }
              elseif ([string]::Equals($refName, $peeledRef, [StringComparison]::Ordinal)) { $peeled.Add($sha) }
              else { throw "Unexpected remote ref while resolving V25 release tag: $refName. Release remains a draft." }
            }
            if ($exact.Count -ne 1 -or $peeled.Count -ne 0) { throw "V25 release tag $env:RELEASE_TAG must resolve to exactly one lightweight remote tag identity. Release remains a draft." }
            if (-not [string]::Equals($exact[0], $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) { throw "V25 release tag $env:RELEASE_TAG targets $($exact[0]) instead of qualified workflow SHA $env:GITHUB_SHA. Release remains a draft." }
          }

          function Resolve-AmbiguousDraftCreate {
            param(
              [Parameter(Mandatory = $true)][string]$TransactionMarker,
              [Parameter(Mandatory = $true)][string]$ExpectedReleaseName,
              [Parameter(Mandatory = $true)][bool]$IsPrerelease
            )
            $maxPages = 20
            $matches = New-Object System.Collections.Generic.List[object]
            $repositoryReleasePrefix = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/"
            for ($page = 1; $page -le $maxPages; $page++) {
              $pageUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100&page=$page"
              $releasePage = @(Invoke-RestMethod -Method Get -Uri $pageUri -Headers $headers)
              foreach ($ReleaseSnapshot in $releasePage) {
                $body = [string]$ReleaseSnapshot.body
                if ($body.IndexOf($TransactionMarker, [StringComparison]::Ordinal) -lt 0) { continue }
                if ($ReleaseSnapshot.draft -ne $true -or
                    -not [string]::Equals([string]$ReleaseSnapshot.tag_name, $env:RELEASE_TAG, [StringComparison]::Ordinal) -or
                    -not [string]::Equals([string]$ReleaseSnapshot.target_commitish, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase) -or
                    -not [string]::Equals([string]$ReleaseSnapshot.name, $ExpectedReleaseName, [StringComparison]::Ordinal) -or
                    [bool]$ReleaseSnapshot.prerelease -ne $IsPrerelease -or
                    [long]$ReleaseSnapshot.id -le 0 -or
                    -not [string]::Equals([string]$ReleaseSnapshot.url, ($repositoryReleasePrefix + [long]$ReleaseSnapshot.id), [StringComparison]::Ordinal)) {
                  throw 'A matching V25 draft-create transaction marker exists on a moved, published, or identity-mismatched release; refusing acknowledgement recovery.'
                }
                $matches.Add($ReleaseSnapshot)
              }
              if ($releasePage.Count -lt 100) { break }
              if ($page -eq $maxPages) { throw "V25 draft-create acknowledgement release enumeration exceeded $maxPages pages." }
            }
            if ($matches.Count -eq 0) { throw 'No matching V25 draft-create transaction marker was found after ambiguous creation.' }
            if ($matches.Count -ne 1) { throw "Expected exactly one matching V25 draft-create transaction marker; found $($matches.Count)." }
            return $matches[0]
          }

          function Assert-PublishedReleaseMatchesVerifiedTransaction {
            param(
              [Parameter(Mandatory = $true)]$ReleaseSnapshot,
              [Parameter(Mandatory = $true)][string]$ReleaseUri,
              [Parameter(Mandatory = $true)][long]$ReleaseId,
              [Parameter(Mandatory = $true)][string]$ExpectedReleaseName,
              [Parameter(Mandatory = $true)][string[]]$ExpectedAssets,
              [Parameter(Mandatory = $true)][hashtable]$VerifiedAssetIds,
              [Parameter(Mandatory = $true)][hashtable]$LocalAssets,
              [Parameter(Mandatory = $true)][bool]$IsPrerelease,
              [Parameter(Mandatory = $true)][string]$TransactionMarker
            )
            if ($null -eq $ReleaseSnapshot -or [long]$ReleaseSnapshot.id -ne $ReleaseId) { throw 'Published V25 release identity mismatch during acknowledgement reconciliation.' }
            if (-not [string]::Equals([string]$ReleaseSnapshot.url, $ReleaseUri, [StringComparison]::Ordinal)) { throw 'Published V25 release repository identity mismatch during acknowledgement reconciliation.' }
            if ($ReleaseSnapshot.draft -ne $false) { throw 'Published V25 release reconciliation expected draft=false.' }
            if (-not [string]::Equals([string]$ReleaseSnapshot.tag_name, $env:RELEASE_TAG, [StringComparison]::Ordinal)) { throw 'Published V25 release tag mismatch during acknowledgement reconciliation.' }
            if (-not [string]::Equals([string]$ReleaseSnapshot.target_commitish, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) { throw 'Published V25 release target SHA mismatch during acknowledgement reconciliation.' }
            if (-not [string]::Equals([string]$ReleaseSnapshot.name, $ExpectedReleaseName, [StringComparison]::Ordinal)) { throw 'Published V25 release name mismatch during acknowledgement reconciliation.' }
            if ([bool]$ReleaseSnapshot.prerelease -ne $IsPrerelease) { throw 'Published V25 release prerelease-state mismatch during acknowledgement reconciliation.' }
            if (([string]$ReleaseSnapshot.body).IndexOf($TransactionMarker, [StringComparison]::Ordinal) -lt 0) { throw 'Published V25 release transaction marker mismatch during acknowledgement reconciliation.' }
            Assert-RemoteReleaseTagTargetsWorkflowSha
            if (@($ReleaseSnapshot.assets).Count -ne $ExpectedAssets.Count) { throw 'Published V25 release asset count mismatch during acknowledgement reconciliation.' }
            if ($VerifiedAssetIds.Count -ne $ExpectedAssets.Count) { throw 'Verified V25 release asset identity set is incomplete; refusing acknowledgement recovery.' }
            foreach ($expectedAsset in $ExpectedAssets) {
              $matches = @($ReleaseSnapshot.assets | Where-Object { [string]$_.name -ceq $expectedAsset })
              if ($matches.Count -ne 1) { throw "Published V25 release asset identity is ambiguous for $expectedAsset." }
              if (-not $VerifiedAssetIds.ContainsKey($expectedAsset) -or -not $LocalAssets.ContainsKey($expectedAsset)) { throw "Verified V25 release asset identity mapping is missing for $expectedAsset." }
              $publishedAsset = $matches[0]
              $expectedAssetId = [long]$VerifiedAssetIds[$expectedAsset]
              if ($expectedAssetId -le 0 -or [long]$publishedAsset.id -ne $expectedAssetId) { throw "Verified V25 release asset identity mismatch for $expectedAsset." }
              $localLength = [int64]$LocalAssets[$expectedAsset].Length
              if ([int64]$publishedAsset.size -ne $localLength) { throw "Published V25 release asset size mismatch for $expectedAsset during acknowledgement reconciliation." }
            }
          }

          $notes = 'Commercial QS3D V25 release. Exact source/product/tag binding, Authenticode signer and trusted timestamp verification, licensed runtime policy, SHA-256 provenance, and downloaded draft-byte verification are enforced before publication.'
          $expectedReleaseName = "QS3D for BricsCAD V25 $env:RELEASE_TAG"
          $draftTransactionMarker = "QS3D-DRAFT-CREATE-V25:$env:GITHUB_RUN_ID:$env:GITHUB_RUN_ATTEMPT:$([Guid]::NewGuid().ToString('N'))"
          $releaseBody = $notes + "`n`nTransaction-Marker: $draftTransactionMarker"
          $tagCreatedByThisRun = $false
          $tagReadyForRelease = $false
          $releaseId = [long]0
          $releaseUri = $null
          $verifiedAssetIds = @{}
          $localAssets = @{}
          $publishPatchAttempted = $false
          try {
            $tagRefUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/refs"
            $existingTag = Get-ExactReusableReleaseTag
            if ($null -ne $existingTag) {
              Write-Host "Reusing exact V25 lightweight tag $env:RELEASE_TAG at workflow SHA without claiming deletion ownership."
              $tagReadyForRelease = $true
            }
            else {
              $tagCreateRequest = @{ ref = $tagRef; sha = $env:GITHUB_SHA } | ConvertTo-Json
              try {
                $createdTag = Invoke-RestMethod -Method Post -Uri $tagRefUri -Headers $headers -ContentType 'application/json' -Body $tagCreateRequest
                if ($null -eq $createdTag -or -not [string]::Equals([string]$createdTag.ref, $tagRef, [StringComparison]::Ordinal)) {
                  throw 'V25 release tag creation returned a mismatched ref; refusing transaction ownership.'
                }
                if ($null -eq $createdTag.object -or -not [string]::Equals([string]$createdTag.object.type, 'commit', [StringComparison]::Ordinal) -or -not [string]::Equals([string]$createdTag.object.sha, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) {
                  throw 'V25 release tag creation returned a non-commit or mismatched SHA; refusing transaction ownership.'
                }
                $tagCreatedByThisRun = $true
                $tagReadyForRelease = $true
              }
              catch {
                $tagCreateError = $_
                $reconciledTag = Get-ExactReusableReleaseTag
                if ($null -eq $reconciledTag) {
                  throw "V25 tag-create acknowledgement failed and the exact release tag is authoritatively absent. Original error: $($tagCreateError.Exception.Message)"
                }
                Write-Host "V25 tag-create acknowledgement was ambiguous, but the exact lightweight tag now exists at workflow SHA; reusing it without deletion ownership."
                $tagCreatedByThisRun = $false
                $tagReadyForRelease = $true
              }
            }
            Assert-RemoteReleaseTagTargetsWorkflowSha

            $releaseRequest = @{
              tag_name = $env:RELEASE_TAG
              target_commitish = $env:GITHUB_SHA
              name = $expectedReleaseName
              body = $releaseBody
              draft = $true
              prerelease = ($env:RELEASE_PRERELEASE -eq 'true')
              generate_release_notes = $false
            } | ConvertTo-Json
            try {
              $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers -ContentType 'application/json' -Body $releaseRequest
            }
            catch {
              $draftCreateError = $_
              try {
                $reconciledDraft = Resolve-AmbiguousDraftCreate -TransactionMarker $draftTransactionMarker -ExpectedReleaseName $expectedReleaseName -IsPrerelease:($env:RELEASE_PRERELEASE -eq 'true')
              }
              catch {
                throw "V25 draft-create acknowledgement reconciliation failed. Original create error: $($draftCreateError.Exception.Message) Reconciliation error: $($_.Exception.Message)"
              }
              Write-Host 'V25 draft-create acknowledgement was ambiguous, but exactly one transaction-owned draft was recovered.'
              $release = $reconciledDraft
            }
            if ($null -eq $release -or [long]$release.id -le 0) { throw 'V25 draft creation returned no usable release identity.' }
            $expectedReleaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$([long]$release.id)"
            if ($release.draft -ne $true -or
                -not [string]::Equals([string]$release.url, $expectedReleaseUri, [StringComparison]::Ordinal) -or
                -not [string]::Equals([string]$release.tag_name, $env:RELEASE_TAG, [StringComparison]::Ordinal) -or
                -not [string]::Equals([string]$release.target_commitish, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase) -or
                -not [string]::Equals([string]$release.name, $expectedReleaseName, [StringComparison]::Ordinal) -or
                [bool]$release.prerelease -ne ($env:RELEASE_PRERELEASE -eq 'true') -or
                ([string]$release.body).IndexOf($draftTransactionMarker, [StringComparison]::Ordinal) -lt 0) {
              throw 'Newly-created/reconciled V25 release identity, draft state, or transaction marker mismatch.'
            }
            $releaseId = [long]$release.id
            $releaseUri = $expectedReleaseUri
            Assert-RemoteReleaseTagTargetsWorkflowSha

            $admittedAssets = @(& .\scripts\invoke-v25-held-release-upload.ps1 `
              -Path $assets `
              -ReleaseTag $env:RELEASE_TAG `
              -Repository $env:GITHUB_REPOSITORY)
            if ($admittedAssets.Count -ne $assetNames.Count) { throw 'Held V25 draft upload did not return the complete admitted asset set.' }
            foreach ($asset in $admittedAssets) {
              if ($localAssets.ContainsKey($asset.Name)) { throw "Duplicate admitted V25 release asset name: $($asset.Name)" }
              $localAssets[$asset.Name] = $asset
            }

            $draftRelease = Invoke-RestMethod -Method Get -Uri $releaseUri -Headers $headers
            if ([long]$draftRelease.id -ne $releaseId -or $draftRelease.draft -ne $true -or
                -not [string]::Equals([string]$draftRelease.url, $releaseUri, [StringComparison]::Ordinal) -or
                -not [string]::Equals([string]$draftRelease.tag_name, $env:RELEASE_TAG, [StringComparison]::Ordinal) -or
                -not [string]::Equals([string]$draftRelease.target_commitish, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase) -or
                -not [string]::Equals([string]$draftRelease.name, $expectedReleaseName, [StringComparison]::Ordinal) -or
                [bool]$draftRelease.prerelease -ne ($env:RELEASE_PRERELEASE -eq 'true') -or
                ([string]$draftRelease.body).IndexOf($draftTransactionMarker, [StringComparison]::Ordinal) -lt 0) {
              throw 'V25 draft release identity changed after asset upload; refusing publication.'
            }
            if (@($draftRelease.assets).Count -ne $assetNames.Count) { throw 'V25 draft release contains an unexpected asset count; refusing publication.' }
            foreach ($name in $assetNames) {
              $matches = @($draftRelease.assets | Where-Object { [string]$_.name -ceq $name })
              if ($matches.Count -ne 1) { throw "V25 draft release asset identity is ambiguous for $name." }
              $uploadedAsset = $matches[0]
              $uploadedAssetId = [long]$uploadedAsset.id
              if ($uploadedAssetId -le 0) { throw "V25 draft release asset has no usable identity: $name" }
              $localLength = [int64]$localAssets[$name].Length
              if ([int64]$uploadedAsset.size -ne $localLength) { throw "V25 draft release asset size mismatch before byte verification: $name" }
              $verifiedAssetIds[$name] = $uploadedAssetId
            }
            Assert-RemoteReleaseTagTargetsWorkflowSha

            $downloadRoot = Join-Path $env:RUNNER_TEMP ('qs3d-commercial-draft-' + [Guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
            try {
              & gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $downloadRoot
              if ($LASTEXITCODE -ne 0) { throw 'Failed to download draft release assets for verification.' }
              $downloadedNames = @(Get-ChildItem -LiteralPath $downloadRoot -File | ForEach-Object Name | Sort-Object)
              $expectedNames = @($assetNames | Sort-Object)
              if (($downloadedNames -join "`n") -cne ($expectedNames -join "`n")) { throw 'Draft release asset set mismatch.' }
              foreach ($name in $assetNames) {
                $localHash = [string]$localAssets[$name].Sha256
                $remoteHash = (& .\scripts\verify-v25-held-file.ps1 -Operation Hash -Path (Join-Path $downloadRoot $name)).Trim()
                if (-not [string]::Equals($localHash, $remoteHash, [StringComparison]::OrdinalIgnoreCase)) { throw "Draft release asset SHA-256 mismatch for $name; release remains a draft." }
              }

              $remoteChecksum = (Get-Content -LiteralPath (Join-Path $downloadRoot 'QS3D-BricsCAD-V25.zip.sha256') -Raw).Trim()
              if ($remoteChecksum -notmatch '^([0-9a-f]{64})  QS3D-BricsCAD-V25\.zip$') { throw 'Downloaded draft checksum is malformed.' }
              $remoteZip = Join-Path $downloadRoot 'QS3D-BricsCAD-V25.zip'
              $heldRoot = Join-Path $env:RUNNER_TEMP ('qs3d-commercial-draft-held-' + [Guid]::NewGuid().ToString('N'))
              New-Item -ItemType Directory -Path $heldRoot -Force | Out-Null
              try {
                $heldRemoteZip = Join-Path $heldRoot 'QS3D-BricsCAD-V25.zip'
                & .\scripts\verify-v25-held-file.ps1 -Operation Copy -Path $remoteZip -Destination $heldRemoteZip | Out-Null
                $remoteZipHash = (& .\scripts\verify-v25-held-file.ps1 -Operation Hash -Path $heldRemoteZip).Trim().ToLowerInvariant()
                if ($remoteZipHash -ne $Matches[1]) { throw 'Downloaded draft ZIP fails its SHA-256 checksum.' }
                $extract = Join-Path $downloadRoot 'verified-package'
                Expand-Archive -LiteralPath $heldRemoteZip -DestinationPath $extract
                $payload = @(
                  (Join-Path $extract 'QS3D.BricsCAD.V25.dll'), (Join-Path $extract 'QS3D.Core.dll'),
                  (Join-Path $extract 'install-v25-autoload.ps1'), (Join-Path $extract 'uninstall-v25-autoload.ps1'),
                  (Join-Path $extract 'update-v25.ps1'), (Join-Path $extract 'unblock-v25-netload.ps1')
                )
                & .\scripts\verify-v25-signatures.ps1 -Path $payload -ExpectedThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT

                $downloadedIdentity = & .\scripts\assert-v25-commercial-draft-identity.ps1 `
                  -PackageZip $heldRemoteZip `
                  -ChecksumPath (Join-Path $downloadRoot 'QS3D-BricsCAD-V25.zip.sha256') `
                  -UpdateManifestPath (Join-Path $downloadRoot 'QS3D-BricsCAD-V25.update.json') `
                  -ProvenancePath (Join-Path $downloadRoot 'QS3D-BricsCAD-V25.provenance.json') `
                  -ExpectedSourceCommit $env:GITHUB_SHA `
                  -ExpectedReleaseTag $env:RELEASE_TAG `
                  -ExpectedSignerThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT
                if ($null -eq $downloadedIdentity) { throw 'Downloaded V25 draft semantic admission returned no identity.' }
              }
              finally { Remove-Item -LiteralPath $heldRoot -Recurse -Force -ErrorAction SilentlyContinue }
            }
            finally { Remove-Item -LiteralPath $downloadRoot -Recurse -Force -ErrorAction SilentlyContinue }

            Assert-RemoteReleaseTagTargetsWorkflowSha

            $finalMainResponse = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/main" -Headers $headers
            $finalMain = ([string]$finalMainResponse.sha).Trim().ToLowerInvariant()
            if ($finalMain -notmatch '^[0-9a-f]{40}$') {
              throw "Protected main API returned an invalid final commercial-release SHA: $finalMain"
            }
            $finalMainRef = 'refs/remotes/origin/qs3d-commercial-final-main'
            & git fetch --no-tags --force origin "+refs/heads/main:$finalMainRef"
            if ($LASTEXITCODE -ne 0) {
              throw 'Could not fetch protected main for final commercial release admission.'
            }
            $fetchedFinalMain = ([string](& git rev-parse --verify $finalMainRef)).Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0 -or $fetchedFinalMain -notmatch '^[0-9a-f]{40}$') {
              throw 'Could not resolve fetched protected-main SHA for final commercial release admission.'
            }
            if ($fetchedFinalMain -ne $finalMain) {
              throw "Protected-main API/fetch identity mismatch during final commercial publication admission. API=$finalMain fetched=$fetchedFinalMain"
            }
            & git merge-base --is-ancestor $env:GITHUB_SHA $finalMain
            $finalAncestorStatus = $LASTEXITCODE
            if ($finalAncestorStatus -ne 0) {
              throw "Commercial release workflow SHA is no longer an ancestor of protected main during final publication admission: $env:GITHUB_SHA"
            }
            $finalReleaseRelevantPaths = @(
              '.github/workflows/',
              'scripts/',
              'src/QS3D.BricsCAD.V25/',
              'src/QS3D.Core/',
              'samples/generated/',
              'Directory.Build.props',
              'Directory.Build.targets',
              'VERSION',
              'installer/',
              'external/'
            )
            & git diff --quiet --no-ext-diff "$env:GITHUB_SHA..$finalMain" -- @finalReleaseRelevantPaths
            $finalReleaseDriftStatus = $LASTEXITCODE
            if ($finalReleaseDriftStatus -eq 1) {
              throw 'newer release-relevant protected main supersedes this commercial publication; refusing stale commercial publication'
            }
            if ($finalReleaseDriftStatus -ne 0) {
              throw "Could not classify protected-main commercial release drift. git diff exit=$finalReleaseDriftStatus"
            }
            if ($finalMain -ne $env:GITHUB_SHA.ToLowerInvariant()) {
              Write-Host 'main advanced only through non-release paths during final commercial publication admission; published provenance remains pinned to GITHUB_SHA.'
            }
            $confirmedMainResponse = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/main" -Headers $headers
            $confirmedFinalMain = ([string]$confirmedMainResponse.sha).Trim().ToLowerInvariant()
            if ($confirmedFinalMain -notmatch '^[0-9a-f]{40}$') {
              throw "Protected main confirmation returned an invalid commercial-release SHA: $confirmedFinalMain"
            }
            if ($confirmedFinalMain -ne $finalMain) {
              throw "Protected main moved during final commercial release admission. Before=$finalMain after=$confirmedFinalMain"
            }

            $publishPatchAttempted = $true
            $published = Invoke-RestMethod -Method Patch -Uri $releaseUri -Headers $headers -ContentType 'application/json' -Body (@{ draft = $false } | ConvertTo-Json)
            Assert-PublishedReleaseMatchesVerifiedTransaction `
              -ReleaseSnapshot $published `
              -ReleaseUri $releaseUri `
              -ReleaseId $releaseId `
              -ExpectedReleaseName $expectedReleaseName `
              -ExpectedAssets $assetNames `
              -VerifiedAssetIds $verifiedAssetIds `
              -LocalAssets $localAssets `
              -IsPrerelease:($env:RELEASE_PRERELEASE -eq 'true') `
              -TransactionMarker $draftTransactionMarker
          }
          catch {
            $publicationError = $_
            if (-not $tagReadyForRelease) { throw }

            if ($releaseId -gt 0) {
              try {
                $reconciledRelease = Invoke-RestMethod -Method Get -Uri $releaseUri -Headers $headers
                if ($reconciledRelease.draft -eq $false) {
                  if (-not $publishPatchAttempted) { throw 'V25 release became published before this workflow attempted the final publish PATCH.' }
                  Assert-PublishedReleaseMatchesVerifiedTransaction `
                    -ReleaseSnapshot $reconciledRelease `
                    -ReleaseUri $releaseUri `
                    -ReleaseId $releaseId `
                    -ExpectedReleaseName $expectedReleaseName `
                    -ExpectedAssets $assetNames `
                    -VerifiedAssetIds $verifiedAssetIds `
                    -LocalAssets $localAssets `
                    -IsPrerelease:($env:RELEASE_PRERELEASE -eq 'true') `
                    -TransactionMarker $draftTransactionMarker
                  Write-Host 'V25 publish acknowledgement was ambiguous, but authoritative release state confirms the exact qualified release is already published; treating publication as committed.'
                  return
                }
                if ($reconciledRelease.draft -ne $true) { throw 'V25 release draft state is ambiguous during acknowledgement reconciliation.'
                }
              }
              catch {
                $reconciliationError = $_
                throw "V25 publication acknowledgement reconciliation failed. Original publication error: $($publicationError.Exception.Message) Reconciliation error: $($reconciliationError.Exception.Message) Manual cleanup is required before retry."
              }
            }

            try {
              & .\scripts\rollback-v25-draft-release.ps1 `
                -Repository $env:GITHUB_REPOSITORY `
                -ReleaseId $releaseId `
                -ReleaseTag $env:RELEASE_TAG `
                -WorkflowSha $env:GITHUB_SHA `
                -TagCreatedByThisRun $tagCreatedByThisRun `
                -Token $env:GH_TOKEN | Out-Null
            }
            catch {
              $rollbackError = $_
              throw "Automatic V25 draft rollback failed. Original publication error: $($publicationError.Exception.Message) Rollback error: $($rollbackError.Exception.Message) Manual cleanup is required before retry."
            }
            throw "V25 publication failed after exact release-tag admission: $($publicationError.Exception.Message) Automatic rollback completed; retry with the same tag is safe."
          }