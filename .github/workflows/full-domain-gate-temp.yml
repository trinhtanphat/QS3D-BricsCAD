name: QS3D Full Domain Final Gate

on:
  workflow_dispatch:
  push:
    branches:
      - ci/full-domain-integration-final-20260810

permissions:
  contents: read

env:
  QS3D_FULL_DOMAIN_GATE_BRANCH: ci/full-domain-integration-final-20260810

jobs:
  preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full-domain preflight
        run: python scripts/preflight-full-domain.py

  core:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build core
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release
      - name: Run deterministic smoke tests
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release
