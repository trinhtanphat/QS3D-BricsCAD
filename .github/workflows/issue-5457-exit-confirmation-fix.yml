name: Issue 5457 exit-confirmation fix

on:
  push:
    branches:
      - agent/gpt56sol-20260903-multi-transport-failover/issue-5457-multi-transport-failover

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[5457-exit-confirmed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Patch provider stop paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cloudflare_path = Path('src/QS3D.BricsCAD.V25/McpCloudflareAccountOnboarding.cs')
          openai_path = Path('src/QS3D.BricsCAD.V25/McpOpenAiSecureTunnel.cs')

          cloudflare = cloudflare_path.read_text(encoding='utf-8')
          old_cloudflare = '''        private static void StopProcess()\n        {\n            Process? process;\n            lock (Sync) { process = _process; _process = null; }\n            if (process == null) return;\n            try { process.EnableRaisingEvents = false; } catch { }\n            try { if (!process.HasExited) process.Kill(); } catch { }\n            try { if (!process.HasExited) process.WaitForExit(2000); } catch { }\n            try { process.Dispose(); } catch { }\n            McpTransportSupervisor.ClearOwnedProcess(McpTransportProvider.CloudflareNamedTunnel);\n        }'''
          new_cloudflare = '''        private static void StopProcess()\n        {\n            Process? process;\n            lock (Sync) { process = _process; _process = null; }\n            if (process == null) return;\n            var exitConfirmed = false;\n            try { process.EnableRaisingEvents = false; } catch { }\n            try\n            {\n                if (process.HasExited)\n                {\n                    exitConfirmed = true;\n                }\n                else\n                {\n                    process.Kill();\n                    exitConfirmed = process.WaitForExit(2000);\n                    if (exitConfirmed) exitConfirmed = process.HasExited;\n                }\n            }\n            catch { exitConfirmed = false; }\n            if (exitConfirmed)\n                McpTransportSupervisor.ClearOwnedProcess(McpTransportProvider.CloudflareNamedTunnel);\n            try { process.Dispose(); } catch { }\n        }'''
          if old_cloudflare not in cloudflare:
              raise SystemExit('Cloudflare StopProcess exact source pattern not found')
          cloudflare_path.write_text(cloudflare.replace(old_cloudflare, new_cloudflare, 1), encoding='utf-8')

          openai = openai_path.read_text(encoding='utf-8')
          old_openai = '''        private static void StopProcessOnly()\n        {\n            Process? process;\n            lock (Sync)\n            {\n                _stopping = true;\n                process = _process;\n                _process = null;\n                _lastReady = false;\n                _lastReadyProbeUtc = DateTime.MinValue;\n            }\n            if (process != null)\n            {\n                try { process.EnableRaisingEvents = false; } catch { }\n                try { process.CancelOutputRead(); } catch { }\n                try { process.CancelErrorRead(); } catch { }\n                try { if (!process.HasExited) process.Kill(); } catch { }\n                try { process.WaitForExit(1500); } catch { }\n                try { process.Dispose(); } catch { }\n                McpTransportSupervisor.ClearOwnedProcess(McpTransportProvider.OpenAiSecureTunnel);\n            }\n            lock (Sync) _stopping = false;\n        }'''
          new_openai = '''        private static void StopProcessOnly()\n        {\n            Process? process;\n            lock (Sync)\n            {\n                _stopping = true;\n                process = _process;\n                _process = null;\n                _lastReady = false;\n                _lastReadyProbeUtc = DateTime.MinValue;\n            }\n            if (process != null)\n            {\n                var exitConfirmed = false;\n                try { process.EnableRaisingEvents = false; } catch { }\n                try { process.CancelOutputRead(); } catch { }\n                try { process.CancelErrorRead(); } catch { }\n                try\n                {\n                    if (process.HasExited)\n                    {\n                        exitConfirmed = true;\n                    }\n                    else\n                    {\n                        process.Kill();\n                        exitConfirmed = process.WaitForExit(1500);\n                        if (exitConfirmed) exitConfirmed = process.HasExited;\n                    }\n                }\n                catch { exitConfirmed = false; }\n                if (exitConfirmed)\n                    McpTransportSupervisor.ClearOwnedProcess(McpTransportProvider.OpenAiSecureTunnel);\n                try { process.Dispose(); } catch { }\n            }\n            lock (Sync) _stopping = false;\n        }'''
          if old_openai not in openai:
              raise SystemExit('OpenAI StopProcessOnly exact source pattern not found')
          openai_path.write_text(openai.replace(old_openai, new_openai, 1), encoding='utf-8')
          PY
      - name: Verify regression guard
        run: python scripts/preflight-mcp-transport-supervisor.py
      - name: Commit source hardening
        shell: bash
        run: |
          git config user.name "qs3d-gpt56sol"
          git config user.email "89531707+trinhtanphat@users.noreply.github.com"
          git add src/QS3D.BricsCAD.V25/McpCloudflareAccountOnboarding.cs src/QS3D.BricsCAD.V25/McpOpenAiSecureTunnel.cs
          git commit -m "fix(mcp): retain tunnel ownership until confirmed exit (#5457) [5457-exit-confirmed]"
          git push origin HEAD:${{ github.ref_name }}
