name: QS3D BricsCAD V25 Integration Build

on:
  workflow_dispatch:
    inputs:
      run_runtime:
        description: "Run real BricsCAD V25 NETLOAD/runtime test and capture UI screenshot"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  plugin:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, windows, x64, bricscad-v25]
    env:
      BRICSCAD_V25_DIR: ${{ vars.BRICSCAD_V25_DIR }}
      BRICSCAD_V25_PROFILE: ${{ vars.BRICSCAD_V25_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Manual-only CI policy gate
        run: python scripts/preflight-ci-manual-only.py
      - name: Generic source guard
        run: python scripts/preflight.py
      - name: All discovered feature source guards
        run: python scripts/preflight-all.py
      - name: Validate release PowerShell syntax
        shell: powershell
        run: |
          foreach ($script in @(
            'scripts/package-v25.ps1',
            'scripts/install-v25-autoload.ps1',
            'scripts/uninstall-v25-autoload.ps1',
            'scripts/update-v25.ps1',
            'scripts/new-v25-update-manifest.ps1',
            'scripts/finalize-v25-signed-package.ps1',
            'scripts/sign-v25.ps1',
            'scripts/verify-v25-signatures.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-Table -AutoSize | Out-String | Write-Host
              throw "PowerShell parse failure: $script"
            }
          }
      - name: Build core
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release
      - name: Smoke tests
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release
      - name: Validate BricsCAD references
        shell: powershell
        run: |
          if (-not $env:BRICSCAD_V25_DIR) { throw "BRICSCAD_V25_DIR repository variable is not set." }
          if (-not (Test-Path "$env:BRICSCAD_V25_DIR\bricscad.exe")) { throw "bricscad.exe missing." }
          if (-not (Test-Path "$env:BRICSCAD_V25_DIR\BrxMgd.dll")) { throw "BrxMgd.dll missing." }
          if (-not (Test-Path "$env:BRICSCAD_V25_DIR\TD_Mgd.dll")) { throw "TD_Mgd.dll missing." }
          if (-not (Test-Path "$env:BRICSCAD_V25_DIR\TD_MgdBrep.dll")) { throw "TD_MgdBrep.dll missing." }
      - name: Build V25 plugin
        run: dotnet build src/QS3D.BricsCAD.V25/QS3D.BricsCAD.V25.csproj -c Release -p:Platform=x64
      - name: Build V25 release package
        shell: powershell
        run: .\scripts\package-v25.ps1
      - name: Real V25 NETLOAD/runtime + screenshot
        if: ${{ inputs.run_runtime }}
        shell: powershell
        run: |
          $plugin = (Resolve-Path "src\QS3D.BricsCAD.V25\bin\x64\Release\net48\QS3D.BricsCAD.V25.dll").Path
          & .\scripts\test-bricscad-v25-runtime.ps1 `
            -BricsCadDir $env:BRICSCAD_V25_DIR `
            -PluginDll $plugin `
            -Profile $env:BRICSCAD_V25_PROFILE `
            -ArtifactDir "$env:GITHUB_WORKSPACE\artifacts\bricscad-v25-runtime"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: QS3D-BricsCAD-V25
          path: |
            src/QS3D.BricsCAD.V25/bin/x64/Release/net48/QS3D.BricsCAD.V25.dll
            src/QS3D.BricsCAD.V25/bin/x64/Release/net48/QS3D.Core.dll
            dist/QS3D-BricsCAD-V25.zip
      - name: Upload V25 runtime evidence
        if: ${{ always() && inputs.run_runtime }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: QS3D-BricsCAD-V25-runtime
          if-no-files-found: warn
          path: artifacts/bricscad-v25-runtime/
