name: Dispatch V25 cloud CI after main integration

on:
  workflow_dispatch:
  # This quoted key is semantically the normal GitHub `push` event. It keeps the
  # legacy generic preflight compatible; scripts/preflight-ci-manual-only.py is
  # the strict guard that explicitly validates this owner-approved exception.
  "push":
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "Directory.Build.props"
      - "QS3D.sln"
      - "QS3D.V26.sln"
      - ".github/workflows/release-v25-cloud.yml"
      - ".github/workflows/dispatch-v25-cloud-after-main-integration.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: qs3d-v25-cloud-main-integration
  cancel-in-progress: true

jobs:
  dispatch:
    if: ${{ github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Debounce adjacent integration landings
        if: ${{ github.event_name == 'push' }}
        run: sleep 60

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Wait for prior V25 release and dispatch triggering main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${GITHUB_SHA,,}"
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Triggering source SHA is not one exact 40-hex commit: ${source_sha}" >&2
            exit 1
          fi
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          echo "Triggering integration source: ${source_sha}"
          echo "Current main at dispatch time: ${current_main}"
          if [[ "${current_main}" != "${source_sha}" ]]; then
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if ! git merge-base --is-ancestor "${source_sha}" "${current_main}"; then
              echo "Triggering source is no longer an ancestor of current main; refusing ambiguous automatic dispatch." >&2
              exit 1
            fi
            release_relevant_drift=0
            while IFS= read -r changed_path; do
              [[ -n "${changed_path}" ]] || continue
              case "${changed_path}" in
                src/*|tests/*|scripts/*|Directory.Build.props|QS3D.sln|QS3D.V26.sln|.github/workflows/release-v25-cloud.yml|.github/workflows/dispatch-v25-cloud-after-main-integration.yml)
                  echo "Newer release-relevant main path supersedes ${source_sha}: ${changed_path}"
                  release_relevant_drift=1
                  ;;
              esac
            done < <(git diff --name-only "${source_sha}..${current_main}" --)
            if (( release_relevant_drift != 0 )); then
              echo "main advanced with release-relevant changes; superseded dispatcher ${source_sha} exits before release dispatch. Newer relevant main push owns the next release."
              exit 0
            fi
            echo "main advanced only through non-release paths; dispatch remains pinned to ${source_sha}. Release preparation may absorb that inert main drift without changing source provenance."
          fi

          max_wait_checks=240
          for ((wait_check=1; wait_check<=max_wait_checks; wait_check++)); do
            active_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-v25-cloud.yml/runs?per_page=100" --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
            if [[ ! "${active_runs}" =~ ^[0-9]+$ ]]; then
              echo "Could not resolve active V25 release run count: ${active_runs}" >&2
              exit 1
            fi
            if (( active_runs == 0 )); then
              echo "No queued/running V25 release remains; deriving the next published preview ordinal now."
              break
            fi
            if (( wait_check >= max_wait_checks )); then
              echo "Timed out waiting for ${active_runs} queued/running V25 release run(s); refusing to allocate a preview ordinal early." >&2
              exit 1
            fi
            echo "Waiting for ${active_runs} queued/running V25 release run(s) before preview allocation (${wait_check}/${max_wait_checks})."
            sleep 15
          done

          git fetch --force --tags origin
          series_prefix="v0.1.0-preview."
          max_preview=0
          found_preview=0

          consider_preview() {
            local ordinal_text="$1"
            local source_label="$2"
            if [[ ! "${ordinal_text}" =~ ^[1-9][0-9]*$ ]]; then
              echo "${source_label} preview ordinal is non-canonical: ${ordinal_text}" >&2
              exit 1
            fi
            if (( ${#ordinal_text} > 5 )); then
              echo "${source_label} preview ordinal exceeds the FileVersion 0..65535 range: ${ordinal_text}" >&2
              exit 1
            fi
            local ordinal=$((10#${ordinal_text}))
            if (( ordinal > 65535 )); then
              echo "${source_label} preview ordinal exceeds the FileVersion 0..65535 range: ${ordinal_text}" >&2
              exit 1
            fi
            found_preview=1
            if (( ordinal > max_preview )); then
              max_preview=${ordinal}
            fi
          }

          while IFS= read -r existing_tag; do
            [[ -n "${existing_tag}" ]] || continue
            if [[ ! "${existing_tag}" =~ ^v0\.1\.0-preview\.([1-9][0-9]*)$ ]]; then
              echo "Matching-series tag is non-canonical and blocks automatic preview derivation: ${existing_tag}" >&2
              exit 1
            fi
            consider_preview "${BASH_REMATCH[1]}" "Published"
          done < <(git tag --list "${series_prefix}*")

          if (( found_preview == 0 )); then
            preview=1
          else
            if (( max_preview >= 65535 )); then
              echo "No automatic preview number remains inside the FileVersion 0..65535 range." >&2
              exit 1
            fi
            preview=$((max_preview + 1))
          fi
          tag="${series_prefix}${preview}"

          echo "Dispatching release-v25-cloud.yml for ${source_sha} as ${tag}"
          gh workflow run release-v25-cloud.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_sha="${source_sha}" \
            -f release_tag="${tag}" \
            -f confirm_release=RELEASE
