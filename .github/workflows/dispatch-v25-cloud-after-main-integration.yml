name: Dispatch V25 cloud CI after main integration

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "QS3D Cloud V25 Preview Build & Release"
    types:
      - completed
    branches:
      - main
  # This quoted key is semantically the normal GitHub `push` event. It keeps the
  # legacy generic preflight compatible; scripts/preflight-ci-manual-only.py is
  # the strict guard that explicitly validates this owner-approved exception.
  "push":
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "external/QS3D-Platform"
      - ".gitmodules"
      - "Directory.Build.props"
      - "QS3D.sln"
      - "QS3D.V26.sln"
      - ".github/workflows/release-v25-cloud.yml"
      - ".github/workflows/dispatch-v25-cloud-after-main-integration.yml"

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: qs3d-v25-cloud-main-integration
  cancel-in-progress: true

jobs:
  dispatch:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') || (github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    env:
      MINIMUM_RELEASE_CHANGES: "10"
    steps:
      - name: Debounce adjacent integration landings
        if: ${{ github.event_name == 'push' }}
        run: sleep 60

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Gate batch, bind committed preview and dispatch exact main SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            source_sha="${current_main,,}"
            echo "Successful V25 cloud release completed; re-evaluating exact current main ${source_sha}."
          else
            source_sha="${GITHUB_SHA,,}"
          fi
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Triggering source SHA is not one exact 40-hex commit: ${source_sha}" >&2
            exit 1
          fi

          echo "Triggering integration source: ${source_sha}"
          echo "Current main at dispatch time: ${current_main}"
          if [[ "${current_main}" != "${source_sha}" ]]; then
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
            if ! git merge-base --is-ancestor "${source_sha}" "${current_main}"; then
              echo "Triggering source is no longer an ancestor of current main; refusing ambiguous automatic dispatch." >&2
              exit 1
            fi
            release_relevant_pathspecs=(
              'src/'
              'tests/'
              'scripts/'
              'external/QS3D-Platform'
              '.gitmodules'
              'Directory.Build.props'
              'QS3D.sln'
              'QS3D.V26.sln'
              '.github/workflows/release-v25-cloud.yml'
              '.github/workflows/dispatch-v25-cloud-after-main-integration.yml'
            )
            set +e
            git diff --quiet --no-ext-diff "${source_sha}..${current_main}" -- "${release_relevant_pathspecs[@]}"
            release_drift_status=$?
            set -e
            if (( release_drift_status == 1 )); then
              echo "main advanced with release-relevant changes; superseded dispatcher ${source_sha} exits before reservation/dispatch. Newer relevant main push owns the next release decision."
              exit 0
            fi
            if (( release_drift_status != 0 )); then
              echo "Could not inspect release-relevant main drift between ${source_sha} and ${current_main}; git diff exit ${release_drift_status}." >&2
              exit "${release_drift_status}"
            fi
            echo "main advanced only through non-release paths; dispatch remains pinned to ${source_sha}. Release preparation may absorb that inert main drift without changing source provenance."
          fi

          git fetch --force --tags origin

          active_release_runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release-v25-cloud.yml/runs?per_page=30" --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [[ ! "${active_release_runs}" =~ ^[0-9]+$ ]]; then
            echo "Could not determine active V25 cloud release-run count: ${active_release_runs}" >&2
            exit 1
          fi
          if (( active_release_runs > 0 )); then
            echo "A V25 cloud release is already queued or running; this landing stays pending for the next batch decision."
            exit 0
          fi

          series_prefix="v0.1.0-preview."
          published_preview_tag=""
          published_preview_ordinal=0
          while IFS=$'\t' read -r release_tag release_draft release_published_at; do
            [[ -n "${release_tag}" ]] || continue
            if [[ "${release_draft}" != "false" || -z "${release_published_at}" ]]; then
              continue
            fi
            if [[ ! "${release_tag}" =~ ^v0\.1\.0-preview\.([1-9][0-9]*)$ ]]; then
              continue
            fi
            ordinal_text="${BASH_REMATCH[1]}"
            if (( ${#ordinal_text} > 5 )); then
              echo "Published preview ordinal exceeds the FileVersion 0..65535 range: ${release_tag}" >&2
              exit 1
            fi
            ordinal=$((10#${ordinal_text}))
            if (( ordinal > 65535 )); then
              echo "Published preview ordinal exceeds the FileVersion 0..65535 range: ${release_tag}" >&2
              exit 1
            fi
            if (( ordinal > published_preview_ordinal )); then
              published_preview_ordinal=${ordinal}
              published_preview_tag="${release_tag}"
            fi
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | [.tag_name, (.draft | tostring), (.published_at // "")] | @tsv'
          )
          echo "Published V25 preview baseline: ${published_preview_tag:-'(none)'}"

          gate_args=(
            scripts/v25-release-batch-gate.py
            --source-sha "${source_sha}"
            --minimum-changes "${MINIMUM_RELEASE_CHANGES}"
            --previous-published-tag "${published_preview_tag}"
            --require-ready
          )
          set +e
          python "${gate_args[@]}"
          gate_status=$?
          set -e
          if (( gate_status == 3 )); then
            echo "Preview batch is not yet eligible; no release ordinal is reserved and no release workflow is dispatched."
            exit 0
          fi
          if (( gate_status != 0 )); then
            echo "Preview batch evaluation failed with exit ${gate_status}." >&2
            exit "${gate_status}"
          fi

          version_project="src/QS3D.BricsCAD.V25/QS3D.BricsCAD.V25.csproj"
          mapfile -t committed_versions < <(
            sed -nE 's|^[[:space:]]*<Version>([^<]+)</Version>[[:space:]]*$|\1|p' "${version_project}"
          )
          if (( ${#committed_versions[@]} != 1 )); then
            echo "Protected-main V25 project must contain exactly one committed Version value; found ${#committed_versions[@]}." >&2
            exit 1
          fi
          committed_product_version="${committed_versions[0]}"
          if [[ ! "${committed_product_version}" =~ ^0\.1\.0-preview\.([1-9][0-9]*)$ ]]; then
            echo "Protected-main V25 ProductVersion is not a canonical automatic preview identity: ${committed_product_version}" >&2
            exit 1
          fi
          committed_preview_text="${BASH_REMATCH[1]}"
          if (( ${#committed_preview_text} > 5 )); then
            echo "Committed preview ordinal exceeds the FileVersion 0..65535 range: ${committed_product_version}" >&2
            exit 1
          fi
          committed_preview_ordinal=$((10#${committed_preview_text}))
          if (( committed_preview_ordinal > 65535 )); then
            echo "Committed preview ordinal exceeds the FileVersion 0..65535 range: ${committed_product_version}" >&2
            exit 1
          fi
          tag="${series_prefix}${committed_preview_ordinal}"

          if (( committed_preview_ordinal <= published_preview_ordinal )); then
            echo "Batch is eligible, but protected main ProductVersion must be advanced before automatic preview dispatch. Committed=${committed_product_version} published=${published_preview_tag:-'(none)'}. Refusing to reserve or dispatch an uncommitted preview tag."
            exit 0
          fi
          if [[ -n "$(git tag --list "${tag}")" ]]; then
            echo "Committed ProductVersion ${committed_product_version} already has Git tag ${tag}; refusing duplicate automatic dispatch." >&2
            exit 1
          fi

          reservation_issue=1441
          reservation_prefix="QS3D_V25_PREVIEW_RESERVATION"
          reservation_regex="^${reservation_prefix} ordinal=([1-9][0-9]*) source_sha=([0-9a-f]{40}) run_id=([1-9][0-9]*)$"
          exact_reservation=0
          reservation_conflict=0
          while IFS= read -r reservation; do
            [[ -n "${reservation}" ]] || continue
            if [[ "${reservation}" =~ ${reservation_regex} ]]; then
              reserved_ordinal=$((10#${BASH_REMATCH[1]}))
              reserved_source="${BASH_REMATCH[2]}"
              if (( reserved_ordinal == committed_preview_ordinal )); then
                if [[ "${reserved_source}" == "${source_sha}" ]]; then
                  exact_reservation=1
                elif [[ "${reserved_source}" != "${source_sha}" ]]; then
                  reservation_conflict=1
                fi
              fi
            fi
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${reservation_issue}/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body')

          if (( reservation_conflict != 0 )); then
            echo "Committed preview ordinal is already reserved for a different source SHA: ${committed_preview_ordinal}." >&2
            exit 1
          fi

          if (( exact_reservation == 0 )); then
            reservation="${reservation_prefix} ordinal=${committed_preview_ordinal} source_sha=${source_sha} run_id=${GITHUB_RUN_ID}"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${reservation_issue}/comments" \
              -f body="${reservation}" >/dev/null
            echo "Reserved committed preview ordinal ${committed_preview_ordinal} for ${source_sha}."
          else
            echo "Reusing exact committed preview reservation ${committed_preview_ordinal} for ${source_sha}."
          fi

          echo "Dispatching release-v25-cloud.yml for ${source_sha} as committed tag ${tag}"
          gh workflow run release-v25-cloud.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f source_sha="${source_sha}" \
            -f release_tag="${tag}" \
            -f confirm_release=RELEASE
