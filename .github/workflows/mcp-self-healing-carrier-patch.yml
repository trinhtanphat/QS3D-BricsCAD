name: QS3D one-shot MCP self-healing carrier patch

on:
  push:
    branches:
      - 'agent/gpt56sol-selfheal-9f2c1a/issue-5340-mcp-self-healing-repair'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/gpt56sol-selfheal-9f2c1a/issue-5340-mcp-self-healing-repair
          fetch-depth: 0

      - name: Apply and verify localized transport patch
        shell: bash
        run: |
          python scripts/apply-mcp-self-healing-carrier-patch.py
          python scripts/preflight-mcp-self-healing-repair.py
          git diff --check -- src/QS3D.BricsCAD.V25/McpEmbeddedServerV2.cs

      - name: Commit patch and delete temporary carrier files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/QS3D.BricsCAD.V25/McpEmbeddedServerV2.cs
          git rm .github/workflows/mcp-self-healing-carrier-patch.yml scripts/apply-mcp-self-healing-carrier-patch.py
          git diff --cached --check
          git commit -m "feat(mcp): integrate repair metadata into tool errors"
          git push origin HEAD:refs/heads/agent/gpt56sol-selfheal-9f2c1a/issue-5340-mcp-self-healing-repair
