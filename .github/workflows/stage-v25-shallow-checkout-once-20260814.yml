name: Stage V25 shallow checkout once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stage-v25-shallow-checkout-once-20260814.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Stage shallow checkout workflow
        shell: python {0}
        run: |
          from pathlib import Path
          source = Path('.github/workflows/release-v25-cloud.yml')
          target = Path('ci-staging/release-v25-cloud-shallow.yml')
          s = source.read_text(encoding='utf-8')
          old = "      - uses: actions/checkout@v7\n        with:\n          fetch-depth: 0\n"
          new = "      - uses: actions/checkout@v7\n        with:\n          fetch-depth: 1\n          fetch-tags: true\n"
          if s.count(old) != 1:
              raise SystemExit(f'Expected one full-history checkout block, got {s.count(old)}')
          s = s.replace(old, new, 1)
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(s, encoding='utf-8')
      - name: Commit staged workflow blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-staging/release-v25-cloud-shallow.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No staged workflow produced"; exit 1; }
          git commit -m "ci(v25): stage shallow checkout workflow blob"
          git pull --rebase origin main
          git push origin HEAD:main
