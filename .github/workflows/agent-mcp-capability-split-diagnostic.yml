name: Diagnostic MCP capability lane implementation

on:
  push:
    branches:
      - "agent/chatgpt-web-gpt56sol-20260831/issue-4997-mcp-capability-lanes"

permissions:
  contents: write

concurrency:
  group: diagnostic-mcp-capability-lanes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"
      - name: Verify RED, implement, verify GREEN, persist result
        run: python scripts/agent-run-mcp-capability-split-diagnostic.py
