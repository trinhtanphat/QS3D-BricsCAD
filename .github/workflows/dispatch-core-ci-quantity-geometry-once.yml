name: Dispatch Quantity Geometry Core CI Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-core-ci-quantity-geometry-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for dispatcher cleanup
        run: sleep 30
      - name: Dispatch core CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml \
            --repo "${{ github.repository }}" \
            --ref main
