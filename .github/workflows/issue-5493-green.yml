name: issue-5493-green

on:
  push:
    branches:
      - agent/gpt56sol-20260903-durable-ack-hardening-v2/issue-5493-public-status-fingerprint

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[5493-green-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply minimal public ACK schema patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/QS3D.BricsCAD.V25/McpEmbeddedServerV2.cs')
          text = path.read_text(encoding='utf-8')

          old = '''                Tool("cad_active_document", "Read privacy-safe active document identity without local filesystem path.", ""),
                Tool("cad_selection", "Read current implied selection handles/types/layers.", ""),'''
          new = '''                Tool("cad_active_document", "Read privacy-safe active document identity without local filesystem path.", ""),
                Tool("cad_mutation_status", "Read mutation acknowledgement state for a bounded retry actionId.", ActionIdProperty(), "actionId"),
                Tool("cad_selection", "Read current implied selection handles/types/layers.", ""),'''
          if old not in text:
              raise SystemExit('tools/list insertion anchor not found')
          text = text.replace(old, new, 1)

          old = '''        private static string MergeToolProperties(string properties)
        {
            var common = ExecutionModeProperties() + "," + WriterTokenProperty();
            return string.IsNullOrWhiteSpace(properties) ? common : common + "," + properties;
        }
'''
          new = '''        private static string ActionIdProperty()
        {
            return "\\\"actionId\\\":{\\\"type\\\":\\\"string\\\",\\\"minLength\\\":1,\\\"maxLength\\\":128}";
        }

        private static bool SupportsMutationAck(string name)
        {
            var tool = name ?? string.Empty;
            switch (tool)
            {
                case "cad_create_line":
                case "cad_create_circle":
                case "cad_create_arc":
                case "cad_create_polyline":
                case "cad_create_text":
                case "cad_create_mtext":
                case "cad_entity_transform":
                case "cad_entity_delete":
                case "cad_entity_set_layer":
                case "cad_layer":
                case "cad_command_sequence":
                case "qs3d_run_command":
                case "qs3d_place_single_footing":
                case "cad_ui_click":
                case "cad_ui_type":
                case "cad_ui_key":
                    return true;
            }
            if (McpQs3dDomainRuntime.IsTool(tool)) return McpQs3dDomainRuntime.RequiresMutation(tool);
            if (McpCadDirectModelRuntime.IsTool(tool)) return McpCadDirectModelRuntime.RequiresMutation(tool);
            if (McpDesktopAutomationRuntime.IsTool(tool)) return McpDesktopAutomationRuntime.RequiresMutation(tool);
            return false;
        }

        private static string MergeToolProperties(string name, string properties)
        {
            var additions = new List<string>(3) { ExecutionModeProperties(), WriterTokenProperty() };
            if (SupportsMutationAck(name)) additions.Add(ActionIdProperty());
            var common = string.Join(",", additions);
            return string.IsNullOrWhiteSpace(properties) ? common : common + "," + properties;
        }
'''
          if old not in text:
              raise SystemExit('MergeToolProperties anchor not found')
          text = text.replace(old, new, 1)

          old = '''                   + "\\\",\\\"inputSchema\\\":{\\\"type\\\":\\\"object\\\",\\\"properties\\\":{" + MergeToolProperties(properties)
'''
          new = '''                   + "\\\",\\\"inputSchema\\\":{\\\"type\\\":\\\"object\\\",\\\"properties\\\":{" + MergeToolProperties(name, properties)
'''
          if old not in text:
              raise SystemExit('Tool MergeToolProperties call anchor not found')
          text = text.replace(old, new, 1)

          old = '''            var additions = new List<string>();
            if (raw.IndexOf("\\\"executionMode\\\"", StringComparison.Ordinal) < 0)
                additions.Add(ExecutionModeProperties());
            if (raw.IndexOf("\\\"writerToken\\\"", StringComparison.Ordinal) < 0)
                additions.Add(WriterTokenProperty());
'''
          new = '''            var additions = new List<string>();
            string name;
            try { name = McpTopLevelJson.ExtractString(raw, "name"); }
            catch (InvalidOperationException) { name = string.Empty; }
            if (raw.IndexOf("\\\"executionMode\\\"", StringComparison.Ordinal) < 0)
                additions.Add(ExecutionModeProperties());
            if (raw.IndexOf("\\\"writerToken\\\"", StringComparison.Ordinal) < 0)
                additions.Add(WriterTokenProperty());
            if (SupportsMutationAck(name) && raw.IndexOf("\\\"actionId\\\"", StringComparison.Ordinal) < 0)
                additions.Add(ActionIdProperty());
'''
          if old not in text:
              raise SystemExit('extension property injection anchor not found')
          text = text.replace(old, new, 1)

          old = '''                case "cad_active_document":
                case "cad_selection":'''
          new = '''                case "cad_active_document":
                case "cad_mutation_status":
                case "cad_selection":'''
          if old not in text:
              raise SystemExit('read-only annotation anchor not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit GREEN production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/QS3D.BricsCAD.V25/McpEmbeddedServerV2.cs
          if git diff --cached --quiet; then
            echo "No production change to commit."
            exit 0
          fi
          git commit -m "fix(mcp): publish durable ACK retry identity (#5493) [5493-green-applied]"
          git push origin HEAD:${GITHUB_REF_NAME}
