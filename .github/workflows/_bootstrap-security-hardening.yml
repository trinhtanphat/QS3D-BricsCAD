name: One-shot CI supply-chain hardening bootstrap

on:
  push:
    branches:
      - agent/gpt56sol/security-actions-hardening-1817
    paths:
      - ".github/workflows/_bootstrap-security-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.ref == 'refs/heads/agent/gpt56sol/security-actions-hardening-1817' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Apply repository workflow hardening
        run: python scripts/apply-ci-supply-chain-hardening.py
      - name: Validate hardened workflow source
        run: |
          git diff --check
          python scripts/check-actions-pinned.py
      - name: Commit one-shot hardening result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hardening changes were required."
            exit 0
          fi
          git commit -m "security(ci): pin Actions and require HTTPS supply chain (#1817)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
