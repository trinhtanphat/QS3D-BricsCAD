name: C05 6097 exact publisher cleanup

on:
  push:
    branches:
      - agent/gpt56sol-20260908-c05-v26-publish-ack-safety/issue-6097-v26-publish-ack-safety

permissions:
  contents: write

concurrency:
  group: c05-6097-selfpatch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Remove exact dead assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('scripts/publish-v26-release.ps1')
          raw = path.read_bytes()
          newline = b'\r\n' if b'\r\n' in raw else b'\n'
          old = (
              b'        $publicationSafetyInvalidated = $false' + newline
              + b'        if ($publicationSafetyInvalidated) { throw "V26 release publication safety remains unproven after acknowledgement reconciliation; refusing success. Manual release review is required." }' + newline
              + b'        Assert-PublishedReleaseMatchesVerifiedTransaction `'
          )
          new = (
              b'        $publicationSafetyInvalidated = $false' + newline
              + b'        Assert-PublishedReleaseMatchesVerifiedTransaction `'
          )
          count = raw.count(old)
          if count != 1:
              raise SystemExit(f'expected cleanup snippet exactly once, found {count}')
          path.write_bytes(raw.replace(old, new, 1))

      - name: Verify focused guard and PowerShell parse
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight-v26-publish-ack-safety.py
          pwsh -NoLogo -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/publish-v26-release.ps1", [ref]$null, [ref]$errors) > $null; if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'

      - name: Commit cleanup and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/c05-6097-selfpatch.yml
          git add scripts/publish-v26-release.ps1
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor(release): remove dead V26 safety assertion #6097"
          git push origin "HEAD:${GITHUB_REF_NAME}"
