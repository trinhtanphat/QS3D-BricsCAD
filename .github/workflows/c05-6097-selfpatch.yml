name: C05 6097 exact publisher self-patch

on:
  push:
    branches:
      - agent/gpt56sol-20260908-c05-v26-publish-ack-safety/issue-6097-v26-publish-ack-safety

permissions:
  contents: write

concurrency:
  group: c05-6097-selfpatch
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Assert exact event SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Apply exact-snippet publication-safety patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/publish-v26-release.ps1')
          raw = path.read_bytes()
          newline = b'\r\n' if b'\r\n' in raw else b'\n'

          def encoded(text: str) -> bytes:
              return text.replace('\n', newline.decode('ascii')).encode('utf-8')

          def replace_once(old: str, new: str) -> None:
              global raw
              old_b = encoded(old)
              new_b = encoded(new)
              count = raw.count(old_b)
              if count != 1:
                  raise SystemExit(f'expected exact old snippet once, found {count}: {old!r}')
              raw = raw.replace(old_b, new_b, 1)

          replace_once(
              "$publicationSafetyInvalidated = $false\n\ntry {",
              "$publicationSafetyInvalidated = $false\n$publicationSafetyKnownInvalid = $false\n\ntry {",
          )
          replace_once(
              "  $publishPatchAttempted = $true\n  $publishRequest = @{",
              "  $publishPatchAttempted = $true\n  # Once the mutation starts, publication safety is unproven until protected main is revalidated.\n  $publicationSafetyInvalidated = $true\n  $publishRequest = @{",
          )
          replace_once(
              "    Assert-ProtectedMainStableForPublisherMutation -Phase 'post-release-publish'\n  }\n  catch {\n    $publicationSafetyInvalidated = $true",
              "    Assert-ProtectedMainStableForPublisherMutation -Phase 'post-release-publish'\n    $publicationSafetyInvalidated = $false\n  }\n  catch {\n    $publicationSafetyInvalidated = $true\n    $publicationSafetyKnownInvalid = $true",
          )
          replace_once(
              "        if (-not $publishPatchAttempted) { throw \"V26 release became published before this workflow attempted the final publish PATCH.\" }\n        if ($publicationSafetyInvalidated) { throw \"V26 release is published, but post-PATCH protected-main safety was invalidated; refusing ambiguous acknowledgement success. Manual release review is required.\" }\n        Assert-PublishedReleaseMatchesVerifiedTransaction `",
              "        if (-not $publishPatchAttempted) { throw \"V26 release became published before this workflow attempted the final publish PATCH.\" }\n        if ($publicationSafetyKnownInvalid) { throw \"V26 release is published, but post-PATCH protected-main safety was already observed invalid; refusing acknowledgement recovery. Manual release review is required.\" }\n        Assert-ProtectedMainStableForPublisherMutation -Phase 'publish-acknowledgement-reconciliation'\n        $publicationSafetyInvalidated = $false\n        if ($publicationSafetyInvalidated) { throw \"V26 release publication safety remains unproven after acknowledgement reconciliation; refusing success. Manual release review is required.\" }\n        Assert-PublishedReleaseMatchesVerifiedTransaction `",
          )

          path.write_bytes(raw)

      - name: Verify focused guard and PowerShell parse
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight-v26-publish-ack-safety.py
          pwsh -NoLogo -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/publish-v26-release.ps1", [ref]$null, [ref]$errors) > $null; if ($errors.Count -ne 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'

      - name: Commit production fix and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/c05-6097-selfpatch.yml
          git add scripts/publish-v26-release.ps1
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(release): fail closed on ambiguous V26 publish acknowledgement #6097"
          git push origin "HEAD:${GITHUB_REF_NAME}"
