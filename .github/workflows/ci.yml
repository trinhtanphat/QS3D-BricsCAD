name: QS3D Shared Branch and Integration CI

on:
  workflow_dispatch:
  # Quoted automatic event keys are intentional. scripts/preflight.py keeps its
  # broad legacy fail-closed rule; scripts/preflight-ci-manual-only.py is the
  # strict allowlist for this non-publishing validation workflow.
  "push":
    branches:
      - "agent/**"
      - "integration/**"
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "Directory.Build.props"
      - "QS3D.sln"
      - "QS3D.V26.sln"
      - "CI_POLICY.md"
      - "AGENTS.md"
      - "README.md"
      - "docs/MAIN-WRITE-AUTHORIZATION.md"
      - "docs/AGENT-WORK-REGISTRATION.md"
  "pull_request":
    branches:
      - main
      - "integration/**"
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "Directory.Build.props"
      - "QS3D.sln"
      - "QS3D.V26.sln"
      - "CI_POLICY.md"
      - "AGENTS.md"
      - "README.md"
      - "docs/MAIN-WRITE-AUTHORIZATION.md"
      - "docs/AGENT-WORK-REGISTRATION.md"

permissions:
  contents: read

concurrency:
  group: qs3d-shared-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: CI trigger and publishing policy gate
        run: python scripts/preflight-ci-manual-only.py
      - name: Generic source guard
        run: python scripts/preflight.py
      - name: All discovered feature source guards
        run: python scripts/preflight-all.py
      - name: Validate release PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            'scripts/package-v25.ps1',
            'scripts/verify-v25-package.ps1',
            'scripts/test-v25-package-verifier.ps1',
            'scripts/install-v25-autoload.ps1',
            'scripts/uninstall-v25-autoload.ps1',
            'scripts/update-v25.ps1',
            'scripts/new-v25-update-manifest.ps1',
            'scripts/finalize-v25-signed-package.ps1',
            'scripts/sign-v25.ps1',
            'scripts/verify-v25-signatures.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-Table -AutoSize | Out-String | Write-Host
              throw "PowerShell parse failure: $script"
            }
          }
      - name: V25 package integrity contract tests
        shell: pwsh
        run: .\scripts\test-v25-package-verifier.ps1

  core:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' }}
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build core
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release
      - name: Run deterministic smoke tests
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release
