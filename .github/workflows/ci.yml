name: QS3D Task / Core CI

on:
  push:
    branches:
      - main
      - "agent/**"
      - "recovery/**"
      - "integration/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "LICENSE*"
      - "NOTICE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - ".gitattributes"
      - ".editorconfig"
      - "LICENSE*"
      - "NOTICE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE*"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify exact checkout SHA
        shell: pwsh
        run: |
          $expected = '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'.ToLowerInvariant()
          $actual = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checkout SHA mismatch: expected $expected, actual $actual"
          }
          Write-Host "Exact source SHA: $actual"
      - name: CI policy gate
        run: python scripts/preflight-ci-manual-only.py
      - name: Generic source guard
        run: python scripts/source-guard-current-ci.py
      - name: All discovered feature source guards
        run: python scripts/preflight-all.py
      - name: Validate release PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            'scripts/package-v25.ps1',
            'scripts/verify-v25-package.ps1',
            'scripts/test-v25-package-verifier.ps1',
            'scripts/install-v25-autoload.ps1',
            'scripts/uninstall-v25-autoload.ps1',
            'scripts/update-v25.ps1',
            'scripts/new-v25-update-manifest.ps1',
            'scripts/finalize-v25-signed-package.ps1',
            'scripts/sign-v25.ps1',
            'scripts/verify-v25-signatures.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-Table -AutoSize | Out-String | Write-Host
              throw "PowerShell parse failure: $script"
            }
          }
      - name: V25 package integrity contract tests
        shell: pwsh
        run: .\scripts\test-v25-package-verifier.ps1

  core:
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Build core
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release
      - name: Run deterministic smoke tests
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release
