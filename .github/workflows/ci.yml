name: QS3D Core CI

on:
  workflow_dispatch:
  push:
    branches:
      - ci/completion-latest-20260810

permissions:
  contents: read

jobs:
  preflight:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Present release-tree workflow policy to preflight
        shell: pwsh
        run: |
          $path = '.github/workflows/ci.yml'
          $text = Get-Content $path -Raw
          $text = $text -replace "(?ms)\r?\n  push:\r?\n    branches:\r?\n      - ci/completion-latest-20260810\r?\n", "`n"
          Set-Content -Path $path -Value $text -Encoding UTF8
      - name: Preflight source guard
        run: python scripts/preflight.py

  core:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build core
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release
      - name: Run deterministic smoke tests
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release
