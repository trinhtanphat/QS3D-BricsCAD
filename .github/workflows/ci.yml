name: QS3D Shared Branch and Integration CI

on:
  workflow_dispatch:
  # Every task/integration branch push must produce an exact-head validation run.
  # The jobs classify changed paths against main and keep docs/metadata-only candidates lightweight.
  # PR validation intentionally has no paths filter because protected main always requires
  # stable `preflight` and `core` contexts.
  "push":
    branches:
      - "agent/**"
      - "integration/**"
  "pull_request":
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - main
      - "integration/**"

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: qs3d-shared-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      source_validation: ${{ steps.scope.outputs.source_validation }}
      build_validation: ${{ steps.scope.outputs.build_validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: CI trigger and publishing policy gate
        run: python scripts/preflight-ci-manual-only.py
      - name: Changed-path tokenization regression
        run: python scripts/test-ci-changed-path-tokenization.py
      - name: Repository professionalism gate
        run: python scripts/preflight-repository-professionalism.py
      - name: Immutable GitHub Actions supply-chain gate
        run: python scripts/check-actions-pinned.py
      - name: Classify validation scope
        id: scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # scripts/ci-validation-scope.py owns the exact path classes: src/, tests/, scripts/,
          # samples/generated/, .github/workflows/, build roots, and watched policy Markdown.
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            & python scripts/ci-validation-scope.py --all --github-output $env:GITHUB_OUTPUT
          }
          else {
            $baseBranch = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') { $env:GITHUB_BASE_REF } else { 'main' }
            if ([string]::IsNullOrWhiteSpace($baseBranch)) {
              throw 'A comparison base branch is required for validation scope classification.'
            }
            & git fetch --no-tags origin "+refs/heads/$baseBranch`:refs/remotes/origin/$baseBranch"
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch validation base $baseBranch." }
            & python scripts/ci-validation-scope.py --base "origin/$baseBranch" --head HEAD --github-output $env:GITHUB_OUTPUT
          }
          if ($LASTEXITCODE -ne 0) { throw 'Validation scope classification failed.' }
      - name: PR branch CI admission gate
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' && github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && steps.scope.outputs.source_validation == 'true' }}
        env:
          QS3D_PR_BRANCH_CI_RUNTIME: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/preflight-pr-branch-ci-gate.py
      - name: Agent reservation / Lane-Key / path collision gate
        if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && (github.event.action != 'edited' || !startsWith(github.event.pull_request.head.ref, 'agent/'))) }}
        env:
          QS3D_AGENT_LANE_COLLISION_RUNTIME: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/preflight-agent-lane-collision.py
      - name: Generic source guard
        if: ${{ steps.scope.outputs.source_validation == 'true' }}
        run: python scripts/preflight.py
      - name: All discovered feature source guards
        if: ${{ steps.scope.outputs.source_validation == 'true' }}
        run: python scripts/preflight-all.py
      - name: Validate tracked PowerShell syntax
        if: ${{ steps.scope.outputs.source_validation == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptJson = & python scripts/list-tracked-powershell.py --root .
          if ($LASTEXITCODE -ne 0) { throw 'Could not enumerate tracked PowerShell scripts safely.' }
          try {
            $scripts = @($scriptJson | ConvertFrom-Json -ErrorAction Stop)
          }
          catch {
            throw "Tracked PowerShell enumeration did not return valid JSON: $($_.Exception.Message)"
          }
          if ($scripts.Count -eq 0) { throw 'No tracked PowerShell scripts were found below scripts/.' }
          foreach ($script in $scripts) {
            if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
              throw "Tracked PowerShell script is missing from the checkout: $script"
            }
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $script).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-Table -AutoSize | Out-String | Write-Host
              throw "PowerShell parse failure: $script"
            }
          }
          Write-Host "Validated $($scripts.Count) tracked PowerShell script(s)."
      - name: V25 package integrity contract tests
        if: ${{ steps.scope.outputs.source_validation == 'true' }}
        shell: pwsh
        run: .\scripts\test-v25-package-verifier.ps1

  core:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request' }}
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      BRICSCAD_V25_MIRROR_MSI_URL: https://storage.googleapis.com/production-boa-storage/ftp/release/en_US/BricsCAD/Windows/25.2.10/BricsCAD-V25.2.10-1-en_US%28x64%29.msi
      BRICSCAD_V25_PUBLIC_MSI_URL: https://storage.googleapis.com/production-boa-storage/ftp/release/en_US/BricsCAD/Windows/25.2.10/BricsCAD-V25.2.10-1-en_US%28x64%29.msi
      BRICSCAD_V25_PINNED_MSI_SHA256: F44DF674C0E165D96BF579E243B20A8301E3F395F929779F47BF39A7D9DACDE1
      BRICSCAD_V25_MSI_URL: ${{ secrets.BRICSCAD_V25_MSI_URL }}
    steps:
      - name: Lightweight non-build candidate
        if: ${{ needs.preflight.outputs.build_validation != 'true' }}
        shell: pwsh
        run: Write-Host 'No build-relevant paths changed; stable required core context succeeds without a redundant Core/V25 rebuild.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.preflight.outputs.build_validation == 'true' }}
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: ${{ needs.preflight.outputs.build_validation == 'true' }}
        with:
          dotnet-version: "8.0.x"
      - name: Build core
        if: ${{ needs.preflight.outputs.build_validation == 'true' }}
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release
      - name: Run deterministic smoke tests
        if: ${{ needs.preflight.outputs.build_validation == 'true' }}
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release
      - name: Restore BricsCAD V25 installer cache
        if: ${{ needs.preflight.outputs.build_validation == 'true' }}
        id: bricscad-msi-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/bricscad/BricsCAD-V25.2.10-x64.msi
          key: bricscad-v25.2.10-x64-en-us-${{ env.BRICSCAD_V25_PINNED_MSI_SHA256 }}
      - name: Acquire trusted BricsCAD V25 compile references
        if: ${{ needs.preflight.outputs.build_validation == 'true' }}
        timeout-minutes: 30
        shell: pwsh
        run: |
          $msi = Join-Path $env:GITHUB_WORKSPACE '.cache\bricscad\BricsCAD-V25.2.10-x64.msi'
          $extract = Join-Path $env:RUNNER_TEMP 'BricsCAD-V25-managed-references'
          $bricsDir = (& .\scripts\acquire-v25-compile-references.ps1 `
            -MsiPath $msi `
            -ExtractDir $extract `
            -ExpectedSha256 $env:BRICSCAD_V25_PINNED_MSI_SHA256 `
            -MirrorUrl $env:BRICSCAD_V25_MIRROR_MSI_URL `
            -PublicUrl $env:BRICSCAD_V25_PUBLIC_MSI_URL `
            -FallbackUrl $env:BRICSCAD_V25_MSI_URL | Select-Object -Last 1)
          if ([string]::IsNullOrWhiteSpace([string]$bricsDir)) {
            throw 'BricsCAD V25 compile-reference acquisition returned no runtime directory.'
          }
          "BRICSCAD_V25_DIR=$([string]$bricsDir)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Save BricsCAD V25 installer cache
        if: ${{ needs.preflight.outputs.build_validation == 'true' && steps.bricscad-msi-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/bricscad/BricsCAD-V25.2.10-x64.msi
          key: bricscad-v25.2.10-x64-en-us-${{ env.BRICSCAD_V25_PINNED_MSI_SHA256 }}
      - name: Validate BricsCAD V25 compile references
        if: ${{ needs.preflight.outputs.build_validation == 'true' }}
        shell: pwsh
        run: |
          if (-not $env:BRICSCAD_V25_DIR) { throw 'BRICSCAD_V25_DIR was not resolved from the pinned installer.' }
          foreach ($name in @('BrxMgd.dll', 'TD_Mgd.dll', 'TD_MgdBrep.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $env:BRICSCAD_V25_DIR $name) -PathType Leaf)) {
              throw "Required BricsCAD V25 compile reference is missing: $name"
            }
          }
      - name: Build BricsCAD V25 plugin against locked reference generations
        if: ${{ needs.preflight.outputs.build_validation == 'true' }}
        shell: pwsh
        run: |
          .\scripts\build-v25-with-stable-references.ps1 `
            -BricsCadDir $env:BRICSCAD_V25_DIR `
            -ProjectPath (Join-Path $env:GITHUB_WORKSPACE 'src\QS3D.BricsCAD.V25\QS3D.BricsCAD.V25.csproj') `
            -SnapshotDir (Join-Path $env:RUNNER_TEMP 'qs3d-v25-plugin-reference-snapshot') `
            -Configuration Release `
            -Platform x64
      - name: Build #3681 local V25 qualification harness against locked reference generations
        if: ${{ needs.preflight.outputs.build_validation == 'true' }}
        shell: pwsh
        run: |
          .\scripts\build-v25-with-stable-references.ps1 `
            -BricsCadDir $env:BRICSCAD_V25_DIR `
            -ProjectPath (Join-Path $env:GITHUB_WORKSPACE 'tests\QS3D.BricsCAD.V25.LocalQualification\QS3D.BricsCAD.V25.LocalQualification.csproj') `
            -SnapshotDir (Join-Path $env:RUNNER_TEMP 'qs3d-v25-local-qualification-reference-snapshot') `
            -Configuration Release `
            -Platform x64
