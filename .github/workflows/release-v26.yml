name: QS3D Manual V26 Build & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      confirm_release:
        description: "Explicit publish confirmation"
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "RELEASE"
      run_runtime:
        description: "Run real BricsCAD V26 NETLOAD/runtime validation on the exact release plugin payload"
        required: true
        default: true
        type: boolean
      sign_package:
        description: "Authenticode-sign and timestamp the V26 release package (required for stable releases)"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Publish as GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: qs3d-manual-v26-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_release == 'RELEASE' }}
    runs-on: [self-hosted, windows, x64, bricscad-v26]
    env:
      BRICSCAD_V26_DIR: ${{ vars.BRICSCAD_V26_DIR }}
      BRICSCAD_V26_PROFILE: ${{ vars.BRICSCAD_V26_PROFILE }}
      QS3D_SIGNING_CERT_THUMBPRINT: ${{ vars.QS3D_SIGNING_CERT_THUMBPRINT }}
      QS3D_TIMESTAMP_SERVER: ${{ vars.QS3D_TIMESTAMP_SERVER }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_RUN_RUNTIME: ${{ inputs.run_runtime }}
      RELEASE_SIGN_PACKAGE: ${{ inputs.sign_package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"

      - name: Bind V26 host-reference state path
        shell: powershell
        run: |
          $statePath = Join-Path $env:RUNNER_TEMP "qs3d-v26-host-reference-state.json"
          "V26_HOST_REFERENCE_STATE=$statePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate manual V26 release request
        shell: powershell
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "V26 releases must be dispatched from refs/heads/main. Current ref: $env:GITHUB_REF"
          }
          # Shared validator preserves the stable contracts: Stable V26 release requires run_runtime=true.
          # Shared validator preserves the stable contracts: Stable V26 release requires sign_package=true.
          $releaseRequest = & .\scripts\assert-v26-release-request.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -Prerelease:($env:RELEASE_PRERELEASE -eq 'true') `
            -RunRuntime:($env:RELEASE_RUN_RUNTIME -eq 'true') `
            -SignPackage:($env:RELEASE_SIGN_PACKAGE -eq 'true')
          if ($null -eq $releaseRequest) {
            throw 'Strict V26 release request validation did not return a parsed request.'
          }
          $isPrerelease = [bool]$releaseRequest.IsPrerelease
          $signPackage = [bool]$releaseRequest.SignPackage
          "V26_RELEASE_REQUEST_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "V26_RELEASE_REQUEST_SIGN_PACKAGE=$($signPackage.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          git rev-parse --verify HEAD | Out-Null
          $localTag = @(git tag --list --format='%(objecttype) %(objectname)' $env:RELEASE_TAG)
          if ($LASTEXITCODE -ne 0 -or $localTag.Count -gt 1) { throw "Unable to classify local V26 tag identity for $env:RELEASE_TAG." }
          if ($localTag.Count -eq 1) {
            $expectedLocal = "commit $($env:GITHUB_SHA.ToLowerInvariant())"
            if (-not [string]::Equals(([string]$localTag[0]).Trim().ToLowerInvariant(), $expectedLocal, [StringComparison]::Ordinal)) {
              throw "Existing local V26 release tag $env:RELEASE_TAG is not an exact lightweight tag at workflow SHA $env:GITHUB_SHA."
            }
          }

          if ($signPackage) {
            if ($env:QS3D_SIGNING_CERT_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
              throw "QS3D_SIGNING_CERT_THUMBPRINT must be a 40-hex Authenticode thumbprint."
            }
            $timestamp = $null
            if (-not [Uri]::TryCreate($env:QS3D_TIMESTAMP_SERVER, [UriKind]::Absolute, [ref]$timestamp) -or $timestamp.Scheme -ne 'https') {
              throw "QS3D_TIMESTAMP_SERVER must be an absolute HTTPS URL."
            }
          }

      - name: Manual-only CI policy gate
        run: python scripts/preflight-ci-manual-only.py

      - name: Generic source guard
        run: python scripts/preflight.py

      - name: All discovered feature source guards
        run: python scripts/preflight-all.py

      - name: V26 host compatibility guard
        run: python scripts/preflight-bricscad-v26.py

      - name: V26 package/release isolation guard
        run: python scripts/preflight-v26-package-release.py

      - name: Build Core Release
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release

      - name: Deterministic Core smoke tests
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release

      - name: Validate BricsCAD V26 references and .NET 8 host
        shell: powershell
        run: |
          # Capture the exact ordinary/non-reparse V26 host-reference generations that later build/runtime steps are allowed to consume.
          & .\scripts\assert-v26-host-reference-safety.ps1 -BricsCadDir $env:BRICSCAD_V26_DIR -StatePath $env:V26_HOST_REFERENCE_STATE | Out-Null
          if (@(dotnet --list-runtimes | Where-Object { $_ -match '^Microsoft\.WindowsDesktop\.App 8\.' }).Count -eq 0) {
            throw ".NET 8 Windows Desktop Runtime is required for the V26 managed host."
          }

      - name: Build BricsCAD V26 plugin against held reference generations
        shell: powershell
        run: |
          & .\scripts\build-v26-with-stable-references.ps1 `
            -BricsCadDir $env:BRICSCAD_V26_DIR `
            -StatePath $env:V26_HOST_REFERENCE_STATE `
            -ProjectPath 'src\QS3D.BricsCAD.V26\QS3D.BricsCAD.V26.csproj' `
            -Configuration Release `
            -Platform x64

      - name: Real V26 runtime validation for unsigned prerelease payload
        if: ${{ inputs.run_runtime && !inputs.sign_package }}
        shell: powershell
        run: |
          & .\scripts\assert-v26-host-reference-safety.ps1 -BricsCadDir $env:BRICSCAD_V26_DIR -VerifyStatePath $env:V26_HOST_REFERENCE_STATE | Out-Null
          $plugin = (Resolve-Path "src\QS3D.BricsCAD.V26\bin\x64\Release\net8.0-windows\QS3D.BricsCAD.V26.dll").Path
          & .\scripts\test-bricscad-v26-runtime.ps1 `
            -BricsCadDir $env:BRICSCAD_V26_DIR `
            -PluginDll $plugin `
            -Profile $env:BRICSCAD_V26_PROFILE `
            -ArtifactDir "$env:GITHUB_WORKSPACE\artifacts\bricscad-v26-runtime-unsigned"

      - name: Build V26 release package
        shell: powershell
        run: .\scripts\package-v26.ps1

      - name: Validate V26 release tag and package identity
        shell: powershell
        run: |
          & .\scripts\assert-v26-release-package-identity.ps1 `
            -MetadataPath 'dist\QS3D-BricsCAD-V26\PACKAGE-METADATA.json' `
            -PluginPath 'dist\QS3D-BricsCAD-V26\QS3D.BricsCAD.V26.dll' `
            -CorePath 'dist\QS3D-BricsCAD-V26\QS3D.Core.dll' `
            -ReleaseTag $env:RELEASE_TAG | Out-Null

      - name: Authenticode-sign V26 executable payload
        if: ${{ inputs.sign_package }}
        shell: powershell
        run: |
          $payload = @(
            'dist\QS3D-BricsCAD-V26\QS3D.BricsCAD.V26.dll',
            'dist\QS3D-BricsCAD-V26\QS3D.Core.dll',
            'dist\QS3D-BricsCAD-V26\install-v26-autoload.ps1',
            'dist\QS3D-BricsCAD-V26\uninstall-v26-autoload.ps1',
            'dist\QS3D-BricsCAD-V26\update-v26.ps1'
          )
          & .\scripts\sign-v26.ps1 -Path $payload -CertificateThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT -TimestampServer $env:QS3D_TIMESTAMP_SERVER -Confirm:$false

      - name: Verify V26 Authenticode publisher and timestamp
        if: ${{ inputs.sign_package }}
        shell: powershell
        run: |
          $payload = @(
            'dist\QS3D-BricsCAD-V26\QS3D.BricsCAD.V26.dll',
            'dist\QS3D-BricsCAD-V26\QS3D.Core.dll',
            'dist\QS3D-BricsCAD-V26\install-v26-autoload.ps1',
            'dist\QS3D-BricsCAD-V26\uninstall-v26-autoload.ps1',
            'dist\QS3D-BricsCAD-V26\update-v26.ps1'
          )
          & .\scripts\verify-v26-signatures.ps1 -Path $payload -ExpectedThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT

      - name: Finalize signed V26 package
        if: ${{ inputs.sign_package }}
        shell: powershell
        run: .\scripts\finalize-v26-signed-package.ps1 -ExpectedSignerThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT -Confirm:$false

      - name: Real V26 runtime validation for signed release payload
        if: ${{ inputs.run_runtime && inputs.sign_package }}
        shell: powershell
        run: |
          & .\scripts\assert-v26-host-reference-safety.ps1 -BricsCadDir $env:BRICSCAD_V26_DIR -VerifyStatePath $env:V26_HOST_REFERENCE_STATE | Out-Null
          $plugin = (Resolve-Path "dist\QS3D-BricsCAD-V26\QS3D.BricsCAD.V26.dll").Path
          & .\scripts\test-bricscad-v26-runtime.ps1 `
            -BricsCadDir $env:BRICSCAD_V26_DIR `
            -PluginDll $plugin `
            -Profile $env:BRICSCAD_V26_PROFILE `
            -ArtifactDir "$env:GITHUB_WORKSPACE\artifacts\bricscad-v26-runtime-signed"

      - name: Create signed V26 update manifest
        if: ${{ inputs.sign_package }}
        shell: powershell
        run: |
          $packageUri = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/QS3D-BricsCAD-V26.zip"
          & .\scripts\new-v26-update-manifest.ps1 `
            -PackageUri $packageUri `
            -ExpectedSignerThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT `
            -OutputPath "dist\QS3D-BricsCAD-V26.update.json" `
            -Confirm:$false

      - name: Create V26 package checksum
        shell: powershell
        run: |
          & .\scripts\write-v26-package-checksum.ps1 `
            -PackagePath 'dist\QS3D-BricsCAD-V26.zip' `
            -OutputPath 'dist\QS3D-BricsCAD-V26.zip.sha256' | Out-Null

      - name: Upload V26 qualification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: QS3D-BricsCAD-V26-${{ inputs.release_tag }}
          if-no-files-found: error
          path: |
            dist/QS3D-BricsCAD-V26.zip
            dist/QS3D-BricsCAD-V26.zip.sha256
            dist/QS3D-BricsCAD-V26.update.json
            artifacts/bricscad-v26-runtime-unsigned/
            artifacts/bricscad-v26-runtime-signed/

      - name: Publish V26 GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "QS3D-V26-Manual-Release"
          }
          $tagRef = "refs/tags/$env:RELEASE_TAG"

          function Test-GitHubNotFound {
            param([Parameter(Mandatory = $true)]$ErrorRecord)
            $response = $ErrorRecord.Exception.Response
            if ($null -eq $response) { return $false }
            try { return ([int]$response.StatusCode -eq 404) }
            catch { return $false }
          }

          function Get-ExactReusableReleaseTag {
            $escapedTag = [Uri]::EscapeDataString($env:RELEASE_TAG)
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$escapedTag"
            try { $snapshot = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers }
            catch {
              if (Test-GitHubNotFound -ErrorRecord $_) { return $null }
              throw
            }
            if ($null -eq $snapshot -or -not [string]::Equals([string]$snapshot.ref, $tagRef, [StringComparison]::Ordinal)) {
              throw "V26 reusable release tag lookup returned a mismatched ref."
            }
            if ($null -eq $snapshot.object -or -not [string]::Equals([string]$snapshot.object.type, 'commit', [StringComparison]::Ordinal) -or -not [string]::Equals([string]$snapshot.object.sha, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Existing V26 release tag is annotated, moved, or not bound to the exact qualified workflow SHA."
            }
            return $snapshot
          }

          function Assert-RemoteReleaseTagTargetsWorkflowSha {
            $peeledRef = $tagRef + '^{}'
            $lines = @(git ls-remote --tags origin $tagRef $peeledRef)
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to resolve remote V26 release tag $env:RELEASE_TAG from origin. Release remains a draft."
            }

            $exact = New-Object System.Collections.Generic.List[string]
            $peeled = New-Object System.Collections.Generic.List[string]
            foreach ($line in $lines) {
              if ($line -notmatch '^([0-9a-fA-F]{40})\s+(.+)$') {
                throw "Malformed git ls-remote output while resolving V26 release tag $env:RELEASE_TAG. Release remains a draft."
              }
              $sha = $Matches[1]
              $refName = $Matches[2]
              if ([string]::Equals($refName, $tagRef, [StringComparison]::Ordinal)) { $exact.Add($sha) }
              elseif ([string]::Equals($refName, $peeledRef, [StringComparison]::Ordinal)) { $peeled.Add($sha) }
              else { throw "Unexpected remote ref while resolving V26 release tag: $refName. Release remains a draft." }
            }
            if ($exact.Count -ne 1 -or $peeled.Count -ne 0) {
              throw "V26 release tag $env:RELEASE_TAG must resolve to exactly one lightweight remote tag identity. Release remains a draft."
            }
            if (-not [string]::Equals($exact[0], $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) {
              throw "V26 release tag $env:RELEASE_TAG targets $($exact[0]) instead of qualified workflow SHA $env:GITHUB_SHA. Release remains a draft."
            }
          }

          function Assert-PublishedReleaseMatchesVerifiedTransaction {
            param(
              [Parameter(Mandatory = $true)]$ReleaseSnapshot,
              [Parameter(Mandatory = $true)][string]$ReleaseUri,
              [Parameter(Mandatory = $true)][long]$ReleaseId,
              [Parameter(Mandatory = $true)][string[]]$ExpectedAssets,
              [Parameter(Mandatory = $true)][hashtable]$VerifiedAssetIds,
              [Parameter(Mandatory = $true)][hashtable]$LocalAssets,
              [Parameter(Mandatory = $true)][bool]$IsPrerelease
            )

            if ($null -eq $ReleaseSnapshot -or [long]$ReleaseSnapshot.id -ne $ReleaseId) {
              throw "Published V26 release identity mismatch during acknowledgement reconciliation."
            }
            if (-not [string]::Equals([string]$ReleaseSnapshot.url, $ReleaseUri, [StringComparison]::Ordinal)) {
              throw "Published V26 release repository identity mismatch during acknowledgement reconciliation."
            }
            if ($ReleaseSnapshot.draft -ne $false) {
              throw "Published V26 release reconciliation expected draft=false."
            }
            if (-not [string]::Equals([string]$ReleaseSnapshot.tag_name, $env:RELEASE_TAG, [StringComparison]::Ordinal)) {
              throw "Published V26 release tag mismatch during acknowledgement reconciliation."
            }
            if (-not [string]::Equals([string]$ReleaseSnapshot.target_commitish, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Published V26 release target SHA mismatch during acknowledgement reconciliation."
            }
            if ([bool]$ReleaseSnapshot.prerelease -ne $IsPrerelease) {
              throw "Published V26 release prerelease-state mismatch during acknowledgement reconciliation."
            }

            Assert-RemoteReleaseTagTargetsWorkflowSha

            if (@($ReleaseSnapshot.assets).Count -ne $ExpectedAssets.Count) {
              throw "Published V26 release asset count mismatch during acknowledgement reconciliation."
            }
            if ($VerifiedAssetIds.Count -ne $ExpectedAssets.Count) {
              throw "Verified V26 release asset identity set is incomplete; refusing acknowledgement recovery."
            }
            foreach ($expectedAsset in $ExpectedAssets) {
              $matches = @($ReleaseSnapshot.assets | Where-Object { [string]$_.name -ceq $expectedAsset })
              if ($matches.Count -ne 1) {
                throw "Published V26 release asset identity is ambiguous for $expectedAsset."
              }
              if (-not $VerifiedAssetIds.ContainsKey($expectedAsset) -or -not $LocalAssets.ContainsKey($expectedAsset)) {
                throw "Verified V26 release asset identity mapping is missing for $expectedAsset."
              }
              $publishedAsset = $matches[0]
              $expectedAssetId = [long]$VerifiedAssetIds[$expectedAsset]
              if ($expectedAssetId -le 0 -or [long]$publishedAsset.id -ne $expectedAssetId) {
                throw "Verified V26 release asset identity mismatch for $expectedAsset."
              }
              $localLength = [int64](Get-Item -LiteralPath ([string]$LocalAssets[$expectedAsset])).Length
              if ([int64]$publishedAsset.size -ne $localLength) {
                throw "Published V26 release asset size mismatch for $expectedAsset during acknowledgement reconciliation."
              }
            }
          }

          $isPrerelease = $env:V26_RELEASE_REQUEST_PRERELEASE -eq 'true'
          $signPackage = $env:V26_RELEASE_REQUEST_SIGN_PACKAGE -eq 'true'
          $runtimeState = if ($env:RELEASE_RUN_RUNTIME -eq 'true') {
            if ($signPackage) { 'passed required V26 runtime gate on the exact signed release payload' }
            else { 'passed V26 runtime gate on the unsigned prerelease payload' }
          } else { 'runtime skipped only for explicit prerelease preview' }
          $signingState = if ($signPackage) { 'Authenticode-signed/timestamped with V26-only update manifest' } else { 'unsigned prerelease; manual install only' }
          $request = @{
            tag_name = $env:RELEASE_TAG
            target_commitish = $env:GITHUB_SHA
            name = "QS3D for BricsCAD V26 $env:RELEASE_TAG"
            body = "Owner-dispatched V26 release. Source/Core/V26 build gates completed. Runtime: $runtimeState. Package: $signingState. V25 assets are not accepted by this lane."
            draft = $true
            prerelease = $isPrerelease
            generate_release_notes = $true
          } | ConvertTo-Json

          $tagCreatedByThisRun = $false
          $tagReadyForRelease = $false
          $releaseId = [long]0
          $release = $null
          $releaseUri = $null
          $expectedAssets = @()
          $localAssets = @{}
          $verifiedAssetIds = @{}
          $publishPatchAttempted = $false

          try {
            $tagRefUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/refs"
            $existingTag = Get-ExactReusableReleaseTag
            if ($null -ne $existingTag) {
              Write-Host "Reusing exact V26 lightweight tag $env:RELEASE_TAG at workflow SHA without claiming deletion ownership."
              $tagReadyForRelease = $true
            }
            else {
              $tagCreateRequest = @{ ref = $tagRef; sha = $env:GITHUB_SHA } | ConvertTo-Json
              try {
                $createdTag = Invoke-RestMethod -Method Post -Uri $tagRefUri -Headers $headers -ContentType 'application/json' -Body $tagCreateRequest
                if ($null -eq $createdTag -or -not [string]::Equals([string]$createdTag.ref, $tagRef, [StringComparison]::Ordinal)) {
                  throw "V26 release tag creation returned a mismatched ref; refusing transaction ownership."
                }
                if ($null -eq $createdTag.object -or -not [string]::Equals([string]$createdTag.object.type, 'commit', [StringComparison]::Ordinal) -or -not [string]::Equals([string]$createdTag.object.sha, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "V26 release tag creation returned a non-commit or mismatched SHA; refusing transaction ownership."
                }
                $tagCreatedByThisRun = $true
                $tagReadyForRelease = $true
              }
              catch {
                $tagCreateError = $_
                $reconciledTag = Get-ExactReusableReleaseTag
                if ($null -eq $reconciledTag) {
                  throw "V26 tag-create acknowledgement failed and the exact release tag is authoritatively absent. Original error: $($tagCreateError.Exception.Message)"
                }
                Write-Host "V26 tag-create acknowledgement was ambiguous, but the exact lightweight tag now exists at workflow SHA; reusing it without deletion ownership."
                $tagCreatedByThisRun = $false
                $tagReadyForRelease = $true
              }
            }
            Assert-RemoteReleaseTagTargetsWorkflowSha

            $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers -ContentType 'application/json' -Body $request
            if ($null -eq $release -or [long]$release.id -le 0) {
              throw "V26 draft creation returned no usable release identity."
            }
            $releaseId = [long]$release.id
            if ($release.draft -ne $true) {
              throw "Newly-created V26 release was not a draft; refusing publication transaction."
            }
            if (-not [string]::Equals([string]$release.tag_name, $env:RELEASE_TAG, [StringComparison]::Ordinal)) {
              throw "Newly-created V26 draft tag identity mismatch; refusing publication transaction."
            }

            Assert-RemoteReleaseTagTargetsWorkflowSha

            $releaseAssets = @('dist\QS3D-BricsCAD-V26.zip', 'dist\QS3D-BricsCAD-V26.zip.sha256')
            if ($signPackage) { $releaseAssets += 'dist\QS3D-BricsCAD-V26.update.json' }
            $uploadBase = $release.upload_url -replace '\{\?name,label\}$', ''
            foreach ($assetPath in $releaseAssets) {
              $asset = (Resolve-Path -LiteralPath $assetPath).Path
              $name = [IO.Path]::GetFileName($asset)
              if ($name -match 'V25') { throw "V25 release asset leaked into V26 publication: $name" }
              if ($localAssets.ContainsKey($name)) { throw "Duplicate local V26 release asset name: $name" }
              $localAssets[$name] = $asset
              $contentType = if ($name.EndsWith('.zip')) { 'application/zip' } elseif ($name.EndsWith('.json')) { 'application/json' } else { 'text/plain' }
              Invoke-RestMethod -Method Post -Uri ($uploadBase + '?name=' + [Uri]::EscapeDataString($name)) -Headers $headers -ContentType $contentType -InFile $asset | Out-Null
            }

            $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId"
            $draftRelease = Invoke-RestMethod -Method Get -Uri $releaseUri -Headers $headers
            $expectedAssets = @('QS3D-BricsCAD-V26.zip', 'QS3D-BricsCAD-V26.zip.sha256')
            if ($signPackage) { $expectedAssets += 'QS3D-BricsCAD-V26.update.json' }
            if (@($draftRelease.assets).Count -ne $expectedAssets.Count) {
              throw "Draft V26 release contains unexpected assets; refusing publication."
            }

            $assetDownloadHeaders = @{}
            foreach ($key in $headers.Keys) { $assetDownloadHeaders[$key] = $headers[$key] }
            $assetDownloadHeaders['Accept'] = 'application/octet-stream'
            $verificationWorkspace = & .\scripts\v26-release-verification-workspace.ps1 -Operation Create -TempRoot $env:RUNNER_TEMP
            try {
              foreach ($expectedAsset in $expectedAssets) {
                $matches = @($draftRelease.assets | Where-Object { [string]$_.name -ceq $expectedAsset })
                if ($matches.Count -ne 1) {
                  throw "Expected exactly one V26 release asset named $expectedAsset; found $($matches.Count). Release remains a draft."
                }
                if (-not $localAssets.ContainsKey($expectedAsset)) {
                  throw "Local V26 release asset mapping is missing for $expectedAsset. Release remains a draft."
                }

                $uploadedAsset = $matches[0]
                $uploadedAssetId = [long]$uploadedAsset.id
                if ($uploadedAssetId -le 0) {
                  throw "Uploaded V26 release asset returned no usable identity for $expectedAsset. Release remains a draft."
                }
                $localAsset = [string]$localAssets[$expectedAsset]
                $localLength = [int64](Get-Item -LiteralPath $localAsset).Length
                $remoteLength = [int64]$uploadedAsset.size
                if ($remoteLength -ne $localLength) {
                  throw "Uploaded V26 release asset size mismatch for $expectedAsset. Local=$localLength Remote=$remoteLength. Release remains a draft."
                }

                $childName = 'asset-' + [Guid]::NewGuid().ToString('N')
                $downloadedAsset = & .\scripts\v26-release-verification-workspace.ps1 -Operation Child -Workspace $verificationWorkspace -ChildName $childName
                Invoke-WebRequest `
                  -Method Get `
                  -Uri ([string]$uploadedAsset.url) `
                  -Headers $assetDownloadHeaders `
                  -OutFile $downloadedAsset `
                  -UseBasicParsing
                $localHash = (& .\scripts\verify-v26-held-file.ps1 -Operation Hash -Path $localAsset).Trim()
                $remoteHash = (& .\scripts\verify-v26-held-file.ps1 -Operation Hash -Path $downloadedAsset).Trim()
                if (-not [string]::Equals($localHash, $remoteHash, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Uploaded V26 release asset SHA-256 mismatch for $expectedAsset. Release remains a draft."
                }
                $verifiedAssetIds[$expectedAsset] = $uploadedAssetId
              }
            }
            finally {
              if (-not [string]::IsNullOrWhiteSpace($verificationWorkspace)) {
                & .\scripts\v26-release-verification-workspace.ps1 -Operation Cleanup -Workspace $verificationWorkspace
              }
            }

            Assert-RemoteReleaseTagTargetsWorkflowSha

            $publishPatchAttempted = $true
            $published = Invoke-RestMethod -Method Patch -Uri $releaseUri -Headers $headers -ContentType 'application/json' -Body (@{ draft = $false } | ConvertTo-Json)
            if ($published.draft -ne $false) { throw "V26 GitHub release remained a draft after publish request." }
          }
          catch {
            $publicationError = $_
            if (-not $tagReadyForRelease) {
              throw
            }

            if ($releaseId -gt 0) {
              try {
                $reconciledRelease = Invoke-RestMethod -Method Get -Uri $releaseUri -Headers $headers
                if ($reconciledRelease.draft -eq $false) {
                  if (-not $publishPatchAttempted) {
                    throw "V26 release became published before this workflow attempted the final publish PATCH."
                  }
                  Assert-PublishedReleaseMatchesVerifiedTransaction `
                    -ReleaseSnapshot $reconciledRelease `
                    -ReleaseUri $releaseUri `
                    -ReleaseId $releaseId `
                    -ExpectedAssets $expectedAssets `
                    -VerifiedAssetIds $verifiedAssetIds `
                    -LocalAssets $localAssets `
                    -IsPrerelease $isPrerelease
                  Write-Host "V26 publish acknowledgement was ambiguous, but authoritative release state confirms the exact qualified release is already published; treating publication as committed."
                  return
                }
                if ($reconciledRelease.draft -ne $true) {
                  throw "V26 release draft state is ambiguous during acknowledgement reconciliation."
                }
              }
              catch {
                $reconciliationError = $_
                throw "V26 publication acknowledgement reconciliation failed. Original publication error: $($publicationError.Exception.Message) Reconciliation error: $($reconciliationError.Exception.Message) Manual cleanup is required before retry."
              }
            }

            try {
              & .\scripts\rollback-v26-draft-release.ps1 `
                -Repository $env:GITHUB_REPOSITORY `
                -ReleaseId $releaseId `
                -ReleaseTag $env:RELEASE_TAG `
                -WorkflowSha $env:GITHUB_SHA `
                -TagCreatedByThisRun $tagCreatedByThisRun `
                -Token $env:GH_TOKEN | Out-Null
            }
            catch {
              $rollbackError = $_
              throw "Automatic V26 draft rollback failed. Original publication error: $($publicationError.Exception.Message) Rollback error: $($rollbackError.Exception.Message) Manual cleanup is required before retry."
            }

            throw "V26 publication failed after exact release-tag admission: $($publicationError.Exception.Message) Automatic rollback completed; retry with the same tag is safe."
          }
