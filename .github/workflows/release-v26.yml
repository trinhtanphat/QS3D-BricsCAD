name: QS3D Manual V26 Build & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      confirm_release:
        description: "Explicit publish confirmation"
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "RELEASE"
      run_runtime:
        description: "Run real BricsCAD V26 NETLOAD/runtime validation on the exact release plugin payload"
        required: true
        default: true
        type: boolean
      sign_package:
        description: "Authenticode-sign and timestamp the V26 release package (required for stable releases)"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Publish as GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qs3d-manual-v26-release
  cancel-in-progress: false

jobs:
  build_sign:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_release == 'RELEASE' }}
    runs-on: [self-hosted, windows, x64, bricscad-v26]
    permissions:
      contents: read
    env:
      BRICSCAD_V26_DIR: ${{ vars.BRICSCAD_V26_DIR }}
      BRICSCAD_V26_PROFILE: ${{ vars.BRICSCAD_V26_PROFILE }}
      QS3D_SIGNING_CERT_THUMBPRINT: ${{ vars.QS3D_SIGNING_CERT_THUMBPRINT }}
      QS3D_TIMESTAMP_SERVER: ${{ vars.QS3D_TIMESTAMP_SERVER }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_RUN_RUNTIME: ${{ inputs.run_runtime }}
      RELEASE_SIGN_PACKAGE: ${{ inputs.sign_package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"

      - name: Validate manual V26 release request
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "V26 releases must be dispatched from refs/heads/main. Current ref: $env:GITHUB_REF"
          }
          if ($env:RELEASE_TAG -notmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw 'release_tag must be strict SemVer prefixed with v.'
          }
          $head = ([string](git rev-parse --verify HEAD)).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA.ToLowerInvariant()) {
            throw 'Checked-out V26 release HEAD does not match the workflow SHA.'
          }
          if (git tag --list $env:RELEASE_TAG) { throw "Tag already exists locally: $env:RELEASE_TAG" }

          $isPrerelease = $env:RELEASE_PRERELEASE -eq 'true'
          $hasPrereleaseSuffix = $env:RELEASE_TAG -match '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)-'
          if ($isPrerelease -ne $hasPrereleaseSuffix) { throw 'prerelease input must match whether release_tag contains a SemVer prerelease suffix.' }
          $runRuntime = $env:RELEASE_RUN_RUNTIME -eq 'true'
          $signPackage = $env:RELEASE_SIGN_PACKAGE -eq 'true'
          if (-not $isPrerelease -and -not $runRuntime) { throw 'Stable V26 release requires run_runtime=true.' }
          if (-not $isPrerelease -and -not $signPackage) { throw 'Stable V26 release requires sign_package=true.' }
          if ($signPackage) {
            if ($env:QS3D_SIGNING_CERT_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') { throw 'QS3D_SIGNING_CERT_THUMBPRINT must be a 40-hex Authenticode thumbprint.' }
            $timestamp = $null
            if (-not [Uri]::TryCreate($env:QS3D_TIMESTAMP_SERVER, [UriKind]::Absolute, [ref]$timestamp) -or $timestamp.Scheme -ne 'https') {
              throw 'QS3D_TIMESTAMP_SERVER must be an absolute HTTPS URL.'
            }
          }

      - name: Manual-only CI policy gate
        run: python scripts/preflight-ci-manual-only.py

      - name: Generic source guard
        run: python scripts/preflight.py

      - name: All discovered feature source guards
        run: python scripts/preflight-all.py

      - name: V26 host compatibility guard
        run: python scripts/preflight-bricscad-v26.py

      - name: V26 package/release isolation guard
        run: python scripts/preflight-v26-package-release.py

      - name: Build Core Release
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release

      - name: Deterministic Core smoke tests
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release

      - name: Validate BricsCAD V26 references and .NET 8 host
        shell: powershell
        run: |
          if (-not $env:BRICSCAD_V26_DIR) { throw 'BRICSCAD_V26_DIR repository variable is not set.' }
          foreach ($name in @('bricscad.exe', 'BrxMgd.dll', 'TD_Mgd.dll')) {
            $path = Join-Path $env:BRICSCAD_V26_DIR $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required BricsCAD V26 runtime file is missing: $name" }
          }
          $version = (Get-Item -LiteralPath (Join-Path $env:BRICSCAD_V26_DIR 'bricscad.exe')).VersionInfo
          if ($version.FileMajorPart -ne 26) { throw "BRICSCAD_V26_DIR is not V26. Detected $($version.FileVersion)." }
          if (@(dotnet --list-runtimes | Where-Object { $_ -match '^Microsoft\.WindowsDesktop\.App 8\.' }).Count -eq 0) {
            throw '.NET 8 Windows Desktop Runtime is required for the V26 managed host.'
          }

      - name: Build BricsCAD V26 plugin
        run: dotnet build src/QS3D.BricsCAD.V26/QS3D.BricsCAD.V26.csproj -c Release -p:Platform=x64

      - name: Real V26 runtime validation for unsigned prerelease payload
        if: ${{ inputs.run_runtime && !inputs.sign_package }}
        shell: powershell
        run: |
          $plugin = (Resolve-Path "src\QS3D.BricsCAD.V26\bin\x64\Release\net8.0-windows\QS3D.BricsCAD.V26.dll").Path
          & .\scripts\test-bricscad-v26-runtime.ps1 `
            -BricsCadDir $env:BRICSCAD_V26_DIR `
            -PluginDll $plugin `
            -Profile $env:BRICSCAD_V26_PROFILE `
            -ArtifactDir "$env:GITHUB_WORKSPACE\artifacts\bricscad-v26-runtime-unsigned"

      - name: Build V26 release package
        shell: powershell
        run: .\scripts\package-v26.ps1

      - name: Validate V26 release tag and package identity
        shell: powershell
        run: |
          $metadataPath = 'dist\QS3D-BricsCAD-V26\PACKAGE-METADATA.json'
          if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) { throw 'Missing V26 package metadata.' }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ([string]$metadata.product -ne 'QS3D' -or [string]$metadata.target -ne 'BricsCAD V26 x64') { throw 'V26 package product/target identity is invalid.' }
          if ([string]$metadata.framework -ne 'net8.0-windows') { throw 'V26 package framework identity is invalid.' }
          if (-not [string]::Equals(('v' + [string]$metadata.productVersion), $env:RELEASE_TAG, [StringComparison]::Ordinal)) {
            throw "Release tag $env:RELEASE_TAG does not exactly match V26 productVersion $($metadata.productVersion)."
          }
          if (-not [string]::Equals(([string]$metadata.gitCommit).Trim(), $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'V26 package source commit does not match workflow SHA.'
          }
          try { $packageVersion = [Version]::Parse([string]$metadata.version) }
          catch { throw "PACKAGE-METADATA version is invalid: $($metadata.version)" }
          $plugin = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path 'dist\QS3D-BricsCAD-V26\QS3D.BricsCAD.V26.dll')).Version
          $core = [Reflection.AssemblyName]::GetAssemblyName((Resolve-Path 'dist\QS3D-BricsCAD-V26\QS3D.Core.dll')).Version
          if ($plugin -ne $packageVersion -or $core -ne $packageVersion) { throw 'V26 package managed assembly identity mismatch.' }

      - name: Authenticode-sign V26 executable payload
        if: ${{ inputs.sign_package }}
        shell: powershell
        run: |
          $payload = @(
            'dist\QS3D-BricsCAD-V26\QS3D.BricsCAD.V26.dll',
            'dist\QS3D-BricsCAD-V26\QS3D.Core.dll',
            'dist\QS3D-BricsCAD-V26\install-v26-autoload.ps1',
            'dist\QS3D-BricsCAD-V26\uninstall-v26-autoload.ps1',
            'dist\QS3D-BricsCAD-V26\update-v26.ps1'
          )
          & .\scripts\sign-v26.ps1 -Path $payload -CertificateThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT -TimestampServer $env:QS3D_TIMESTAMP_SERVER -Confirm:$false

      - name: Verify V26 Authenticode publisher and timestamp
        if: ${{ inputs.sign_package }}
        shell: powershell
        run: |
          $payload = @(
            'dist\QS3D-BricsCAD-V26\QS3D.BricsCAD.V26.dll',
            'dist\QS3D-BricsCAD-V26\QS3D.Core.dll',
            'dist\QS3D-BricsCAD-V26\install-v26-autoload.ps1',
            'dist\QS3D-BricsCAD-V26\uninstall-v26-autoload.ps1',
            'dist\QS3D-BricsCAD-V26\update-v26.ps1'
          )
          & .\scripts\verify-v26-signatures.ps1 -Path $payload -ExpectedThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT

      - name: Finalize signed V26 package
        if: ${{ inputs.sign_package }}
        shell: powershell
        run: .\scripts\finalize-v26-signed-package.ps1 -ExpectedSignerThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT -Confirm:$false

      - name: Real V26 runtime validation for signed release payload
        if: ${{ inputs.run_runtime && inputs.sign_package }}
        shell: powershell
        run: |
          $plugin = (Resolve-Path 'dist\QS3D-BricsCAD-V26\QS3D.BricsCAD.V26.dll').Path
          & .\scripts\test-bricscad-v26-runtime.ps1 `
            -BricsCadDir $env:BRICSCAD_V26_DIR `
            -PluginDll $plugin `
            -Profile $env:BRICSCAD_V26_PROFILE `
            -ArtifactDir "$env:GITHUB_WORKSPACE\artifacts\bricscad-v26-runtime-signed"

      - name: Create signed V26 update manifest
        if: ${{ inputs.sign_package }}
        shell: powershell
        run: |
          $packageUri = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/QS3D-BricsCAD-V26.zip"
          & .\scripts\new-v26-update-manifest.ps1 `
            -PackageUri $packageUri `
            -ExpectedSignerThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT `
            -OutputPath 'dist\QS3D-BricsCAD-V26.update.json' `
            -Confirm:$false

      - name: Create V26 package checksum and provenance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Resolve-Path 'dist\QS3D-BricsCAD-V26.zip').Path
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$zipHash  QS3D-BricsCAD-V26.zip" | Set-Content 'dist\QS3D-BricsCAD-V26.zip.sha256' -Encoding ASCII
          $metadata = Get-Content -LiteralPath 'dist\QS3D-BricsCAD-V26\PACKAGE-METADATA.json' -Raw | ConvertFrom-Json
          $updateHash = $null
          if (Test-Path -LiteralPath 'dist\QS3D-BricsCAD-V26.update.json' -PathType Leaf) {
            $updateHash = (Get-FileHash -LiteralPath 'dist\QS3D-BricsCAD-V26.update.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          [ordered]@{
            schemaVersion = 1; product = 'QS3D'; target = 'BricsCAD V26 x64'; releaseTag = $env:RELEASE_TAG
            productVersion = [string]$metadata.productVersion; sourceCommit = $env:GITHUB_SHA.ToLowerInvariant()
            signed = ($env:RELEASE_SIGN_PACKAGE -eq 'true')
            signerThumbprint = if ($env:RELEASE_SIGN_PACKAGE -eq 'true') { $env:QS3D_SIGNING_CERT_THUMBPRINT.Replace(' ', '').ToUpperInvariant() } else { $null }
            packageFile = 'QS3D-BricsCAD-V26.zip'; packageSha256 = $zipHash
            updateManifestFile = if ($updateHash) { 'QS3D-BricsCAD-V26.update.json' } else { $null }
            updateManifestSha256 = $updateHash
          } | ConvertTo-Json -Depth 4 | Set-Content 'dist\QS3D-BricsCAD-V26.provenance.json' -Encoding UTF8

      - name: Upload V26 qualified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: QS3D-BricsCAD-V26-candidate-${{ inputs.release_tag }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/QS3D-BricsCAD-V26.zip
            dist/QS3D-BricsCAD-V26.zip.sha256
            dist/QS3D-BricsCAD-V26.update.json
            dist/QS3D-BricsCAD-V26.provenance.json
            artifacts/bricscad-v26-runtime-unsigned/
            artifacts/bricscad-v26-runtime-signed/

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_release == 'RELEASE' }}
    needs: build_sign
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_RUN_RUNTIME: ${{ inputs.run_runtime }}
      RELEASE_SIGN_PACKAGE: ${{ inputs.sign_package }}
      QS3D_SIGNING_CERT_THUMBPRINT: ${{ vars.QS3D_SIGNING_CERT_THUMBPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: QS3D-BricsCAD-V26-candidate-${{ inputs.release_tag }}-${{ github.sha }}
          path: v26-candidate

      - name: Verify V26 candidate after job boundary
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = (Resolve-Path 'v26-candidate\dist').Path
          $zip = Join-Path $dist 'QS3D-BricsCAD-V26.zip'
          $checksum = Join-Path $dist 'QS3D-BricsCAD-V26.zip.sha256'
          $provenancePath = Join-Path $dist 'QS3D-BricsCAD-V26.provenance.json'
          foreach ($path in @($zip, $checksum, $provenancePath)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing V26 candidate asset: $path" }
          }
          $checksumText = (Get-Content -LiteralPath $checksum -Raw).Trim()
          if ($checksumText -notmatch '^([0-9a-f]{64})  QS3D-BricsCAD-V26\.zip$') { throw 'V26 checksum file is malformed.' }
          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne $Matches[1]) { throw 'V26 ZIP checksum mismatch after job boundary.' }
          $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
          if ([int]$provenance.schemaVersion -ne 1 -or [string]$provenance.product -ne 'QS3D' -or [string]$provenance.target -ne 'BricsCAD V26 x64' -or
              -not [string]::Equals([string]$provenance.releaseTag, $env:RELEASE_TAG, [StringComparison]::Ordinal) -or
              -not [string]::Equals([string]$provenance.productVersion, $env:RELEASE_TAG.Substring(1), [StringComparison]::Ordinal) -or
              -not [string]::Equals([string]$provenance.sourceCommit, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase) -or
              -not [string]::Equals([string]$provenance.packageSha256, $zipHash, [StringComparison]::OrdinalIgnoreCase) -or
              [bool]$provenance.signed -ne ($env:RELEASE_SIGN_PACKAGE -eq 'true')) {
            throw 'V26 candidate provenance does not exactly bind tag, product, source, signing state and ZIP digest.'
          }
          $update = Join-Path $dist 'QS3D-BricsCAD-V26.update.json'
          if ($env:RELEASE_SIGN_PACKAGE -eq 'true') {
            if (-not (Test-Path -LiteralPath $update -PathType Leaf)) { throw 'Signed V26 candidate is missing update manifest.' }
            $updateHash = (Get-FileHash -LiteralPath $update -Algorithm SHA256).Hash.ToLowerInvariant()
            if (-not [string]::Equals([string]$provenance.updateManifestSha256, $updateHash, [StringComparison]::OrdinalIgnoreCase)) { throw 'V26 update manifest digest mismatch.' }
          } elseif (Test-Path -LiteralPath $update -PathType Leaf) {
            throw 'Unsigned V26 prerelease candidate must not carry a signed update manifest.'
          }
          $extract = Join-Path $env:RUNNER_TEMP ('qs3d-v26-publish-' + [Guid]::NewGuid().ToString('N'))
          try {
            Expand-Archive -LiteralPath $zip -DestinationPath $extract
            $metadata = Get-Content -LiteralPath (Join-Path $extract 'PACKAGE-METADATA.json') -Raw | ConvertFrom-Json
            if (-not [string]::Equals(('v' + [string]$metadata.productVersion), $env:RELEASE_TAG, [StringComparison]::Ordinal) -or
                -not [string]::Equals(([string]$metadata.gitCommit).Trim(), $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Packaged V26 metadata lost exact tag/source binding.'
            }
            if ($env:RELEASE_SIGN_PACKAGE -eq 'true') {
              $payload = @(
                (Join-Path $extract 'QS3D.BricsCAD.V26.dll'), (Join-Path $extract 'QS3D.Core.dll'),
                (Join-Path $extract 'install-v26-autoload.ps1'), (Join-Path $extract 'uninstall-v26-autoload.ps1'),
                (Join-Path $extract 'update-v26.ps1')
              )
              & .\scripts\verify-v26-signatures.ps1 -Path $payload -ExpectedThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT
            }
          }
          finally { Remove-Item -LiteralPath $extract -Recurse -Force -ErrorAction SilentlyContinue }

      - name: Create draft, verify uploaded V26 bytes, then publish
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = (Resolve-Path 'v26-candidate\dist').Path
          $assetNames = @('QS3D-BricsCAD-V26.zip', 'QS3D-BricsCAD-V26.zip.sha256', 'QS3D-BricsCAD-V26.provenance.json')
          if ($env:RELEASE_SIGN_PACKAGE -eq 'true') { $assetNames += 'QS3D-BricsCAD-V26.update.json' }
          $assets = @($assetNames | ForEach-Object { Join-Path $dist $_ })
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $existing = @(git ls-remote --tags origin $tagRef ($tagRef + '^{}'))
          if ($LASTEXITCODE -ne 0) { throw 'Failed to query remote V26 tag state.' }
          if ($existing.Count -gt 0) { throw "Remote V26 release tag already exists: $env:RELEASE_TAG" }

          $runtimeState = if ($env:RELEASE_RUN_RUNTIME -eq 'true') { 'licensed V26 runtime gate passed on the qualified payload' } else { 'runtime skipped only for explicit prerelease preview' }
          $signingState = if ($env:RELEASE_SIGN_PACKAGE -eq 'true') { 'Authenticode-signed/timestamped with V26-only update manifest' } else { 'unsigned prerelease; manual install only' }
          $createArgs = @('release', 'create', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA, '--title', "QS3D for BricsCAD V26 $env:RELEASE_TAG", '--notes', "Owner-dispatched V26 release. Source/Core/V26 gates completed. Runtime: $runtimeState. Package: $signingState. V25 assets are not accepted by this lane.", '--draft')
          if ($env:RELEASE_PRERELEASE -eq 'true') { $createArgs += '--prerelease' }
          $createArgs += $assets
          & gh @createArgs
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft V26 release.' }

          $remoteLines = @(git ls-remote --tags origin $tagRef ($tagRef + '^{}'))
          if ($LASTEXITCODE -ne 0) { throw 'Failed to resolve newly created V26 release tag; release remains a draft.' }
          $resolved = @()
          foreach ($line in $remoteLines) {
            if ($line -notmatch '^([0-9a-fA-F]{40})\s+(.+)$') { throw 'Malformed remote V26 tag response; release remains a draft.' }
            if ($Matches[2] -eq ($tagRef + '^{}')) { $resolved = @($Matches[1]); break }
            if ($Matches[2] -eq $tagRef) { $resolved += $Matches[1] }
          }
          if ($resolved.Count -ne 1 -or -not [string]::Equals($resolved[0], $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'V26 release tag does not target exact qualified workflow SHA; release remains a draft.'
          }

          $downloadRoot = Join-Path $env:RUNNER_TEMP ('qs3d-v26-draft-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
          try {
            & gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $downloadRoot
            if ($LASTEXITCODE -ne 0) { throw 'Failed to download draft V26 release assets for verification.' }
            $downloadedNames = @(Get-ChildItem -LiteralPath $downloadRoot -File | ForEach-Object Name | Sort-Object)
            $expectedNames = @($assetNames | Sort-Object)
            if (($downloadedNames -join "`n") -cne ($expectedNames -join "`n")) { throw 'Draft V26 release asset set mismatch.' }
            foreach ($name in $assetNames) {
              $localHash = (Get-FileHash -LiteralPath (Join-Path $dist $name) -Algorithm SHA256).Hash
              $remoteHash = (Get-FileHash -LiteralPath (Join-Path $downloadRoot $name) -Algorithm SHA256).Hash
              if (-not [string]::Equals($localHash, $remoteHash, [StringComparison]::OrdinalIgnoreCase)) { throw "Draft V26 release asset SHA-256 mismatch for $name; release remains a draft." }
            }
            $remoteChecksum = (Get-Content -LiteralPath (Join-Path $downloadRoot 'QS3D-BricsCAD-V26.zip.sha256') -Raw).Trim()
            if ($remoteChecksum -notmatch '^([0-9a-f]{64})  QS3D-BricsCAD-V26\.zip$') { throw 'Downloaded V26 draft checksum is malformed.' }
            if ((Get-FileHash -LiteralPath (Join-Path $downloadRoot 'QS3D-BricsCAD-V26.zip') -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches[1]) { throw 'Downloaded V26 draft ZIP fails its SHA-256 checksum.' }
          }
          finally { Remove-Item -LiteralPath $downloadRoot -Recurse -Force -ErrorAction SilentlyContinue }

          & gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Draft V26 verification passed but publication failed.' }
          $published = (& gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq '.isDraft').Trim()
          if ($LASTEXITCODE -ne 0 -or $published -ne 'false') { throw 'V26 GitHub release remained a draft after publication request.' }
