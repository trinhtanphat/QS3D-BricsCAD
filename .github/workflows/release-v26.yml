name: QS3D Manual V26 Build & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string
      confirm_release:
        description: "Explicit publish confirmation"
        required: true
        default: "NO"
        type: choice
        options:
          - "NO"
          - "RELEASE"
      run_runtime:
        description: "Run real BricsCAD V26 NETLOAD/runtime validation on the exact release plugin payload"
        required: true
        default: true
        type: boolean
      sign_package:
        description: "Authenticode-sign and timestamp the V26 release package (required for stable releases)"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Publish as GitHub prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qs3d-manual-v26-release
  cancel-in-progress: false

jobs:
  qualify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_release == 'RELEASE' }}
    runs-on: [self-hosted, windows, x64, bricscad-v26]
    permissions:
      contents: read
    env:
      BRICSCAD_V26_DIR: ${{ vars.BRICSCAD_V26_DIR }}
      BRICSCAD_V26_PROFILE: ${{ vars.BRICSCAD_V26_PROFILE }}
      QS3D_SIGNING_CERT_THUMBPRINT: ${{ vars.QS3D_SIGNING_CERT_THUMBPRINT }}
      QS3D_TIMESTAMP_SERVER: ${{ vars.QS3D_TIMESTAMP_SERVER }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_RUN_RUNTIME: ${{ inputs.run_runtime }}
      RELEASE_SIGN_PACKAGE: ${{ inputs.sign_package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"

      - name: Bind V26 host-reference state path
        shell: powershell
        run: |
          $statePath = Join-Path $env:RUNNER_TEMP "qs3d-v26-host-reference-state.json"
          "V26_HOST_REFERENCE_STATE=$statePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate manual V26 release request
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
            throw "V26 releases must be dispatched from refs/heads/main. Current ref: $env:GITHUB_REF"
          }
          # Shared validator preserves the stable contracts: Stable V26 release requires run_runtime=true.
          # Shared validator preserves the stable contracts: Stable V26 release requires sign_package=true.
          $releaseRequest = & .\scripts\assert-v26-release-request.ps1 `
            -ReleaseTag $env:RELEASE_TAG `
            -Prerelease:($env:RELEASE_PRERELEASE -eq 'true') `
            -RunRuntime:($env:RELEASE_RUN_RUNTIME -eq 'true') `
            -SignPackage:($env:RELEASE_SIGN_PACKAGE -eq 'true')
          if ($null -eq $releaseRequest) {
            throw 'Strict V26 release request validation did not return a parsed request.'
          }

          $head = ([string](git rev-parse --verify HEAD)).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA.ToLowerInvariant()) {
            throw 'Checked-out V26 qualification HEAD does not match the workflow SHA.'
          }
          $localTag = @(git tag --list --format='%(objecttype) %(objectname)' $env:RELEASE_TAG)
          if ($LASTEXITCODE -ne 0 -or $localTag.Count -gt 1) { throw "Unable to classify local V26 tag identity for $env:RELEASE_TAG." }
          if ($localTag.Count -eq 1) {
            $expectedLocal = "commit $($env:GITHUB_SHA.ToLowerInvariant())"
            if (-not [string]::Equals(([string]$localTag[0]).Trim().ToLowerInvariant(), $expectedLocal, [StringComparison]::Ordinal)) {
              throw "Existing local V26 release tag $env:RELEASE_TAG is not an exact lightweight tag at workflow SHA $env:GITHUB_SHA."
            }
          }

          if ([bool]$releaseRequest.SignPackage) {
            if ($env:QS3D_SIGNING_CERT_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
              throw "QS3D_SIGNING_CERT_THUMBPRINT must be a 40-hex Authenticode thumbprint."
            }
            $timestamp = $null
            if (-not [Uri]::TryCreate($env:QS3D_TIMESTAMP_SERVER, [UriKind]::Absolute, [ref]$timestamp) -or $timestamp.Scheme -ne 'https') {
              throw "QS3D_TIMESTAMP_SERVER must be an absolute HTTPS URL."
            }
          }

      - name: Manual-only CI policy gate
        run: python scripts/preflight-ci-manual-only.py

      - name: Generic source guard
        run: python scripts/preflight.py

      - name: All discovered feature source guards
        run: python scripts/preflight-all.py

      - name: V26 host compatibility guard
        run: python scripts/preflight-bricscad-v26.py

      - name: V26 package/release isolation guard
        run: python scripts/preflight-v26-package-release.py

      - name: Build Core Release
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release

      - name: Deterministic Core smoke tests
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release

      - name: Validate BricsCAD V26 references and .NET 8 host
        shell: powershell
        run: |
          & .\scripts\assert-v26-host-reference-safety.ps1 -BricsCadDir $env:BRICSCAD_V26_DIR -StatePath $env:V26_HOST_REFERENCE_STATE | Out-Null
          if (@(dotnet --list-runtimes | Where-Object { $_ -match '^Microsoft\.WindowsDesktop\.App 8\.' }).Count -eq 0) {
            throw ".NET 8 Windows Desktop Runtime is required for the V26 managed host."
          }

      - name: Build BricsCAD V26 plugin against held reference generations
        shell: powershell
        run: |
          & .\scripts\build-v26-with-stable-references.ps1 `
            -BricsCadDir $env:BRICSCAD_V26_DIR `
            -StatePath $env:V26_HOST_REFERENCE_STATE `
            -ProjectPath 'src\QS3D.BricsCAD.V26\QS3D.BricsCAD.V26.csproj' `
            -Configuration Release `
            -Platform x64

      - name: Real V26 runtime validation for unsigned prerelease payload
        if: ${{ inputs.run_runtime && !inputs.sign_package }}
        shell: powershell
        run: |
          & .\scripts\assert-v26-host-reference-safety.ps1 -BricsCadDir $env:BRICSCAD_V26_DIR -VerifyStatePath $env:V26_HOST_REFERENCE_STATE | Out-Null
          $plugin = (Resolve-Path "src\QS3D.BricsCAD.V26\bin\x64\Release\net8.0-windows\QS3D.BricsCAD.V26.dll").Path
          & .\scripts\test-bricscad-v26-runtime.ps1 `
            -BricsCadDir $env:BRICSCAD_V26_DIR `
            -PluginDll $plugin `
            -Profile $env:BRICSCAD_V26_PROFILE `
            -ArtifactDir "$env:GITHUB_WORKSPACE\artifacts\bricscad-v26-runtime-unsigned"

      - name: Build V26 release package
        shell: powershell
        run: .\scripts\package-v26.ps1

      - name: Validate V26 release tag and package identity
        shell: powershell
        run: |
          & .\scripts\assert-v26-release-package-identity.ps1 `
            -MetadataPath 'dist\QS3D-BricsCAD-V26\PACKAGE-METADATA.json' `
            -PluginPath 'dist\QS3D-BricsCAD-V26\QS3D.BricsCAD.V26.dll' `
            -CorePath 'dist\QS3D-BricsCAD-V26\QS3D.Core.dll' `
            -ReleaseTag $env:RELEASE_TAG | Out-Null

      - name: Authenticode-sign V26 executable payload
        if: ${{ inputs.sign_package }}
        shell: powershell
        run: |
          $payload = @(
            'dist\QS3D-BricsCAD-V26\QS3D.BricsCAD.V26.dll',
            'dist\QS3D-BricsCAD-V26\QS3D.Core.dll',
            'dist\QS3D-BricsCAD-V26\install-v26-autoload.ps1',
            'dist\QS3D-BricsCAD-V26\uninstall-v26-autoload.ps1',
            'dist\QS3D-BricsCAD-V26\update-v26.ps1'
          )
          & .\scripts\sign-v26.ps1 -Path $payload -CertificateThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT -TimestampServer $env:QS3D_TIMESTAMP_SERVER -Confirm:$false

      - name: Verify V26 Authenticode publisher and timestamp
        if: ${{ inputs.sign_package }}
        shell: powershell
        run: |
          $payload = @(
            'dist\QS3D-BricsCAD-V26\QS3D.BricsCAD.V26.dll',
            'dist\QS3D-BricsCAD-V26\QS3D.Core.dll',
            'dist\QS3D-BricsCAD-V26\install-v26-autoload.ps1',
            'dist\QS3D-BricsCAD-V26\uninstall-v26-autoload.ps1',
            'dist\QS3D-BricsCAD-V26\update-v26.ps1'
          )
          & .\scripts\verify-v26-signatures.ps1 -Path $payload -ExpectedThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT

      - name: Finalize signed V26 package
        if: ${{ inputs.sign_package }}
        shell: powershell
        run: .\scripts\finalize-v26-signed-package.ps1 -ExpectedSignerThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT -Confirm:$false

      - name: Real V26 runtime validation for signed release payload
        if: ${{ inputs.run_runtime && inputs.sign_package }}
        shell: powershell
        run: |
          & .\scripts\assert-v26-host-reference-safety.ps1 -BricsCadDir $env:BRICSCAD_V26_DIR -VerifyStatePath $env:V26_HOST_REFERENCE_STATE | Out-Null
          $plugin = (Resolve-Path "dist\QS3D-BricsCAD-V26\QS3D.BricsCAD.V26.dll").Path
          & .\scripts\test-bricscad-v26-runtime.ps1 `
            -BricsCadDir $env:BRICSCAD_V26_DIR `
            -PluginDll $plugin `
            -Profile $env:BRICSCAD_V26_PROFILE `
            -ArtifactDir "$env:GITHUB_WORKSPACE\artifacts\bricscad-v26-runtime-signed"

      - name: Create signed V26 update manifest
        if: ${{ inputs.sign_package }}
        shell: powershell
        run: |
          $packageUri = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/QS3D-BricsCAD-V26.zip"
          & .\scripts\new-v26-update-manifest.ps1 `
            -PackageUri $packageUri `
            -ExpectedSignerThumbprint $env:QS3D_SIGNING_CERT_THUMBPRINT `
            -OutputPath "dist\QS3D-BricsCAD-V26.update.json" `
            -Confirm:$false

      - name: Create V26 package checksum
        shell: powershell
        run: |
          & .\scripts\write-v26-package-checksum.ps1 `
            -PackagePath 'dist\QS3D-BricsCAD-V26.zip' `
            -OutputPath 'dist\QS3D-BricsCAD-V26.zip.sha256' | Out-Null

      - name: Create V26 candidate provenance
        shell: powershell
        run: |
          & .\scripts\new-v26-candidate-provenance.ps1 `
            -PackageZip 'dist\QS3D-BricsCAD-V26.zip' `
            -ReleaseTag $env:RELEASE_TAG `
            -SourceCommit $env:GITHUB_SHA `
            -OutputPath 'dist\QS3D-BricsCAD-V26.provenance.json' | Out-Null

      - name: Upload V26 qualification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: QS3D-BricsCAD-V26-${{ inputs.release_tag }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/QS3D-BricsCAD-V26.zip
            dist/QS3D-BricsCAD-V26.zip.sha256
            dist/QS3D-BricsCAD-V26.update.json
            dist/QS3D-BricsCAD-V26.provenance.json
            artifacts/bricscad-v26-runtime-unsigned/
            artifacts/bricscad-v26-runtime-signed/

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_release == 'RELEASE' }}
    needs: qualify
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_RUN_RUNTIME: ${{ inputs.run_runtime }}
      V26_RELEASE_REQUEST_PRERELEASE: ${{ inputs.prerelease }}
      V26_RELEASE_REQUEST_SIGN_PACKAGE: ${{ inputs.sign_package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: QS3D-BricsCAD-V26-${{ inputs.release_tag }}-${{ github.sha }}
          path: .

      - name: Verify and publish held V26 candidate after job boundary
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = 'dist\QS3D-BricsCAD-V26.zip'
          $checksum = 'dist\QS3D-BricsCAD-V26.zip.sha256'
          $provenance = 'dist\QS3D-BricsCAD-V26.provenance.json'
          foreach ($path in @($zip, $checksum, $provenance)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing V26 qualified candidate asset: $path" }
          }
          if ($env:V26_RELEASE_REQUEST_SIGN_PACKAGE -eq 'true') {
            $updateManifest = 'dist\QS3D-BricsCAD-V26.update.json'
            if (-not (Test-Path -LiteralPath $updateManifest -PathType Leaf)) {
              throw 'Signed V26 qualification candidate is missing its update manifest.'
            }
            $candidateIdentity = & .\scripts\assert-v26-candidate-identity.ps1 `
              -PackageZip $zip `
              -ChecksumPath $checksum `
              -ProvenancePath $provenance `
              -UpdateManifestPath $updateManifest `
              -ExpectedSourceCommit $env:GITHUB_SHA `
              -ExpectedReleaseTag $env:RELEASE_TAG `
              -AdmittedScript '.\scripts\publish-v26-release.ps1'
          }
          else {
            if (Test-Path -LiteralPath 'dist\QS3D-BricsCAD-V26.update.json') {
              throw 'Unsigned V26 prerelease candidate unexpectedly contains a signed update manifest.'
            }
            $candidateIdentity = & .\scripts\assert-v26-candidate-identity.ps1 `
              -PackageZip $zip `
              -ChecksumPath $checksum `
              -ProvenancePath $provenance `
              -ExpectedSourceCommit $env:GITHUB_SHA `
              -ExpectedReleaseTag $env:RELEASE_TAG `
              -AdmittedScript '.\scripts\publish-v26-release.ps1'
          }
          if ($null -eq $candidateIdentity) { throw 'V26 candidate semantic admission/publication returned no identity.' }

          & .\scripts\publish-v26-release.ps1
