name: LOCAL-011 Inbox Transport

on:
  push:
    branches:
      - "agent/interactive-20260825-l011a7c9/issue-3905-local011-native-runner"

permissions:
  contents: read

jobs:
  export-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: local-011-inbox-source
          path: docs/LOCAL-AGENT-INBOX.md
          if-no-files-found: error
          retention-days: 1
