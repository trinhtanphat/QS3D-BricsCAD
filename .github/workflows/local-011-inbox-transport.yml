name: LOCAL-011 Inbox Transport

on:
  push:
    branches:
      - "agent/interactive-20260825-l011a7c9/issue-3905-local011-native-runner"

permissions:
  contents: write

jobs:
  patch-inbox:
    if: ${{ github.event.head_commit.message == 'chore(local): apply lossless LOCAL-011 inbox patch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply bounded LOCAL-011 handoff patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/LOCAL-AGENT-INBOX.md')
          s = p.read_text(encoding='utf-8')
          needle = '- Source-side status: REMOTE_DONE for Grid annotation exact-set replacement (`761b9b92f5dd3638b18d281c273a406e41069511`), Curtain LINE/PATH exact-set replacement (`ffd26294f3f27d03de1050643aa0aeb894dcb0f2`), the shared seven-family Rebar exact-set ownership guard (`1850f02382c8ccf71f04e3ea9daa28455aaae08f`), and the dedicated Column Tie exact-set guard follow-up (`b22eacd681230f231e0f970fb670e8f89769c35e`). Runtime qualification remains `PENDING_LOCAL`; remote/non-local agents must not re-run or re-claim this V25 proof unless the source scenario materially changes.\n'
          if s.count(needle) != 1:
              raise SystemExit('LOCAL-011 source-side anchor must occur exactly once')
          addition = (
              needle
              + '- Runner: `scripts/run-local-v25-local-011.ps1`\n'
              + '- Remote disposition: `REMOTE_DONE / PENDING_LOCAL / DO_NOT_RETRY_REMOTE`\n'
              + '- Local handoff: Repository-side engineering for this bounded handoff is complete. From a clean checkout of the newest intended exact SHA containing the four source-ready ancestors above, a compatible licensed V25 local agent should **pull/sync only and run one command**: `powershell -ExecutionPolicy Bypass -File .\\scripts\\run-local-v25-local-011.ps1`. The runner records `PASS`/`FAIL`/`BLOCKED`/`NO_RESULT` evidence and never claims `LOCAL_PASS`; any product failure returns to a normal source-fix lane.\n'
          )
          p.write_text(s.replace(needle, addition), encoding='utf-8', newline='')
          PY
          read -r added deleted changed_path <<< "$(git diff --numstat -- docs/LOCAL-AGENT-INBOX.md)"
          test "$added" = "3"
          test "$deleted" = "0"
          test "$changed_path" = "docs/LOCAL-AGENT-INBOX.md"
          git diff --check -- docs/LOCAL-AGENT-INBOX.md
          git diff -- docs/LOCAL-AGENT-INBOX.md
      - name: Commit bounded inbox handoff
        shell: bash
        run: |
          git config user.name "QS3D LOCAL-011 handoff"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LOCAL-AGENT-INBOX.md
          git commit -m "docs(local): wire LOCAL-011 pull-and-run handoff"
          git push origin "HEAD:${GITHUB_REF_NAME}"
