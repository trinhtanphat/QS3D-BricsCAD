name: Temporary local handoff schema repair

on:
  push:
    branches:
      - agent/chatgpt/issue-4093-land-terminal-evidence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Restore validator-required LOCAL handoff fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/LOCAL-AGENT-INBOX.md')
          text = path.read_text(encoding='utf-8')

          def get_section(heading, next_heading):
              global text
              start = text.index(heading)
              end = text.index(next_heading, start)
              return start, end, text[start:end]

          def set_section(heading, next_heading, section):
              global text
              start, end, _ = get_section(heading, next_heading)
              text = text[:start] + section + text[end:]

          def assert_missing(section, prefix):
              if any(line.startswith(prefix) for line in section.splitlines()):
                  raise SystemExit(f'{prefix} already present; refusing ambiguous repair')

          def insert_after_prefix(section, prefix, new_line):
              lines = section.splitlines()
              hits = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(hits) != 1:
                  raise SystemExit(f'expected one {prefix!r}, found {len(hits)}')
              lines.insert(hits[0] + 1, new_line)
              return '\n'.join(lines) + '\n'

          def insert_before_prefix(section, prefix, new_line):
              lines = section.splitlines()
              hits = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(hits) != 1:
                  raise SystemExit(f'expected one {prefix!r}, found {len(hits)}')
              lines.insert(hits[0], new_line)
              return '\n'.join(lines) + '\n'

          def rename_prefix(section, old_prefix, new_prefix):
              lines = section.splitlines()
              hits = [i for i, line in enumerate(lines) if line.startswith(old_prefix)]
              if len(hits) != 1:
                  raise SystemExit(f'expected one {old_prefix!r}, found {len(hits)}')
              i = hits[0]
              lines[i] = new_prefix + lines[i][len(old_prefix):]
              return '\n'.join(lines) + '\n'

          h21 = '## LOCAL-021 — Móng Bè workflow and Quantity Insight viewport highlight\n'
          h22 = '## LOCAL-022 — Móng đơn placement/edit/save-reopen on V25/V26\n'
          h20 = '## LOCAL-020 — Grid pair-owned intersection marker native lifecycle\n'
          h23 = '## LOCAL-023 — Beam formwork behavior matrix on preview.10228\n'
          hend = '## P1 — #3480 Quantity Review exact native BREP face highlight\n'

          _, _, s21 = get_section(h21, h22)
          assert_missing(s21, '- Why local:')
          assert_missing(s21, '- Related docs:')
          s21 = insert_after_prefix(s21, '- Area:', '- Why local: Final acceptance requires licensed BricsCAD V25 modeless Workspace interaction, native 3D/QTO state, live transient viewport highlighting and cleanup that hosted/static CI cannot reproduce or promote to `LOCAL_PASS`.')
          s21 = insert_before_prefix(s21, '- Updated:', '- Related docs: `docs/LOCAL-QUANTITY-REVIEW-CUBICOST-ACCEPTANCE.md`; issue #4041; issue #4127; PR #4129.')
          set_section(h21, h22, s21)

          _, _, s22 = get_section(h22, h20)
          assert_missing(s22, '- Why local:')
          assert_missing(s22, '- Related docs:')
          s22 = insert_after_prefix(s22, '- Area:', '- Why local: Final acceptance requires licensed interactive BricsCAD V25/V26 placement, native Foundation geometry, editing/regeneration, persistence and cold-reopen behavior that offline/static gates cannot prove.')
          s22 = insert_before_prefix(s22, '- Updated:', '- Related docs: `docs/agent-work-claims/2026-08-26-codex-issue4046-restore-single-footing-regression.md`; issue #4034; PR #4058.')
          set_section(h22, h20, s22)

          _, _, s20 = get_section(h20, h23)
          if '- Related docs:' in s20:
              raise SystemExit('LOCAL-020 canonical Related docs already present; refusing ambiguous repair')
          s20 = rename_prefix(s20, '- Related docs/source:', '- Related docs:')
          set_section(h20, h23, s20)

          _, _, s23 = get_section(h23, hend)
          assert_missing(s23, '- Why local:')
          assert_missing(s23, '- Scenario:')
          assert_missing(s23, '- Evidence required:')
          assert_missing(s23, '- Related docs:')
          s23 = insert_after_prefix(s23, '- Canonical runtime carrier:', '- Why local: The final gate required NETLOAD of the immutable released adapter plus live native BREP face classification, directed deductions and aggregate/detail projection inside licensed interactive BricsCAD V25; source/static evidence cannot establish this result.')
          s23 = rename_prefix(s23, '- Scenario exercised:', '- Scenario:')
          s23 = insert_after_prefix(s23, '- Evidence:', '- Evidence required: Exact pinned preview/source and packaged V25 DLL identity; BricsCAD V25 host identity; sanitized M1–M8 cell results; gross/net Side/Bottom values; Top/End/Other exclusions; aggregate/detail parity; verifier result; blocker and cleanup state.')
          s23 = insert_before_prefix(s23, '- Updated:', '- Related docs: `docs/LOCAL-V25-BEAM-FORMWORK-MATRIX.md`; `docs/evidence/2026-08-27-issue4093-preview10228-beam-matrix.json`; issue #4093; PR #4094.')
          set_section(h23, hend, s23)

          path.write_text(text, encoding='utf-8')
          PY
          python scripts/preflight-local-agent-handoff.py
          rm .github/workflows/temporary-local-handoff-schema-repair.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LOCAL-AGENT-INBOX.md .github/workflows/temporary-local-handoff-schema-repair.yml
          git diff --cached --quiet && { echo "No repair generated"; exit 1; }
          git commit -m "docs(local): restore handoff schema fields"
          git push origin HEAD:agent/chatgpt/issue-4093-land-terminal-evidence