name: QS3D Auto Room Promote Gate

on:
  push:
    branches:
      - ci/room-auto-promote-20260810

permissions:
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build exact source + current main merge tree
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/room-auto-lifecycle-integrated-20260810
          git checkout -B room-auto-promote origin/agent/room-auto-lifecycle-integrated-20260810
          git merge --no-ff --no-edit origin/main
      - name: Generic preflight
        run: python scripts/preflight.py
      - name: Full-domain and release preflight
        run: python scripts/preflight-full-domain.py
      - name: Auto-room lifecycle preflight
        run: python scripts/preflight-auto-room.py
      - name: Validate release PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in @('scripts/package-v25.ps1', 'scripts/install-v25-autoload.ps1', 'scripts/uninstall-v25-autoload.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw "PowerShell parse failure: $script" }
          }
      - name: Build core
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release
      - name: Run deterministic smoke tests
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release
      - name: Promote exact tested tree if main is unchanged
        shell: pwsh
        run: |
          git fetch origin main
          $testedBase = (git merge-base HEAD origin/main).Trim()
          $remoteMain = (git rev-parse origin/main).Trim()
          if ($testedBase -ne $remoteMain) {
            throw "main advanced after the tested merge tree was created; refusing promotion."
          }
          git push origin HEAD:main
