name: Issue 5457 one-shot transport patch

on:
  push:
    branches:
      - agent/gpt56sol-20260903-multi-transport-failover/issue-5457-multi-transport-failover

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[5457-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact source patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="")

          openai = "src/QS3D.BricsCAD.V25/McpOpenAiSecureTunnel.cs"
          cloudflare = "src/QS3D.BricsCAD.V25/McpCloudflareAccountOnboarding.cs"
          supervisor = "src/QS3D.BricsCAD.V25/McpTransportSupervisor.cs"

          replace_once(openai,
          '''        public static void TryAutoStartPreferred()\n        {\n            switch (SelectedProvider)\n            {\n                case McpTransportProvider.CloudflareNamedTunnel:\n                    McpCloudflareAccountTunnelManager.TryAutoStart();\n                    break;\n                case McpTransportProvider.CloudflareQuickTunnel:\n                    // Quick Tunnel hostnames rotate and are intentionally never auto-started.\n                    break;\n                default:\n                    McpOpenAiSecureTunnelManager.TryAutoStart();\n                    break;\n            }\n        }''',
          '''        public static void TryAutoStartPreferred()\n        {\n            McpTransportSupervisor.TryAutoStartPreferred(SelectedProvider);\n        }''')

          replace_once(openai,
          '''        public static void StopAllForHostShutdown()\n        {\n            McpOpenAiSecureTunnelManager.StopForHostShutdown();\n            McpCloudflareAccountTunnelManager.StopForHostShutdown();\n            McpCloudflareTunnelManager.StopForHostShutdown();\n        }''',
          '''        public static void StopAllForHostShutdown()\n        {\n            McpTransportSupervisor.StopForHostShutdown();\n        }''')

          replace_once(openai,
          '''        public static bool IsConfigured => IsValidTunnelId(SavedTunnelId) && IsUsableClientPath(SavedClientPath);\n\n        public static bool IsRunning''',
          '''        public static bool IsConfigured => IsValidTunnelId(SavedTunnelId) && IsUsableClientPath(SavedClientPath);\n        internal static Process? OwnedProcess { get { lock (Sync) return _process; } }\n\n        public static bool IsRunning''')

          replace_once(openai,
          '''                StopProcessOnly();\n                ClearDiagnostics();\n\n                var startInfo = new ProcessStartInfo''',
          '''                StopProcessOnly();\n                ClearDiagnostics();\n                string staleCleanup;\n                if (!McpTransportSupervisor.TryCleanupStaleOwnedProcess(\n                        McpTransportProvider.OpenAiSecureTunnel, clientPath, out staleCleanup))\n                {\n                    message = staleCleanup;\n                    SetLastError(message);\n                    return false;\n                }\n\n                var startInfo = new ProcessStartInfo''')

          replace_once(openai,
          '''                WriteTextVerified(AutoStartFile, "1");\n                McpTransportCoordinator.SetSelectedProvider(McpTransportProvider.OpenAiSecureTunnel);''',
          '''                string ownerError;\n                if (!McpTransportSupervisor.RegisterOwnedProcess(\n                        McpTransportProvider.OpenAiSecureTunnel, process, clientPath, out ownerError))\n                {\n                    message = "Không thể xác minh quyền sở hữu tunnel-client: " + ownerError;\n                    SetLastError(message);\n                    StopProcessOnly();\n                    return false;\n                }\n\n                WriteTextVerified(AutoStartFile, "1");\n                McpTransportCoordinator.SetSelectedProvider(McpTransportProvider.OpenAiSecureTunnel);''')

          replace_once(openai,
          '''        public static void TryAutoStart()\n        {''',
          '''        internal static bool StartForSupervisor(out string message)\n        {\n            return Start(SavedTunnelId, string.Empty, out message);\n        }\n\n        public static void TryAutoStart()\n        {''')

          replace_once(openai,
          '''            if (ReadText(AutoStartFile) != "1") return false;\n            if (McpTransportCoordinator.SelectedProvider != McpTransportProvider.OpenAiSecureTunnel) return false;''',
          '''            if (McpTransportSupervisor.IsManaging) return false;\n            if (ReadText(AutoStartFile) != "1") return false;\n            if (McpTransportCoordinator.SelectedProvider != McpTransportProvider.OpenAiSecureTunnel) return false;''')

          replace_once(openai,
          '''            if (dispose) { try { process.Dispose(); } catch { } }\n        }\n\n        private static void StopProcessOnly()''',
          '''            if (dispose)\n            {\n                McpTransportSupervisor.ClearOwnedProcess(McpTransportProvider.OpenAiSecureTunnel);\n                try { process.Dispose(); } catch { }\n            }\n        }\n\n        private static void StopProcessOnly()''')

          replace_once(openai,
          '''                try { process.Dispose(); } catch { }\n            }\n            lock (Sync) _stopping = false;''',
          '''                try { process.Dispose(); } catch { }\n                McpTransportSupervisor.ClearOwnedProcess(McpTransportProvider.OpenAiSecureTunnel);\n            }\n            lock (Sync) _stopping = false;''')

          replace_once(cloudflare,
          '''        public static string LastError { get { lock (Sync) return _lastError; } }\n\n        public static bool IsRunning''',
          '''        public static string LastError { get { lock (Sync) return _lastError; } }\n        public static bool IsConfigured => !string.IsNullOrWhiteSpace(CloudflaredPath) && !string.IsNullOrWhiteSpace(SavedHostname);\n        internal static Process? OwnedProcess { get { lock (Sync) return _process; } }\n\n        public static bool IsRunning''')

          replace_once(cloudflare,
          '''        public static void TryAutoStart()\n        {''',
          '''        internal static bool StartForSupervisor(out string error)\n        {\n            return StartSaved(out error);\n        }\n\n        public static void TryAutoStart()\n        {''')

          replace_once(cloudflare,
          '''            error = string.Empty;\n            StopProcess();\n            Process? process = null;''',
          '''            error = string.Empty;\n            StopProcess();\n            string staleCleanup;\n            if (!McpTransportSupervisor.TryCleanupStaleOwnedProcess(\n                    McpTransportProvider.CloudflareNamedTunnel, executable, out staleCleanup))\n            {\n                error = staleCleanup;\n                return false;\n            }\n            Process? process = null;''')

          replace_once(cloudflare,
          '''                process.EnableRaisingEvents = true;\n                if (process.HasExited) HandleProcessExit(process);\n                return IsRunning;''',
          '''                process.EnableRaisingEvents = true;\n                if (process.HasExited)\n                {\n                    HandleProcessExit(process);\n                    error = string.IsNullOrWhiteSpace(LastError) ? "Named Tunnel đã dừng ngay sau khi khởi động." : LastError;\n                    return false;\n                }\n                string ownerError;\n                if (!McpTransportSupervisor.RegisterOwnedProcess(\n                        McpTransportProvider.CloudflareNamedTunnel, process, executable, out ownerError))\n                {\n                    error = "Không thể xác minh quyền sở hữu cloudflared: " + ownerError;\n                    StopProcess();\n                    return false;\n                }\n                return IsRunning;''')

          replace_once(cloudflare,
          '''            if (owned) { try { process.Dispose(); } catch { } }\n        }''',
          '''            if (owned)\n            {\n                McpTransportSupervisor.ClearOwnedProcess(McpTransportProvider.CloudflareNamedTunnel);\n                try { process.Dispose(); } catch { }\n            }\n        }''')

          replace_once(cloudflare,
          '''            try { if (!process.HasExited) process.WaitForExit(2000); } catch { }\n            try { process.Dispose(); } catch { }\n        }''',
          '''            try { if (!process.HasExited) process.WaitForExit(2000); } catch { }\n            try { process.Dispose(); } catch { }\n            McpTransportSupervisor.ClearOwnedProcess(McpTransportProvider.CloudflareNamedTunnel);\n        }''')

          replace_once(supervisor, "using System.Reflection;\n", "")
          replace_once(supervisor,
          '''                started = McpOpenAiSecureTunnelManager.Start(\n                    McpOpenAiSecureTunnelManager.SavedTunnelId, string.Empty, out error);''',
          '''                started = McpOpenAiSecureTunnelManager.StartForSupervisor(out error);''')
          replace_once(supervisor,
          '''                started = McpCloudflareAccountTunnelManager.StartSaved(out error);''',
          '''                started = McpCloudflareAccountTunnelManager.StartForSupervisor(out error);''')
          replace_once(supervisor,
          '''            if (provider == McpTransportProvider.CloudflareNamedTunnel)\n                return !string.IsNullOrWhiteSpace(McpCloudflareAccountTunnelManager.CloudflaredPath)\n                       && !string.IsNullOrWhiteSpace(McpCloudflareAccountTunnelManager.SavedHostname);''',
          '''            if (provider == McpTransportProvider.CloudflareNamedTunnel)\n                return McpCloudflareAccountTunnelManager.IsConfigured;''')
          replace_once(supervisor,
          '''        private static bool TryGetManagerProcess(McpTransportProvider provider, out Process? process)\n        {\n            process = null;\n            try\n            {\n                Type managerType;\n                if (provider == McpTransportProvider.OpenAiSecureTunnel)\n                    managerType = typeof(McpOpenAiSecureTunnelManager);\n                else if (provider == McpTransportProvider.CloudflareNamedTunnel)\n                    managerType = typeof(McpCloudflareAccountTunnelManager);\n                else\n                    return false;\n\n                var field = managerType.GetField("_process", BindingFlags.Static | BindingFlags.NonPublic);\n                process = field == null ? null : field.GetValue(null) as Process;\n                return process != null;\n            }\n            catch { return false; }\n        }''',
          '''        private static bool TryGetManagerProcess(McpTransportProvider provider, out Process? process)\n        {\n            process = provider == McpTransportProvider.OpenAiSecureTunnel\n                ? McpOpenAiSecureTunnelManager.OwnedProcess\n                : provider == McpTransportProvider.CloudflareNamedTunnel\n                    ? McpCloudflareAccountTunnelManager.OwnedProcess\n                    : null;\n            return process != null;\n        }''')

      - name: Verify deterministic supervisor guard
        run: python scripts/preflight-mcp-transport-supervisor.py

      - name: Commit carrier patch and remove one-shot workflow
        shell: bash
        run: |
          git rm -- .github/workflows/issue-5457-autopatch.yml
          git config user.name "qs3d-gpt56sol"
          git config user.email "89531707+trinhtanphat@users.noreply.github.com"
          git add src/QS3D.BricsCAD.V25/McpTransportSupervisor.cs \
                  src/QS3D.BricsCAD.V25/McpOpenAiSecureTunnel.cs \
                  src/QS3D.BricsCAD.V25/McpCloudflareAccountOnboarding.cs
          git commit -m "feat(mcp): wire bounded transport failover supervisor (#5457) [5457-patched]"
          git push origin HEAD:${{ github.ref_name }}
