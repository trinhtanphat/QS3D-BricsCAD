name: Issue 5457 ownership cleanup patch
on:
  push:
    branches:
      - agent/gpt56sol-20260903-multi-transport-failover/issue-5457-multi-transport-failover
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[5457-ownership-hardened]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Harden owned-process sidecar cleanup
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          sup_path = Path('src/QS3D.BricsCAD.V25/McpTransportSupervisor.cs')
          cf_path = Path('src/QS3D.BricsCAD.V25/McpCloudflareAccountOnboarding.cs')
          guard_path = Path('scripts/preflight-mcp-transport-supervisor.py')

          sup = sup_path.read_text(encoding='utf-8')
          old = '''        private static void StopProvider(McpTransportProvider provider)\n        {\n            try\n            {\n                if (provider == McpTransportProvider.OpenAiSecureTunnel)\n                    McpOpenAiSecureTunnelManager.StopForHostShutdown();\n                else if (provider == McpTransportProvider.CloudflareNamedTunnel)\n                    McpCloudflareAccountTunnelManager.StopForHostShutdown();\n            }\n            catch { }\n            ClearOwnedProcess(provider);\n        }'''
          new = '''        private static void StopProvider(McpTransportProvider provider)\n        {\n            // Provider managers clear ownership only after they can prove their child exited.\n            // If stop/kill fails, preserve the sidecar so the next start can revalidate PID +\n            // start-time + executable identity before attempting stale cleanup.\n            try\n            {\n                if (provider == McpTransportProvider.OpenAiSecureTunnel)\n                    McpOpenAiSecureTunnelManager.StopForHostShutdown();\n                else if (provider == McpTransportProvider.CloudflareNamedTunnel)\n                    McpCloudflareAccountTunnelManager.StopForHostShutdown();\n            }\n            catch { }\n        }'''
          if old not in sup:
              raise SystemExit('StopProvider exact source pattern not found')
          sup_path.write_text(sup.replace(old, new, 1), encoding='utf-8')

          cf = cf_path.read_text(encoding='utf-8')
          old_cf = '''        private static void StopProcess()\n        {\n            Process? process;\n            lock (Sync) { process = _process; _process = null; }\n            if (process == null) return;\n            try { process.EnableRaisingEvents = false; } catch { }\n            try { if (!process.HasExited) process.Kill(); } catch { }\n            try { if (!process.HasExited) process.WaitForExit(2000); } catch { }\n            try { process.Dispose(); } catch { }\n            McpTransportSupervisor.ClearOwnedProcess(McpTransportProvider.CloudflareNamedTunnel);\n        }'''
          new_cf = '''        private static void StopProcess()\n        {\n            Process? process;\n            lock (Sync) { process = _process; _process = null; }\n            if (process == null) return;\n            var stopped = false;\n            try { process.EnableRaisingEvents = false; } catch { }\n            try\n            {\n                if (!process.HasExited) process.Kill();\n                stopped = process.HasExited || process.WaitForExit(2000);\n                if (stopped) stopped = process.HasExited;\n            }\n            catch { stopped = false; }\n            try { process.Dispose(); } catch { }\n            if (stopped)\n                McpTransportSupervisor.ClearOwnedProcess(McpTransportProvider.CloudflareNamedTunnel);\n        }'''
          if old_cf not in cf:
              raise SystemExit('Cloudflare StopProcess exact source pattern not found')
          cf_path.write_text(cf.replace(old_cf, new_cf, 1), encoding='utf-8')

          guard = guard_path.read_text(encoding='utf-8')
          anchor = '''elif "ClearOwnedProcess(provider)" in stop_provider.group("body"):\n    errors.append("supervisor: StopProvider must preserve crash-surviving ownership sidecar")\n'''
          addition = anchor + '''\n# Cloudflare stop must preserve ownership metadata when termination cannot be confirmed.\nrequire(cloudflare, "if (stopped)", "cloudflare owned-process stop")\nrequire(cloudflare, "ClearOwnedProcess(McpTransportProvider.CloudflareNamedTunnel)", "cloudflare owned-process stop")\n'''
          if anchor not in guard:
              raise SystemExit('guard anchor not found')
          guard_path.write_text(guard.replace(anchor, addition, 1), encoding='utf-8')
          '@ | python -
      - name: Verify deterministic supervisor guard
        shell: pwsh
        run: python scripts/preflight-mcp-transport-supervisor.py
      - name: Commit hardened carrier and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name "qs3d-gpt56sol"
          git config user.email "89531707+trinhtanphat@users.noreply.github.com"
          git add src/QS3D.BricsCAD.V25/McpTransportSupervisor.cs src/QS3D.BricsCAD.V25/McpCloudflareAccountOnboarding.cs scripts/preflight-mcp-transport-supervisor.py
          git commit -m "fix(mcp): preserve stale tunnel ownership proof (#5457) [5457-ownership-hardened]"
          git rm .github/workflows/issue-5457-autopatch.yml
          git commit -m "chore(ci): remove #5457 one-shot patch workflow [5457-ownership-hardened]"
          git push origin HEAD:${{ github.ref_name }}
