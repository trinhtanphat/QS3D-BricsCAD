name: Dispatch preview.11 after template ambiguity fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-preview11-after-template-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Self-remove and dispatch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          helper='.github/workflows/dispatch-preview11-after-template-fix.yml'
          helper_sha="$(gh api "repos/${repo}/contents/${helper}?ref=main" --jq .sha)"
          gh api --method DELETE "repos/${repo}/contents/${helper}" \
            -f message='ci: remove template-fix dispatcher' \
            -f sha="$helper_sha" \
            -f branch='main'
          gh workflow run release-v25-cloud.yml --repo "${repo}" --ref main \
            -f release_tag='v0.1.0-preview.11' \
            -f confirm_release='RELEASE'
