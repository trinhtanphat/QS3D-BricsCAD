name: Fix V25 release ordering once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-v25-release-order-once-20260814.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Stage release workflow with early source preparation
        shell: python {0}
        run: |
          from pathlib import Path
          source = Path('.github/workflows/release-v25-cloud.yml')
          target = Path('ci-staging/release-v25-cloud-fixed.yml')
          s = source.read_text(encoding='utf-8')
          start_marker = '      - uses: actions/setup-python@v7\n'
          validate_marker = '      - name: Validate cloud prerelease request\n'
          anchor = '          Write-Host "Exact release source commit: $releaseCommit"\n\n'
          if s.count(start_marker) != 1:
              raise SystemExit(f'Expected one setup-python marker, got {s.count(start_marker)}')
          if s.count(validate_marker) != 1:
              raise SystemExit(f'Expected one validate marker, got {s.count(validate_marker)}')
          if s.count(anchor) != 1:
              raise SystemExit(f'Expected one release preparation anchor, got {s.count(anchor)}')
          start = s.index(start_marker)
          end = s.index(validate_marker, start)
          setup = s[start:end]
          for required in ('actions/setup-python@v7', 'actions/setup-dotnet@v6', 'Cache NuGet packages'):
              if required not in setup:
                  raise SystemExit(f'Missing expected setup marker: {required}')
          s = s[:start] + s[end:]
          insert_at = s.index(anchor) + len(anchor)
          s = s[:insert_at] + setup + s[insert_at:]
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(s, encoding='utf-8')
      - name: Commit staged workflow blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-staging/release-v25-cloud-fixed.yml
          git diff --cached --check
          git diff --cached --quiet && { echo "No staged workflow produced"; exit 1; }
          git commit -m "ci(v25): stage early release preparation workflow blob"
          git pull --rebase origin main
          git push origin HEAD:main
