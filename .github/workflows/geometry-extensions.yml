name: QS3D Geometry Extensions Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-core:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"
      - name: Manual-only CI policy gate
        run: python scripts/preflight-ci-manual-only.py
      - name: Generic source preflight
        run: python scripts/preflight.py
      - name: Geometry completion preflight
        run: python scripts/preflight-geometry-completion.py
      - name: Direct room curve-source preflight
        run: python scripts/preflight-room-curve-sources.py
      - name: Wall junction topology preflight
        run: python scripts/preflight-wall-junctions.py
      - name: Wall snap review/apply safety preflight
        run: python scripts/preflight-wall-snap-review.py
      - name: Column tie/rebar ownership preflight
        run: python scripts/preflight-column-ties.py
      - name: Build Core Release
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release
      - name: Run deterministic smoke tests
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release
