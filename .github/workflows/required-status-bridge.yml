name: QS3D Required Status Bridge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
    branches:
      - main

permissions:
  contents: read
  checks: read
  pull-requests: read
  statuses: write

concurrency:
  group: qs3d-required-status-bridge-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  bridge:
    name: required-status-bridge
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Mirror exact-head required checks into commit statuses
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          QS3D_API_URL: ${{ github.api_url }}
          QS3D_REPOSITORY: ${{ github.repository }}
          QS3D_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QS3D_PR_NUMBER: ${{ github.event.pull_request.number }}
          QS3D_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          import json
          import os
          import sys
          import time
          import urllib.request

          api_url = os.environ["QS3D_API_URL"].rstrip("/")
          repository = os.environ["QS3D_REPOSITORY"]
          head_sha = os.environ["QS3D_HEAD_SHA"]
          pr_number = int(os.environ["QS3D_PR_NUMBER"])
          run_url = os.environ["QS3D_RUN_URL"]
          token = os.environ["GH_TOKEN"]
          required_contexts = ("preflight", "core")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "qs3d-required-status-bridge",
          }

          def api_request(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  f"{api_url}/repos/{repository}{path}",
                  data=data,
                  method=method,
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def publish_status(context, state, description):
              api_request(
                  f"/statuses/{head_sha}",
                  method="POST",
                  payload={
                      "state": state,
                      "context": context,
                      "description": description[:140],
                      "target_url": run_url,
                  },
              )
              print(f"published {context}={state}: {description}")

          for context in required_contexts:
              publish_status(context, "pending", "Waiting for exact-head GitHub Actions check-run")

          deadline = time.monotonic() + (20 * 60)
          latest_terminal = {}

          while time.monotonic() < deadline:
              response = api_request(f"/commits/{head_sha}/check-runs?per_page=100")
              latest_terminal = {}

              for context in required_contexts:
                  candidates = []
                  for check_run in response.get("check_runs", []):
                      if check_run.get("name") != context:
                          continue
                      pull_requests = check_run.get("pull_requests") or []
                      if not any(int(pr.get("number", -1)) == pr_number for pr in pull_requests):
                          continue
                      candidates.append(check_run)

                  if not candidates:
                      continue

                  latest = max(candidates, key=lambda run: int(run.get("id", 0)))
                  if latest.get("status") == "completed":
                      latest_terminal[context] = latest.get("conclusion") or "unknown"

              if len(latest_terminal) == len(required_contexts):
                  failures = []
                  for context in required_contexts:
                      conclusion = latest_terminal[context]
                      if conclusion == "success":
                          publish_status(context, "success", "Exact-head GitHub Actions check-run succeeded")
                      else:
                          publish_status(
                              context,
                              "failure",
                              f"Exact-head GitHub Actions check-run concluded {conclusion}",
                          )
                          failures.append(f"{context}={conclusion}")

                  if failures:
                      raise SystemExit("required check-run failure: " + ", ".join(failures))

                  print("required status bridge completed successfully")
                  sys.exit(0)

              time.sleep(15)

          for context in required_contexts:
              if context not in latest_terminal:
                  publish_status(context, "error", "Exact-head required check-run missing or not terminal")

          raise SystemExit("timed out waiting for exact-head required check-runs")
