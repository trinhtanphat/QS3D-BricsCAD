name: Dispatch V25 Preview 7 After Cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-v25-preview7-after-cleanup.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Allow dispatcher cleanup before release dispatch
        run: sleep 20
      - name: Dispatch release-v25-cloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-v25-cloud.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f release_tag=v0.1.0-preview.7 \
            -f confirm_release=RELEASE
