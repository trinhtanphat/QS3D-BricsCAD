name: Temporary LOCAL inbox reconciliation

on:
  push:
    branches:
      - agent/gpt56sol-20260831/issue-5002-local-inbox-post4998

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/gpt56sol-20260831/issue-5002-local-inbox-post4998
          fetch-depth: 0
      - name: Patch canonical LOCAL inbox and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/LOCAL-AGENT-INBOX.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('**Updated:** 2026-08-27 (UTC+7)', '**Updated:** 2026-08-31 (UTC+7)', 1)

          def section(name, next_name):
              start = text.index(name)
              end = text.index(next_name, start)
              return start, end, text[start:end]

          # LOCAL-012: preserve all historical evidence and add only the current post-#4998 gate.
          s, e, block = section('## LOCAL-012 — Project Browser native workspace and CAD selection bridge', '## LOCAL-013 — clean-room BRC public capability and eligible CAD quantity round-trip')
          marker = '- Current source/artifact status: `SOURCE_FIX_4998_MERGED / WAITING_POST_MERGE_PUBLISHED_DESCENDANT / LICENSED_RUNTIME_PENDING`\n'
          if marker not in block:
              needle = '- Status: IN_PROGRESS\n'
              assert needle in block
              addition = (
                  marker
                  + '- Current source boundary: PR #4998 final head `70043ca774b54f4f2fb6dc3b5710299ea1ec6dfc`; protected Shared CI `33374724885` passed `preflight` + `core`; merged to protected main as `80f609057bb95b58f08f3ea88ea22411b88cb558`. This supersedes `.10233` and every pre-merge Workspace crash candidate.\n'
                  + '- Current release truth: latest published preview `.10270` targets pre-merge `f9cf4d2e8c9943e729a1034276920e015a95bc53`, so it is not admissible for this Workspace crash qualification. Wait for a published V25 descendant containing `80f609057b...`; publication/source CI still is not `LOCAL_PASS`. Release coordination: #5004.\n'
                  + '- Current runtime gate: preserve all already accepted bounded PASS rows and do not rerun them; execute only affected/unfinished Workspace rows after an exact post-merge published descendant is pinned and the licensed host is exclusively allocated.\n'
              )
              block = block.replace(needle, needle + addition, 1)
          block = block.replace('- Updated: 2026-08-26\n', '- Updated: 2026-08-31\n', 1)
          text = text[:s] + block + text[e:]

          # LOCAL-021: retire .10233 eligibility and pin the merged PropertyList fix boundary.
          s, e, block = section('## LOCAL-021 — Móng Bè workflow and Quantity Insight viewport highlight', '## LOCAL-022 — Móng đơn placement/edit/save-reopen on V25/V26')
          replacements = {
              '- Source/artifact status: `10230_TERMINAL_NO_RESULT_DO_NOT_RETRY / SOURCE_FIX_4268_MERGED / DESCENDANT_10233_ELIGIBLE / WAITING_FRESH_TASK_AND_72_ALLOCATION`': '- Source/artifact status: `10230_TERMINAL_NO_RESULT_DO_NOT_RETRY / SOURCE_FIX_4998_MERGED / WAITING_POST_MERGE_PUBLISHED_DESCENDANT / LICENSED_RUNTIME_PENDING`',
              '- Successor source fix: issue #4173 / protected PR #4268 merged the constructor-owned pre-first-layout `ModelTree` reparent correction as `bc04243aeb452d2f48217fbf31556280cc326d69`; exact source head `6c2fb237e1aecffc64b838524ed004fc12af1033`; protected run `33140765199` passed `preflight` + `core`. This is source/build evidence only and is not `LOCAL_PASS`.': '- Successor source fix: the earlier #4268 ModelTree containment was necessary but insufficient. Issue #4173 is now closed after PR #4998 merged the remaining grouped `WorkspacePanel.PropertyList` first-layout containment: final PR head `70043ca774b54f4f2fb6dc3b5710299ea1ec6dfc`, protected Shared CI `33374724885` with `preflight` + `core` SUCCESS, merge `80f609057bb95b58f08f3ea88ea22411b88cb558`. Source/build evidence is not `LOCAL_PASS`.',
              '- Exact eligible descendant: `v0.1.0-preview.10233`; source/tag `94191b0f7b1dd997cb6b5dc0e8276ed9c5ae2964`; official V25 ZIP SHA-256 `85B9D90154460387D9EB65F45554AD2009733310910626C3B8B287AC285B0ECB`; checksum asset SHA-256 `2C0A49C7B568AC31A94596BD22151F595462AA5226F7EF3C32BC7EF59C9D600C`; release workflow `33142138765` completed `SUCCESS`. The release is a verified descendant of #4268 and is artifact/source eligible only; cloud/release success is not licensed runtime PASS.': '- Current release truth: `.10233` is superseded by the later PropertyList repro/fix. The newest published preview `.10270` targets `f9cf4d2e8c9943e729a1034276920e015a95bc53`, the parent before merge `80f609...`; therefore `.10233`, `.10270` and every earlier preview are not admissible. Wait for an exact published V25 descendant containing `80f609057b...`; coordination issue #5004 owns only publication readiness, not runtime PASS.',
              '- Runtime gate: do not touch the shared licensed host yet. A new attempt requires one current LOCAL-021 task explicitly bound to exact `.10233@94191b0f7b1dd997cb6b5dc0e8276ed9c5ae2964`, literal #72 `OFFLINE_FREEZE`, accepted immutable `OFFLINE_READY` / exclusive-host admission, then one fresh named V25 allocation. The consumed `.10230` task/allocation is never reusable.': '- Runtime gate: do not touch the shared licensed host until a published V25 descendant containing `80f609057b...` is pinned. Then require one fresh LOCAL-021 task identity, exact tag/source/package/adapter/Core/probe/runner hashes, literal #72 exclusive-host admission, zero pre-existing BricsCAD processes, one bounded invocation, and exact cleanup. The consumed `.10230` task/allocation is never reusable.',
              '- Evidence: historical `.10222`, `.10225` and `.10228` attempts remain `NO_RESULT`; `.10230@9c13be8d8f34a0b3b0a66ceba431a019f3c695d0` is terminal `NO_RESULT / DO_NOT_RETRY` after NETLOAD and before baseline. No LOCAL-021 `LOCAL_PASS` exists yet. `.10233` is the eligible successor artifact only and has not been licensed-rerun.': '- Evidence: historical `.10222`, `.10225` and `.10228` attempts remain `NO_RESULT`; `.10230@9c13be8d8f34a0b3b0a66ceba431a019f3c695d0` is terminal `NO_RESULT / DO_NOT_RETRY` after NETLOAD and before baseline. No LOCAL-021 `LOCAL_PASS` exists yet. `.10233` and `.10270` are pre-#4998 artifacts and are not eligible for the next licensed run.',
              '- Related docs: `docs/LOCAL-V25-QUALIFICATION.md`; `docs/LOCAL-QUANTITY-REVIEW-CUBICOST-ACCEPTANCE.md`; issues #4041, #4173 and #4282; draft PR #4042; source fix PR #4268.': '- Related docs: `docs/LOCAL-V25-QUALIFICATION.md`; `docs/LOCAL-QUANTITY-REVIEW-CUBICOST-ACCEPTANCE.md`; issues #4041, closed #4173, #4282 and #5004; source fix PR #4998.',
              '- Updated: 2026-08-28': '- Updated: 2026-08-31',
          }
          for old, new in replacements.items():
              assert old in block, old
              block = block.replace(old, new, 1)
          text = text[:s] + block + text[e:]

          # LOCAL-022: source blocker cleared; artifact/runtime remain pending.
          s, e, block = section('## LOCAL-022 — Móng đơn placement/edit/save-reopen on V25/V26', '## LOCAL-020 — Grid pair-owned intersection marker native lifecycle')
          replacements = {
              '- Status: BLOCKED': '- Status: IN_PROGRESS',
              '- Source/artifact status: `V25_NO_RESULT / V26_NO_RESULT / POST_10229_V25_NO_RESULT / SOURCE_SUCCESSOR_REQUIRED / WAITING_NEW_DESCENDANT`': '- Source/artifact status: `V25_NO_RESULT / V26_NO_RESULT / SOURCE_FIX_4998_MERGED / WAITING_POST_MERGE_PUBLISHED_DESCENDANT / LICENSED_RUNTIME_PENDING`',
              '- Historical startup containment: protected PR #4179 landed the first #4173 Workspace ModelTree virtualization containment at `main@a7b7dfb456654509c9eccf33f854350a61d9e59d`; protected run `33069632255` passed `preflight` + `core`, deterministic smoke and V25 plugin build. That source/build evidence remains historical, but licensed post-fix reproduction proved the containment insufficient and #4173 is now reopened for a successor source fix.': '- Historical startup containment: #4179/#4268 ModelTree containment remained insufficient. The successor source fix is now merged: closed issue #4173 / PR #4998, final head `70043ca774b54f4f2fb6dc3b5710299ea1ec6dfc`, protected Shared CI `33374724885` with `preflight` + `core` SUCCESS, merge `80f609057bb95b58f08f3ea88ea22411b88cb558`. Every earlier preview is superseded for this crash qualification.',
              '- Runtime gate: the consumed `28e48e6d...` cells are non-retryable and the old post-#4179 `.10229` allocation request is superseded. Do not launch or attach BricsCAD for LOCAL-022 until reopened #4173 lands a successor source fix, a new exact descendant artifact is pinned, and #72 issues a fresh literal named authorization / `HOST_RELEASED` allocation for `#4034 / LOCAL-022` on that exact successor identity. Later `main` drift alone does not repoint or qualify this runtime lane.': '- Runtime gate: the consumed `28e48e6d...` cells and `.10229` request are non-retryable. Do not launch or attach BricsCAD until an exact published descendant containing `80f609057b...` is pinned. Then use a fresh LOCAL-022 V25 task/allocation first, clean up completely, and only afterward run V26 on the same exact source identity with a separate fresh task/allocation. `.10233`, `.10270` and all earlier previews are inadmissible; release coordination is #5004.',
              '- Related docs: `docs/agent-work-claims/2026-08-26-codex-issue4046-restore-single-footing-regression.md`; issues #4034, #4173 and #4189; PRs #4058 and #4179.': '- Related docs: `docs/agent-work-claims/2026-08-26-codex-issue4046-restore-single-footing-regression.md`; issues #4034, closed #4173, #4189 and #5004; PRs #4058, #4179 and #4998.',
              '- Updated: 2026-08-27': '- Updated: 2026-08-31',
          }
          for old, new in replacements.items():
              assert old in block, old
              block = block.replace(old, new, 1)
          text = text[:s] + block + text[e:]

          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- docs/LOCAL-AGENT-INBOX.md
          git rm .github/workflows/issue-5002-patch-local-inbox.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/LOCAL-AGENT-INBOX.md
          git commit -m 'docs(local): repin Workspace runtime handoff after #4998'
          git push origin HEAD:agent/gpt56sol-20260831/issue-5002-local-inbox-post4998
