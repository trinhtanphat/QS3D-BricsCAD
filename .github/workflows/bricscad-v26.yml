name: QS3D Manual BricsCAD V26 Build

on:
  workflow_dispatch:
    inputs:
      run_runtime:
        description: "Run licensed BricsCAD V26 NETLOAD/runtime validation"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: qs3d-manual-bricscad-v26
  cancel-in-progress: false

jobs:
  build-v26:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, windows, x64, bricscad-v26]
    env:
      BRICSCAD_V26_DIR: ${{ vars.BRICSCAD_V26_DIR }}
      BRICSCAD_V26_PROFILE: ${{ vars.BRICSCAD_V26_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"

      - name: Bind V26 host-reference state path
        shell: powershell
        run: |
          $statePath = Join-Path $env:RUNNER_TEMP "qs3d-v26-host-reference-state.json"
          "V26_HOST_REFERENCE_STATE=$statePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Manual-only CI policy gate
        run: python scripts/preflight-ci-manual-only.py

      - name: Generic source guard
        run: python scripts/preflight.py

      - name: BricsCAD V26 compatibility guard
        run: python scripts/preflight-bricscad-v26.py

      - name: Validate V26 host references and runtime identity
        shell: powershell
        run: |
          # Capture the exact ordinary/non-reparse V26 host-reference generations that later build/runtime steps are allowed to consume.
          & .\scripts\assert-v26-host-reference-safety.ps1 -BricsCadDir $env:BRICSCAD_V26_DIR -StatePath $env:V26_HOST_REFERENCE_STATE | Out-Null
          # Keep the BRep reference explicit at the workflow boundary while the shared helper owns ordinary-file, reparse, host-major and stable-generation validation.
          $requiredBrep = Join-Path $env:BRICSCAD_V26_DIR 'TD_MgdBrep.dll'
          if (-not (Test-Path -LiteralPath $requiredBrep -PathType Leaf)) {
            throw "Required BricsCAD V26 host reference is missing: TD_MgdBrep.dll"
          }
          $desktopRuntimes = @(dotnet --list-runtimes | Where-Object { $_ -match '^Microsoft\.WindowsDesktop\.App 8\.' })
          if ($desktopRuntimes.Count -eq 0) {
            throw ".NET 8 Windows Desktop Runtime/SDK is required for the BricsCAD V26 managed host."
          }

      - name: Build Core Release
        run: dotnet build src/QS3D.Core/QS3D.Core.csproj -c Release

      - name: Deterministic Core smoke tests
        run: dotnet run --project tests/QS3D.Core.SmokeTests/QS3D.Core.SmokeTests.csproj -c Release

      - name: Build BricsCAD V26 plugin against held reference generations
        shell: powershell
        run: |
          & .\scripts\build-v26-with-stable-references.ps1 `
            -BricsCadDir $env:BRICSCAD_V26_DIR `
            -StatePath $env:V26_HOST_REFERENCE_STATE `
            -ProjectPath 'src\QS3D.BricsCAD.V26\QS3D.BricsCAD.V26.csproj' `
            -Configuration Release `
            -Platform x64

      - name: Licensed V26 NETLOAD runtime gate
        if: ${{ inputs.run_runtime }}
        shell: powershell
        run: |
          & .\scripts\assert-v26-host-reference-safety.ps1 -BricsCadDir $env:BRICSCAD_V26_DIR -VerifyStatePath $env:V26_HOST_REFERENCE_STATE | Out-Null
          $plugin = (Resolve-Path "src\QS3D.BricsCAD.V26\bin\x64\Release\net8.0-windows\QS3D.BricsCAD.V26.dll").Path
          & .\scripts\test-bricscad-v26-runtime.ps1 `
            -BricsCadDir $env:BRICSCAD_V26_DIR `
            -PluginDll $plugin `
            -Profile $env:BRICSCAD_V26_PROFILE `
            -ArtifactDir "$env:GITHUB_WORKSPACE\artifacts\bricscad-v26-runtime"

      - name: Upload V26 qualification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: QS3D-BricsCAD-V26-${{ github.sha }}
          if-no-files-found: error
          path: |
            src/QS3D.BricsCAD.V26/bin/x64/Release/net8.0-windows/QS3D.BricsCAD.V26.dll
            src/QS3D.BricsCAD.V26/bin/x64/Release/net8.0-windows/QS3D.Core.dll
            artifacts/bricscad-v26-runtime/
