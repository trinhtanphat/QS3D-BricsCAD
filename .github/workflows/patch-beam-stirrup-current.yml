name: QS3D Patch Beam Stirrup Current Integration

on:
  push:
    branches:
      - ci/patch-beam-stirrup-current-20260810

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/beam-stirrup-release-current-20260810
          fetch-depth: 0
      - name: Patch current-main overlap files by exact anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          builder = 'src/QS3D.BricsCAD.V25/Cad/BeamStirrupSolidBuilder.cs'

          replace_once(builder,
          '''            public double ActualSpacingM { get; set; }\n            public string Notation { get; set; } = string.Empty;''',
          '''            public double ActualSpacingM { get; set; }\n            public double CenterlineLengthM { get; set; }\n            public double PolylineLengthM { get; set; }\n            public double BendRadiusM { get; set; }\n            public double HookLengthM { get; set; }\n            public double HookTailAngleDeg { get; set; }\n            public bool HasHookTails { get; set; }\n            public string Notation { get; set; } = string.Empty;''',
          'pending metadata')

          replace_once(builder,
          '''                    var endCoverM = CadGeometryGuard.Number(element, family, "RebarStirrupEndCoverM", sectionCoverM);\n                    if (sectionCoverM < 0d) throw new InvalidOperationException(element.Id + "/RebarStirrupCoverM phải >= 0.");\n                    if (endCoverM < 0d) throw new InvalidOperationException(element.Id + "/RebarStirrupEndCoverM phải >= 0.");''',
          '''                    var endCoverM = CadGeometryGuard.Number(element, family, "RebarStirrupEndCoverM", sectionCoverM);\n                    var bendRadiusM = CadGeometryGuard.Number(element, family, "RebarStirrupBendRadiusM", 0d);\n                    var hookLengthM = CadGeometryGuard.Number(element, family, "RebarStirrupHookLengthM", 0d);\n                    var hookTailAngleDeg = CadGeometryGuard.Number(element, family, "RebarStirrupHookTailAngleDeg", 0d);\n                    var maximumSagittaM = CadGeometryGuard.Positive(CadGeometryGuard.Number(element, family, "RebarStirrupMaximumSagittaM", .001d), element.Id + "/RebarStirrupMaximumSagittaM");\n                    if (sectionCoverM < 0d) throw new InvalidOperationException(element.Id + "/RebarStirrupCoverM phải >= 0.");\n                    if (endCoverM < 0d) throw new InvalidOperationException(element.Id + "/RebarStirrupEndCoverM phải >= 0.");\n                    if (bendRadiusM < 0d) throw new InvalidOperationException(element.Id + "/RebarStirrupBendRadiusM phải >= 0.");\n                    if (hookLengthM < 0d) throw new InvalidOperationException(element.Id + "/RebarStirrupHookLengthM phải >= 0.");''',
          'engineering inputs')

          replace_once(builder,
          '''                        Count = group.Quantity,\n                        SpacingMm = group.SpacingMm\n                    });''',
          '''                        Count = group.Quantity,\n                        SpacingMm = group.SpacingMm,\n                        BendRadiusM = bendRadiusM,\n                        MaximumSagittaM = maximumSagittaM,\n                        HookLengthM = hookLengthM,\n                        HookTailAngleDeg = hookTailAngleDeg\n                    });''',
          'planner inputs')

          replace_once(builder,
          '''                        DiameterMm = group.DiameterMm,\n                        ActualSpacingM = layout.ActualSpacingM,\n                        Notation = notation.Trim()''',
          '''                        DiameterMm = group.DiameterMm,\n                        ActualSpacingM = layout.ActualSpacingM,\n                        CenterlineLengthM = layout.CenterlineLengthM,\n                        PolylineLengthM = layout.PolylineLengthM,\n                        BendRadiusM = layout.BendRadiusM,\n                        HookLengthM = hookLengthM,\n                        HookTailAngleDeg = hookTailAngleDeg,\n                        HasHookTails = layout.HasHookTails,\n                        Notation = notation.Trim()''',
          'pending values')

          replace_once(builder,
          '''                update.Element.Properties["GeneratedBeamStirrupActualSpacingM"] = update.ActualSpacingM.ToString("R", CultureInfo.InvariantCulture);\n                update.Element.Properties["GeneratedBeamStirrupNotation"] = update.Notation;\n                update.Element.Properties["GeneratedBeamStirrupMode"] = "Beam.Line.RectangularClosedLoop";''',
          '''                update.Element.Properties["GeneratedBeamStirrupActualSpacingM"] = update.ActualSpacingM.ToString("R", CultureInfo.InvariantCulture);\n                update.Element.Properties["GeneratedBeamStirrupCenterlineLengthM"] = update.CenterlineLengthM.ToString("R", CultureInfo.InvariantCulture);\n                update.Element.Properties["GeneratedBeamStirrupTotalCenterlineLengthM"] = CadGeometryGuard.Multiply(update.CenterlineLengthM, update.Handles.Count, update.Element.Id + "/stirrup total centerline").ToString("R", CultureInfo.InvariantCulture);\n                update.Element.Properties["GeneratedBeamStirrupPolylineLengthM"] = update.PolylineLengthM.ToString("R", CultureInfo.InvariantCulture);\n                update.Element.Properties["GeneratedBeamStirrupBendRadiusM"] = update.BendRadiusM.ToString("R", CultureInfo.InvariantCulture);\n                update.Element.Properties["GeneratedBeamStirrupHookLengthM"] = update.HookLengthM.ToString("R", CultureInfo.InvariantCulture);\n                update.Element.Properties["GeneratedBeamStirrupHookTailAngleDeg"] = update.HookTailAngleDeg.ToString("R", CultureInfo.InvariantCulture);\n                update.Element.Properties["GeneratedBeamStirrupNotation"] = update.Notation;\n                update.Element.Properties["GeneratedBeamStirrupMode"] = update.HasHookTails ? "Beam.Line.RectangularHookedPath" : (update.BendRadiusM > 1e-12d ? "Beam.Line.RectangularRoundedLoop" : "Beam.Line.RectangularClosedLoop");''',
          'generated metadata')

          replace_once(builder,
          '''        {\n            Solid3d? result = null;\n            try\n            {\n                radius = CadGeometryGuard.Positive(radius, label + "/radius");''',
          '''        {\n            if (loop == null || loop.Count < 2) throw new ArgumentException("Beam stirrup section path is incomplete.", nameof(loop));\n            var closed = loop[0].DistanceTo(loop[loop.Count - 1]) <= 1e-12d;\n            Solid3d? result = null;\n            try\n            {\n                radius = CadGeometryGuard.Positive(radius, label + "/radius");''',
          'loop shape guard')

          replace_once(builder,
          '''                    var overlap = Math.Min(CadGeometryGuard.Multiply(radius, .75d, label + "/overlap radius"), CadGeometryGuard.Multiply(length, .1d, label + "/overlap length"));\n                    var unit = new Vector3d(dx / length, dy / length, dz / length);\n                    var extendedStart = new Point3d(\n                        CadGeometryGuard.Subtract(start.X, CadGeometryGuard.Multiply(unit.X, overlap, label + "/overlap X"), label + "/extended X"),\n                        CadGeometryGuard.Subtract(start.Y, CadGeometryGuard.Multiply(unit.Y, overlap, label + "/overlap Y"), label + "/extended Y"),\n                        CadGeometryGuard.Subtract(start.Z, CadGeometryGuard.Multiply(unit.Z, overlap, label + "/overlap Z"), label + "/extended Z"));\n                    var extendedLength = CadGeometryGuard.Add(length, CadGeometryGuard.Multiply(overlap, 2d, label + "/double overlap"), label + "/extended length");''',
          '''                    var overlap = Math.Min(CadGeometryGuard.Multiply(radius, .75d, label + "/overlap radius"), CadGeometryGuard.Multiply(length, .1d, label + "/overlap length"));\n                    var before = closed || index > 1 ? overlap : 0d;\n                    var after = closed || index < loop.Count - 1 ? overlap : 0d;\n                    var unit = new Vector3d(dx / length, dy / length, dz / length);\n                    var extendedStart = new Point3d(\n                        CadGeometryGuard.Subtract(start.X, CadGeometryGuard.Multiply(unit.X, before, label + "/overlap X"), label + "/extended X"),\n                        CadGeometryGuard.Subtract(start.Y, CadGeometryGuard.Multiply(unit.Y, before, label + "/overlap Y"), label + "/extended Y"),\n                        CadGeometryGuard.Subtract(start.Z, CadGeometryGuard.Multiply(unit.Z, before, label + "/overlap Z"), label + "/extended Z"));\n                    var extension = CadGeometryGuard.Add(before, after, label + "/combined overlap");\n                    var extendedLength = CadGeometryGuard.Add(length, extension, label + "/extended length");''',
          'endpoint-safe overlap')

          curved = 'src/QS3D.BricsCAD.V25/Cad/CurvedOpeningBooleanService.cs'
          replace_once(curved,
          '''            var baseZ = CadGeometryGuard.Add(hostElevationDrawing,\n                CadGeometryGuard.ToDrawingUnits(document, hostBottomOffsetM + baseElevationM, label + "/cutter base"), label + "/cutter world base");''',
          '''            var localBaseM = CadGeometryGuard.Add(hostBottomOffsetM, baseElevationM, label + "/cutter local base");\n            var baseZ = CadGeometryGuard.Add(hostElevationDrawing,\n                CadGeometryGuard.ToDrawingUnits(document, localBaseM, label + "/cutter base"), label + "/cutter world base");''',
          'curved opening guarded base elevation')
          PY
          git diff --check
          git diff --stat
      - name: Commit targeted overlap patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trinhtanphat'
          git config user.email '89531707+trinhtanphat@users.noreply.github.com'
          git add src/QS3D.BricsCAD.V25/Cad/BeamStirrupSolidBuilder.cs src/QS3D.BricsCAD.V25/Cad/CurvedOpeningBooleanService.cs
          git commit -m 'feat(rebar): merge bend hook geometry into current builders'
          git push origin HEAD:agent/beam-stirrup-release-current-20260810
